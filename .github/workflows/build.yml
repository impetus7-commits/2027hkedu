# src/index.html이 바뀌면 압축된 index.html을 자동으로 다시 만들어 저장합니다.
name: 페이지 빌드
on:
  push:
    paths:
      - 'src/**'
      - 'build/**'
      - 'package.json'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: 바뀐 index.html 저장
        run: |
          if git diff --quiet -- index.html; then echo "변경 없음"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "index.html 자동 빌드"
          git push
