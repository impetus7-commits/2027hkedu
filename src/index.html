                      </div>
                    </div>
                  </div>
                );
              };

              return (
                <div key={group.id} className="bg-white p-4 md:p-5 rounded-3xl shadow-sm border-[3px] border-slate-900 mb-4 lg:mb-5 h-fit">
                  <div className="flex justify-between items-center mb-3 pb-2 border-b-2 border-slate-100">

                    <div className="flex flex-col gap-6 mt-6 mb-2">

                          <span className="absolute -top-4 left-4 bg-white px-3 py-0.5 text-slate-700 font-extrabold text-base border border-slate-200 rounded-md shadow-sm">그 외 선택 과목</span>
                          <div className="grid grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-3 mt-3">{otherSubjects.map(s=>renderSubjectCard(s))}</div>
                        </div>
                      )}
                    </div>
                  ):(
                    otherSubjects.length>0&&(
                      <div className="grid grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-3">{otherSubjects.map(s=>renderSubjectCard(s))}</div>
                    )
                  )}
                </div>
              );
            })}
          </div>
        </div>

        {/* ── 오른쪽 패널 ── */}
        <div ref={rightPaneRef} className={`w-full flex flex-col transition-all duration-300 md:h-full md:min-h-0 md:overflow-y-auto md:pr-1 custom-scrollbar ${isRightPanelExpanded ? 'md:w-full md:col-span-2' : ''}`}>

                <button key={m.id} onClick={()=>goTab(m.tabs[0].id)}

            <div className="flex flex-wrap items-center gap-1.5">
              {activeMenu.tabs.length>1&&activeMenu.tabs.map(t=>(

                  {t.icon} {t.label}
                </button>
              ))}

                className="hidden md:inline-flex ml-auto items-center gap-1 px-3 py-1.5 rounded-full font-bold text-xs sm:text-sm bg-slate-700 text-white hover:bg-slate-800">
                {isRightPanelExpanded ? '▶◀ 원상복귀' : '◀▶ 화면확대'}
              </button>
            </div>
          </div>

          {/* 탭 내용들 */}
          <div className="w-full h-full pb-10">
            {activeTab==='planner'&&(
              <div className="bg-white rounded-3xl shadow-xl border border-slate-200 flex flex-col">

                  {!SHARED&&<button onClick={shareMySelection} className="no-print px-4 py-2 rounded-xl bg-white text-violet-800 font-black text-sm lg:text-base hover:bg-violet-50">🔗 내 선택 공유</button>}
                </div>
                <div className="p-2 lg:p-4 bg-white rounded-b-3xl">
                  {renderTimetable()}
                </div>
              </div>
            )}

            {activeTab==='major'&&(
              <div className="bg-white rounded-3xl shadow-xl border border-slate-200 flex flex-col p-4 lg:p-6">
                <div className="bg-indigo-900 text-white p-6 rounded-2xl text-center shrink-0 mb-6 shadow-md">
                  <h2 className="text-2xl lg:text-4xl font-black mb-2">🗺️ 대학 학과별 가이드북</h2>
                  <p className="text-indigo-200 text-base lg:text-xl font-medium">희망계열과 학과를 선택하여 학과별 상세 정보를 확인하세요.</p>
                </div>
                <div className="flex flex-col xl:flex-row gap-6">
                  <div className="w-full xl:w-1/4 flex flex-col gap-4 bg-slate-50 p-5 rounded-2xl border border-slate-200 h-fit shrink-0 shadow-sm">
                    <div>
                      <label className="block text-slate-800 font-extrabold text-lg lg:text-xl mb-2">1. 희망계열 선택</label>
                      <div className="relative">
                        <select className="w-full appearance-none border-2 border-slate-300 rounded-xl p-3 lg:p-4 text-lg font-bold text-slate-800 focus:border-indigo-500 bg-white" value={guideSelectedField} onChange={(e)=>{setGuideSelectedField(e.target.value);setGuideSelectedMajor('none');}}>
                          <option value="none">계열을 선택해주세요</option>
                          {dbFields.filter(f=>f.id!=='none').map(f=><option key={f.id} value={f.id}>{f.name}</option>)}
                        </select>
                      </div>
                    </div>
                    <div>
                      <label className="block text-slate-800 font-extrabold text-lg lg:text-xl mb-2">2. 희망 학과 선택</label>
                      <div className="relative">
                        <select className="w-full appearance-none border-2 border-slate-300 rounded-xl p-3 lg:p-4 text-lg font-bold text-slate-800 focus:border-blue-500 bg-white disabled:bg-slate-100 disabled:text-slate-400" value={guideSelectedMajor} onChange={(e)=>setGuideSelectedMajor(e.target.value)} disabled={guideSelectedField==='none'}>
                          <option value="none">학과를 선택해주세요</option>
                          {(dbMajors[guideSelectedField]||[]).filter(m=>m.id!=='none').map(m=><option key={m.id} value={m.id}>{m.name}</option>)}
                        </select>
                      </div>
                    </div>
                  </div>
                  <div className="w-full xl:w-3/4 pb-4">
                    {guideSelectedField !== 'none' && dbFieldDetails[guideSelectedField] ? (
                      <div className="flex flex-col gap-6 lg:gap-8">
                        {/* 계열 안내 표 */}
                        <div className="bg-white rounded-2xl shadow-sm border border-indigo-200 overflow-hidden">
                          <div className="bg-indigo-100 border-b border-indigo-200 px-5 py-4">
                            <h3 className="text-xl lg:text-2xl font-black text-indigo-900 flex items-center gap-2">
                              <span className="text-indigo-600">📁</span> {dbFieldDetails[guideSelectedField].name} 계열 안내
                            </h3>
                          </div>
                          <div className="p-0 overflow-x-auto">
                            <table className="w-full border-collapse text-left text-sm lg:text-base min-w-[500px]">
                              <tbody>
                                <tr className="border-b border-slate-200">
                                  <th className="bg-indigo-50/60 w-[25%] p-4 font-extrabold text-indigo-900 border-r border-slate-200">권장 선택과목(일반)</th>
                                  <td className="p-4 text-slate-800 font-medium leading-relaxed whitespace-pre-wrap">{formatReportText(dbFieldDetails[guideSelectedField].recGen)}</td>
                                </tr>
                                <tr className="border-b border-slate-200">
                                  <th className="bg-indigo-50/60 w-[25%] p-4 font-extrabold text-indigo-900 border-r border-slate-200">권장 선택과목(진로)</th>
                                  <td className="p-4 text-slate-800 font-medium leading-relaxed whitespace-pre-wrap">{formatReportText(dbFieldDetails[guideSelectedField].recCar)}</td>
                                </tr>
                                <tr className="border-b border-slate-200">
                                  <th className="bg-indigo-50/60 w-[25%] p-4 font-extrabold text-indigo-900 border-r border-slate-200">권장 선택과목(융합)</th>
                                  <td className="p-4 text-slate-800 font-medium leading-relaxed whitespace-pre-wrap">{formatReportText(dbFieldDetails[guideSelectedField].recConv)}</td>
                                </tr>
                                {dbFieldDetails[guideSelectedField].tip && (
                                  <tr className="border-b border-slate-200">
                                    <th className="bg-amber-100/60 w-[25%] p-4 font-extrabold text-amber-900 border-r border-slate-200">💡 전공 선택을 위한 팁</th>
                                    <td className="p-4 text-slate-800 font-medium leading-relaxed whitespace-pre-wrap">{formatReportText(dbFieldDetails[guideSelectedField].tip)}</td>
                                  </tr>
                                )}
                              </tbody>
                            </table>
                          </div>
                        </div>

                        {/* 학과 안내 표 */}
                        {guideSelectedMajor !== 'none' && dbDepartmentDetails[guideSelectedMajor] && (
                          <div className="bg-white rounded-2xl shadow-sm border border-blue-200 overflow-hidden">

            <div className="flex flex-col sm:flex-row sm:items-center gap-1.5 sm:gap-2 pointer-events-none">
              <span className="font-extrabold text-base">⚠️ 과학 중점 과정 요건 안내</span>
              <span className="text-[0.7rem] font-bold text-yellow-800 bg-yellow-300/60 px-2 py-0.5 rounded-md border border-yellow-400/50 w-fit">👆 팝업창 이동가능</span>
            </div>
            <button onClick={()=>setShowSciencePopup(false)} className="hover:opacity-70 p-1 bg-white/50 rounded-full text-xl self-start sm:self-auto">✕</button>
          </div>
          <div className="p-5 max-h-[350px] overflow-y-auto custom-scrollbar">
            <ul className="space-y-4">
              {evaluatedConditions.filter(c=>c.track!=='일반')
                .map((item)=>(
                <li key={item.key} className={`flex items-start gap-3 text-base font-bold p-4 rounded-xl bg-white/70 shadow-sm border ${item.status==='pass'?'border-green-300 bg-green-50/80':'border-yellow-200'}`}>
                  <span className="mt-0.5">{item.status==='pass'?'✅':'•'}</span>
                  <div className="flex-1 flex flex-col gap-1.5">
                    <div className="flex flex-wrap items-center gap-2">
                      <span className={`${item.status==='fail'?'text-red-600':item.status==='pass'?'text-slate-400 line-through decoration-2':'text-yellow-800'} break-keep leading-snug transition-all`}>{item.displayOriginal}</span>
                      {item.status==='pass' && <span className="text-[0.8rem] lg:text-sm text-green-700 bg-green-100 border border-green-300 px-2 py-1 rounded-md font-black whitespace-nowrap">완료</span>}
                    </div>
                    {item.currentStatusText&&<span className={`text-sm ${item.status==='pass'?'text-green-600':'text-red-500'}`}>{item.currentStatusText}</span>}
                  </div>
                </li>
              ))}
              {evaluatedConditions.filter(c=>c.track!=='일반').length===0&&(
                <li className="text-base text-slate-600">과학중점 과정 관련 조건이 없습니다.</li>
              )}
            </ul>
          </div>
        </div>
      )}

      {/* 일반 과정 팝업 */}
      {isGeneralTrack&&showGeneralPopup&&(
        <div className="fixed z-[1000] w-[340px] md:w-[450px] shadow-2xl rounded-2xl border-[3px] flex flex-col overflow-hidden no-print bg-orange-50 border-orange-500 draggable-popup" style={{left:`${generalPopupPos.x}px`,top:`${generalPopupPos.y}px`}}>
          <div onMouseDown={handleGeneralDragStart} onTouchStart={handleGeneralDragStart} className="cursor-move p-4 flex justify-between items-center select-none bg-orange-200 text-orange-900 border-b border-orange-300" style={{touchAction:'none'}}>
            <div className="flex flex-col sm:flex-row sm:items-center gap-1.5 sm:gap-2 pointer-events-none">
              <span className="font-extrabold text-base">📋 일반 과정 요건 안내</span>
              <span className="text-[0.7rem] font-bold text-orange-800 bg-orange-300/60 px-2 py-0.5 rounded-md border border-orange-400/50 w-fit">👆 팝업창 이동가능</span>
            </div>
            <button onClick={()=>setShowGeneralPopup(false)} className="hover:opacity-70 p-1 bg-white/50 rounded-full text-xl self-start sm:self-auto">✕</button>
          </div>
          <div className="p-5 max-h-[350px] overflow-y-auto custom-scrollbar">
            <ul className="space-y-4">
              {evaluatedConditions.filter(c=>c.track!=='과학중점')
                .map((item)=>(
                <li key={item.key} className={`flex items-start gap-3 text-base font-bold p-4 rounded-xl bg-white/70 shadow-sm border ${item.status==='pass'?'border-green-300 bg-green-50/80':'border-orange-200'}`}>
                  <span className="mt-0.5">{item.status==='pass'?'✅':'•'}</span>
                  <div className="flex-1 flex flex-col gap-1.5">
                    <div className="flex flex-wrap items-center gap-2">
                      <span className={`${item.status==='fail'?'text-red-600':item.status==='pass'?'text-slate-400 line-through decoration-2':'text-orange-800'} break-keep leading-snug transition-all`}>{item.displayOriginal}</span>
                      {item.status==='pass' && <span className="text-[0.8rem] lg:text-sm text-green-700 bg-green-100 border border-green-300 px-2 py-1 rounded-md font-black whitespace-nowrap">완료</span>}
                    </div>
                    {item.currentStatusText&&<span className={`text-sm ${item.status==='pass'?'text-green-600':'text-red-500'}`}>{item.currentStatusText}</span>}
                  </div>
                </li>
              ))}
            </ul>
          </div>
        </div>
      )}

      {/* TOP 이동 고정 버튼 (메인 화면용 - 좌/우 양쪽 배치) */}
      <button
        onClick={() => scrollPaneTop(rightPaneRef)}
        className="fixed bottom-20 md:bottom-6 right-4 md:right-6 z-[9989] flex items-center justify-center w-12 h-12 md:w-14 md:h-14 bg-slate-800 hover:bg-slate-900 text-white rounded-full shadow-2xl transition-transform hover:-translate-y-1 no-print border-2 border-slate-600 focus:outline-none"
        title="오른쪽 화면 맨 위로"
      >
        <span className="text-2xl font-black leading-none -mt-1">↑</span>
      </button>
      <button
        onClick={() => scrollPaneTop(leftPaneRef)}
        className="fixed bottom-20 md:bottom-6 left-4 md:left-6 z-[9989] flex items-center justify-center w-12 h-12 md:w-14 md:h-14 bg-slate-800 hover:bg-slate-900 text-white rounded-full shadow-2xl transition-transform hover:-translate-y-1 no-print border-2 border-slate-600 focus:outline-none"
        title="왼쪽 화면 맨 위로"
      >
        <span className="text-2xl font-black leading-none -mt-1">↑</span>
      </button>

    </div>
  );
}

// 입학년도를 아직 고르지 않은 학생에게 보여 주는 첫 화면
// 처음 접속한 기기: 시트에서 공개된 가장 최근 입학년도를 골라 바로 시작 (화면 상단에서 바꿀 수 있음)
function FirstVisit() {
  React.useEffect(() => {
    const pick = (years) => (years || []).filter(y => y.isPublic).sort((a, b) => b.year.localeCompare(a.year))[0];
    let cached = null;
    try { cached = JSON.parse(localStorage.getItem(YEARS_CACHE_KEY) || 'null'); } catch (e) {}
    const fromCache = pick(cached);
    if (fromCache) { goToYear(fromCache.year); return; }
    fetchSheet({ list: '1' }, 3).then(text => {
      const data = JSON.parse(text);
      const infoKey = Object.keys(data).find(k => k.replace(/\s+/g, '') === TAB_NAMES.info);
      const years = infoKey ? listYearsInInfo(data[infoKey]) : [];
      try { localStorage.setItem(YEARS_CACHE_KEY, JSON.stringify(years)); } catch (e) {}
      const chosen = pick(years);
      goToYear(chosen ? chosen.year : String(new Date().getFullYear()));
    }).catch(() => goToYear(String(new Date().getFullYear())));
  }, []);
  return (
    <div className="min-h-screen flex flex-col items-center justify-center gap-3 p-4">
      <h1 className="text-2xl md:text-3xl font-black text-blue-900 break-keep text-center">{SITE_TITLE}</h1>
      <p className="text-base font-bold text-slate-500">불러오는 중...</p>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(ACTIVE_YEAR ? <App /> : <FirstVisit />);
</script>
</body>
