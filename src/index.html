<script type="text/babel">
const { useState, useEffect, useMemo, useRef } = React;

// ── 유튜브 URL 변환 유틸 함수 ──
const getValidYouTubeUrl = (url) => {
  if (!url || typeof url !== 'string') return null;
  if (url.includes('youtube.com') || url.includes('youtu.be')) return url.trim();
  return null;
};

// ══════════════════════════════════════════════════════════════
// ── 학교 설정 ──
//    구글 시트 하나에 공통 탭 + 입학년도별 탭(예: 2027_과목데이터)을 모두 둡니다.
//    입학년도 목록은 시트의 [기본정보] 탭 열(2025, 2026, 2027 …)에서 자동으로 만들어집니다.
//    → 새 입학년도를 추가해도 이 코드는 고칠 필요가 없습니다.
//    주소 뒤에 ?year=2026 처럼 붙이면 해당 입학년도로 바로 열립니다(학생 비공개 학년 미리보기도 가능).
//    주소 뒤에 ?check=1 을 붙이면 시트 점검 화면이 나타납니다.
// ══════════════════════════════════════════════════════════════
// 설정 값은 루트의 config.js(window.APP_CONFIG)에서 읽습니다. 없으면 아래 기본값을 씁니다.
const APP_CONFIG = window.APP_CONFIG || {};
const SITE_TITLE = APP_CONFIG.SITE_TITLE || '2027 휘경여고 과목 선택 시스템';
const SITE_CREDIT = APP_CONFIG.SITE_CREDIT || '제작 : 이성호(교육과정부)';
const SHEET_URL = APP_CONFIG.SHEET_URL || 'https://script.google.com/macros/s/AKfycbzv8tm3tcaDKPkjKnoLrtz4l-qOGjCeYhx-7JFx30NIRY3JXpNlHB0oF1EF1t91WHqMIQ/exec';

const URL_PARAMS = new URLSearchParams(window.location.search);
const LAST_YEAR_KEY = 'hwikyung_last_year';
const YEARS_CACHE_KEY = 'hwikyung_years';
const readLastYear = () => { try { return localStorage.getItem(LAST_YEAR_KEY); } catch (e) { return null; } };
// 입학년도 결정 순서: 주소의 ?year= → 이 기기에서 마지막으로 고른 입학년도 → (없으면 선택 화면)
// 짧은 공유 코드: ?s=2026g + 계열(5) + 학과(5) + 과목마다 5자리 (영문 소문자·숫자만 → 카카오톡에서 링크가 끊기지 않음)
function shortHash(str) {
  let h = 0x811c9dc5;
  for (const ch of String(str)) { h ^= ch.codePointAt(0); h = Math.imul(h, 0x01000193) >>> 0; }
  return h.toString(36).padStart(7, '0').slice(-5);
}
const SHARE_CODE = (() => {
  const m = (URL_PARAMS.get('s') || '').toLowerCase().match(/^(\d{4})([gs])([0-9a-z]{5})([0-9a-z]{5})((?:[0-9a-z]{5})*)$/);
  return m ? { code: true, y: m[1], t: m[2], f: m[3], m: m[4], subs: m[5].match(/.{5}/g) || [] } : null;
})();
const ACTIVE_YEAR = [SHARE_CODE && SHARE_CODE.y, URL_PARAMS.get('year'), readLastYear()].find(y => /^\d{4}$/.test(y || '')) || null;
if (ACTIVE_YEAR && !URL_PARAMS.get('share') && !SHARE_CODE) { try { localStorage.setItem(LAST_YEAR_KEY, ACTIVE_YEAR); } catch (e) {} }

// 탭 이름 앞의 입학년도 떼어 내기: "2027_과목데이터" → { year: '2027', name: '과목데이터' }
const splitYearTab = (tabName) => {
  const m = String(tabName).trim().match(/^(\d{4})\s*[_\-]\s*(.+)$/);
  return m ? { year: m[1], name: m[2].trim() } : { year: null, name: String(tabName).trim() };
};

// 시트 자료 받기: ?year=2027 → 공통 탭 + 2027 탭만 / ?list=1 → [기본정보] 탭만 (입학년도 목록용)
const fetchSheet = async (params = {}, retries = 5) => {
  const query = new URLSearchParams({ ...params, t: String(Date.now()) }).toString();
  const delays = [1000, 2000, 4000, 8000, 16000];
  for (let i = 0; i < retries; i++) {
    try {
      const response = await fetch(`${SHEET_URL}?${query}`);
      if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
      const text = await response.text();
      if (!text || text.trim() === '') throw new Error('데이터가 비어있습니다.');
      if (text.trim().startsWith('<')) { const e = new Error("웹앱에 접근할 수 없습니다. 스크립트 배포 권한을 '모든 사용자'로 설정해주세요."); e.noRetry = true; throw e; }
      return text;
    } catch (err) {
      if (err.noRetry) throw err;
      if (i === retries - 1) throw new Error(`서버와의 통신이 원활하지 않습니다. (원인: ${err.name}: ${err.message})`);
      await new Promise(res => setTimeout(res, delays[i]));
    }
  }
};

// 오늘 날짜 기준 학년 (학년도는 3월 시작)
const gradeLabelOf = (admissionYear) => {
  const now = new Date();
  const schoolYear = now.getMonth() + 1 >= 3 ? now.getFullYear() : now.getFullYear() - 1;
  const grade = schoolYear - Number(admissionYear) + 1;
  if (grade <= 0) return '입학 예정';
  if (grade > 3) return '졸업';
  return `현재 ${grade}학년`;
};
// 입학년도 바꾸기: 이 기기에 기억하고 같은 페이지를 새로고침 (주소의 ?year= 는 지움)
const goToYear = (year) => {
  try { localStorage.setItem(LAST_YEAR_KEY, year); } catch (e) {}
  const params = new URLSearchParams(window.location.search);
  if (params.has('year')) { params.delete('year'); window.location.search = params.toString(); }
  else window.location.reload();
};
const CHECK_MODE = URL_PARAMS.get('check') === '1';
const STORAGE_KEY = `hwikyung_courses_${ACTIVE_YEAR}`;
const DATA_CACHE_KEY = `hwikyung_data_${ACTIVE_YEAR}`;   // 시트 자료 임시 저장 (다음 접속 때 바로 표시)

// 시트 탭 이름 (이 이름의 탭을 우선 사용하고, 없으면 제목 줄로 추측)
const TAB_NAMES = {

};

// ── 시트에 [기본정보] 탭이 없을 때 쓰는 기본값 ──

// ── 시트에 [선택군] 탭이 없을 때 쓰는 기본값 ──
const DEFAULT_GROUPS = [
  { id: '2A', label: 'A', semester: '2-1', maxPick: 3, totalCredits: 12 },
  { id: '2B', label: 'B', semester: '2-2', maxPick: 3, totalCredits: 12 },

const R = (track, type, scope, opts = {}) => ({ track, type, scope, categories: [], subjects: [], minCount: null, maxCount: null, minCredits: null, maxCredits: null, combine: '모두', includeMandatory: false, text: '', ...opts });
const KME = ['국어', '수학', '영어'];
const DEFAULT_RULES = [

  R('전체', '안내', '2E,2F', { text: '희망자에 한해 2학년에서 공유캠퍼스 과목을 추가 신청할 수 있음' }),

// ── 유틸 함수 ──
const normalizeForMatch = (str) => {
  if (!str) return '';
  let s = str.replace(/\(.*?\)/g, '').replace(/\[.*?\]/g, '').replace(/등\s*$/g, '');
  s = s.replace(/\s+/g, '')
    .replace(/Ⅰ/g,'I').replace(/Ⅱ/g,'II').replace(/Ⅲ/g,'III').replace(/Ⅳ/g,'IV')
    .replace(/[^a-zA-Z0-9가-힣+]/g,'').toUpperCase();
  return s.replace(/등$/, '');
};

const normalizeType = (typeStr, nameStr) => {
  if (typeStr && typeStr.trim() !== '') {
    const t = typeStr.replace(/\s+/g,'');
    if (t.includes('제2외국어')||t.includes('한문')||t.includes('외국어')) return '제2외국어/한문';
    if (t.includes('국어')) return '국어';
    if (t.includes('수학')) return '수학';
    if (t.includes('영어')) return '영어';
    if (t.includes('사회')) return '사회 (역사/도덕 포함)';
    if (t.includes('과학')) return '과학';
    if (t.includes('체육')) return '체육';
    if (t.includes('예술')||t.includes('음악')||t.includes('미술')) return '예술';
    if (t.includes('기술')||t.includes('가정')||t.includes('정보')) return '기술·가정/정보';
    if (t.includes('교양')) return '교양';
    return typeStr.trim();
  }
  const n = (nameStr||'').replace(/\s+/g,'');
  if (/제2외국어|일본어|중국어|한문|스페인어|프랑스어|독일어|러시아어|아랍어|베트남어/.test(n)) return '제2외국어/한문';
  if (/국어|문학|화법|독서|언어와매체/.test(n)) return '국어';
  if (/수학|대수|미적분|기하|통계/.test(n)) return '수학';
  if (/영어|영독/.test(n)) return '영어';
  if (/사회|한국사|지리|역사|정치|경제|윤리|법/.test(n)) return '사회 (역사/도덕 포함)';
  if (/체육|운동|스포츠/.test(n)) return '체육';
  if (/과학|물리|화학|생명|지구/.test(n)) return '과학';
  if (/음악|미술|예술/.test(n)) return '예술';
  if (/기술|가정|정보|인공지능|컴퓨터/.test(n)) return '기술·가정/정보';
  if (/교양|논리|교육|심리|철학|진로|환경/.test(n)) return '교양';
  return '기타';
};

const getSemesterFromText = (text) => {
  if (!text||typeof text!=='string') return null;
  const t = text.replace(/\s+/g,'');
  if(t.includes('1학년1학기')) return '1-1';
  if(t.includes('1학년2학기')) return '1-2';
  if(t.includes('2학년1학기')) return '2-1';
  if(t.includes('2학년2학기')) return '2-2';
  if(t.includes('3학년1학기')) return '3-1';
  if(t.includes('3학년2학기')) return '3-2';
  return null;
};

// 편성 문구(예: "2학년 2A군(2학년 1학기) 선택")에서 선택군 ID 찾기
const findGroupInText = (text, groups) => {
  if (!text||typeof text!=='string') return null;
  const t = text.replace(/\s+/g,'').toUpperCase();
  const ids = groups.map(g=>g.id).sort((a,b)=>b.length-a.length);
  return ids.find(id => t.includes(id.toUpperCase())) || null;
};

// ══════════════════════════════════════════════════════════════
// ── 규칙 엔진: [규칙] 탭의 각 줄을 계산합니다 ──
// ══════════════════════════════════════════════════════════════
const splitList = (v) => String(v||'').split(/[,，、\n]+/).map(x=>x.trim()).filter(Boolean);
const toNumOrNull = (v) => { const n = parseFloat(String(v??'').replace(/[^0-9.]/g,'')); return isNaN(n) ? null : n; };
const isYes = (v) => /^(o|O|○|●|예|y|Y|yes|true|1|v|V|✔|✓)$/.test(String(v??'').trim());
const sumCredits = (list) => list.reduce((sum, s) => sum + (s.credits||0), 0);
const inSubjectList = (name, list) => list.some(x => normalizeForMatch(x) === normalizeForMatch(name));

const normalizeTrack = (v) => {
  const t = String(v||'').replace(/\s+/g,'');
  if (t.includes('과학')) return '과학중점';
  if (t.includes('일반')) return '일반';
  return '전체';
};
const ruleAppliesToTrack = (rule, isScienceTrack) => rule.track === '전체' || rule.track === (isScienceTrack ? '과학중점' : '일반');

// "2A, 2B" → 해당 군 / "2학년"·"3학년" → 해당 학년의 군 / "전체"·빈칸 → 희망자 군을 뺀 모든 군
const resolveScope = (scope, groups) => {
  const s = String(scope||'').replace(/\s+/g,'').toUpperCase();
  const regular = groups.filter(g => !g.isOptional);
  const named = groups.filter(g => s.includes(g.id.toUpperCase()));
  if (named.length > 0) return { ids: named.map(g=>g.id), explicit: true };
  if (/^2학년/.test(s)) return { ids: regular.filter(g=>g.semester.startsWith('2-')).map(g=>g.id), explicit: false };
  if (/^3학년/.test(s)) return { ids: regular.filter(g=>g.semester.startsWith('3-')).map(g=>g.id), explicit: false };
  return { ids: regular.map(g=>g.id), explicit: false };
};

const prepareRules = (rules, groups) => rules.map((r, i) => {
  const scope = resolveScope(r.scope, groups);
  return { ...r, key: `r${i}`, groupIds: scope.ids, scopeExplicit: scope.explicit };
});

// 교과 이름으로 과목 맞추기 ('정보'는 기술·가정/정보 중 정보 계열 과목만)
const matchesCategory = (subj, cat) => {
  const t = normalizeType(subj.type, subj.name);
  if (String(cat).replace(/\s+/g,'') === '정보') return t === '기술·가정/정보' && INFO_SUBJECT_RE.test(subj.name);
  return normalizeType(cat, '') === t;
};
const matchesRule = (subj, rule) => {
  if (rule.categories.length === 0 && rule.subjects.length === 0) return true;
  return rule.categories.some(c => matchesCategory(subj, c)) || inSubjectList(subj.name, rule.subjects);
};

const ruleTally = (rule, list, mandatoryList) => {
  const matched = list.filter(s => matchesRule(s, rule));
  const mand = rule.includeMandatory ? mandatoryList.filter(m => matchesRule(m, rule)) : [];
  const count = matched.length + mand.length;
  const credits = sumCredits(matched) + sumCredits(mand);
  const parts = [];
  if (rule.minCredits != null || rule.maxCredits != null) parts.push(`${credits}학점`);
  if (rule.minCount != null || rule.maxCount != null || parts.length === 0) parts.push(`${count}과목`);
  return { count, credits, text: parts.join('/') };
};

// 현재 선택 상태에서 규칙 한 줄의 결과: pass(충족) / fail(위반) / info(진행 중·안내)
const evaluateRule = (rule, ctx) => {
  const { groupMap, selected, mandatoryList } = ctx;
  const scopeGroups = rule.groupIds.map(id => groupMap[id]).filter(Boolean);
  const inScope = selected.filter(s => rule.groupIds.includes(s.group));
  const isComplete = scopeGroups.every(g => selected.filter(s => s.group === g.id).length >= g.maxPick);
  const progress = scopeGroups.map(g => `${g.label}(${selected.filter(s => s.group === g.id).length}/${g.maxPick})`).join(', ');
  const res = (status, detail) => ({ status, detail });

  switch (rule.type) {
    case '선택개수':
      return isComplete ? res('pass', '(선택 완료)') : res('info', `(선택 진행 중... ${progress})`);
    case '지정과목': {
      const bad = inScope.filter(s => !inSubjectList(s.name, rule.subjects));
      if (bad.length > 0) return res('fail', `(요건 위반 - 지정되지 않은 과목: ${bad.map(s=>s.name).join(', ')})`);
      return isComplete ? res('pass', '(조건 충족)') : res('info', `(선택 진행 중... ${progress})`);
    }
    case '중복금지': {
      const names = inScope.filter(s => matchesRule(s, rule)).map(s => normalizeForMatch(s.name));
      if (names.some((n, i) => names.indexOf(n) !== i)) return res('fail', '(중복 선택됨 - 요건 위반)');
      return isComplete ? res('pass', '(중복 없음)') : res('info', `(선택 진행 중... ${progress})`);
    }
    case '교과별기준': {
      const counts = rule.categories.map(c => [c, inScope.filter(s => matchesCategory(s, c)).length]);
      const txt = counts.map(([c, n]) => `${c} ${n}`).join(', ');
      if (rule.maxCount != null && counts.some(([, n]) => n > rule.maxCount)) return res('fail', `(요건 위반 - ${txt})`);
      const ok = rule.minCount == null || counts.every(([, n]) => n >= rule.minCount);
      if (!isComplete) return res('info', `(선택 진행 중... ${txt})`);
      return ok ? res('pass', `(조건 충족 - ${txt})`) : res('fail', `(요건 미달 - ${txt})`);
    }
    case '교과기준':
    case '권장': {
      const t = ruleTally(rule, inScope, mandatoryList);
      const over = (rule.maxCount != null && t.count > rule.maxCount) || (rule.maxCredits != null && t.credits > rule.maxCredits);
      if (over) return res(rule.type === '권장' ? 'info' : 'fail', `(요건 위반 - 현재 ${t.text})`);
      const mins = [];
      if (rule.minCount != null) mins.push(t.count >= rule.minCount);
      if (rule.minCredits != null) mins.push(t.credits >= rule.minCredits);
      if (mins.length === 0) return isComplete ? res('pass', `(조건 충족: ${t.text})`) : res('info', `(선택 진행 중... 현재 ${t.text})`);
      const met = rule.combine === '하나' ? mins.some(Boolean) : mins.every(Boolean);
      if (met) return res('pass', `(충족: ${t.text})`);
      if (!isComplete) return res('info', `(선택 진행 중... 현재 ${t.text})`);
      return rule.type === '권장' ? res('pass', `(권장 사항 - 필수는 아님, 현재 ${t.text})`) : res('fail', `(미달: 현재 ${t.text})`);
    }
    default:
      return res('info', '');
  }
};

// 과목을 담을 때 규칙을 어기거나, 담으면 나중에 규칙을 채울 수 없게 되는지 확인
const getAddViolation = (rule, subject, nextSelected, ctx) => {
  if (!rule.groupIds.includes(subject.group)) return null;
  const { groupMap, mandatoryList } = ctx;
  const scopeGroups = rule.groupIds.map(id => groupMap[id]).filter(Boolean);
  const inScope = nextSelected.filter(s => rule.groupIds.includes(s.group));
  const remainingPicks = scopeGroups.reduce((sum, g) => sum + g.maxPick, 0) - inScope.length;
  const remainingCredits = scopeGroups.reduce((sum, g) => sum + (g.totalCredits||0), 0) - sumCredits(inScope);

  switch (rule.type) {
    case '지정과목':
      return inSubjectList(subject.name, rule.subjects) ? null : '이 군에서는 지정된 과목 중에서만 선택할 수 있습니다.';
    case '중복금지': {
      if (!matchesRule(subject, rule)) return null;
      const same = inScope.filter(s => matchesRule(s, rule) && normalizeForMatch(s.name) === normalizeForMatch(subject.name));
      return same.length > 1 ? `'${subject.name}' 과목은 1, 2학기에 중복해서 선택할 수 없습니다.` : null;
    }
    case '교과별기준': {
      const counts = rule.categories.map(c => [c, inScope.filter(s => matchesCategory(s, c)).length]);
      const over = counts.find(([, n]) => rule.maxCount != null && n > rule.maxCount);
      if (over) return `${over[0]} 교과군 과목은 최대 ${rule.maxCount}과목까지만 선택할 수 있습니다.`;
      if (rule.minCount != null) {
        const deficit = counts.reduce((sum, [, n]) => sum + Math.max(0, rule.minCount - n), 0);
        if (deficit > remainingPicks) return '이 과목을 담으면 남은 자리로는 위 조건을 채울 수 없습니다.';
      }
      return null;
    }
    case '교과기준': {
      const t = ruleTally(rule, inScope, mandatoryList);
      if (rule.maxCount != null && t.count > rule.maxCount) return `해당 과목은 합쳐서 최대 ${rule.maxCount}과목까지만 선택할 수 있습니다.`;
      if (rule.maxCredits != null && t.credits > rule.maxCredits) return `이 과목을 담으면 ${t.credits}학점이 되어 ${rule.maxCredits}학점을 넘습니다.`;
      if (rule.combine !== '하나') {
        if (rule.minCount != null && rule.minCount - t.count > remainingPicks) return '이 과목을 담으면 남은 자리로는 위 조건을 채울 수 없습니다.';
        if (rule.minCredits != null && t.credits + remainingCredits < rule.minCredits) return `이 과목을 담으면 최대 ${t.credits + remainingCredits}학점까지만 가능해 ${rule.minCredits}학점을 채울 수 없습니다.`;
      }
      return null;
    }
    default:
      return null;
  }
};

// ── 용어 풀이 (시트에 [용어풀이] 탭이 있으면 그 내용이 더해지고 덮어씀) ──

// 용어 옆 ⓘ: 누르면 짧은 설명이 열림
function Term({ k, children, className = '' }) {
  const [open, setOpen] = React.useState(false);
  const text = GLOSSARY[k];
  if (!text) return <>{children}</>;
  return (
    <span className={`relative inline-flex items-center gap-0.5 ${className}`}>
      {children}
      <button type="button" aria-label={`${k} 뜻 보기`} onClick={e => { e.preventDefault(); e.stopPropagation(); setOpen(!open); }}
        className="no-print inline-flex items-center justify-center w-4 h-4 text-[10px] leading-none font-black rounded-full bg-slate-200 text-slate-600 hover:bg-blue-600 hover:text-white align-middle">i</button>
      {open && (
        <span onClick={e => { e.stopPropagation(); setOpen(false); }}
          className="absolute left-0 top-full mt-1 z-[2000] w-64 max-w-[80vw] p-3 rounded-xl bg-slate-900 text-white text-xs lg:text-sm font-medium leading-relaxed shadow-xl text-left whitespace-normal break-keep cursor-pointer">
          <b className="block mb-1 text-blue-200">{k}</b>{text}<span className="block mt-1 text-[10px] text-slate-400">(눌러서 닫기)</span>
        </span>
      )}
    </span>
  );
}

// ── 공유 링크: 선택 내용을 주소에 담기 (이름·학번은 담지 않음) ──
const encodeShare = (obj) => {
  const bytes = new TextEncoder().encode(JSON.stringify(obj));
  let bin = ''; bytes.forEach(b => { bin += String.fromCharCode(b); });
  return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
};
const decodeShare = (str) => {
  try {
    const b64 = str.replace(/-/g, '+').replace(/_/g, '/');
    const bin = atob(b64 + '==='.slice((b64.length + 3) % 4));
    return JSON.parse(new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0))));
  } catch (e) { return null; }
};
const SHARED = SHARE_CODE || (URL_PARAMS.get('share') ? decodeShare(URL_PARAMS.get('share')) : null);

// ── 공지: "2027-03-05 수강신청 마감" → 날짜가 있으면 D-day, 지난 공지는 숨김 ──
const parseNotices = (text) => String(text || '').split('\n').map(l => l.trim()).filter(Boolean).map(line => {
  const m = line.match(/^(\d{4})[.\-/](\d{1,2})[.\-/](\d{1,2})\.?\s*[|:\-]?\s*(.*)$/);
  if (!m) return { text: line, dday: null };
  const date = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const diff = Math.round((date - today) / 86400000);
  return { text: m[4] || line, date: `${Number(m[2])}/${Number(m[3])}`, dday: diff };
}).filter(n => n.dday === null || n.dday >= 0);

// ── 대학별 이수권장과목 도우미 ──
// "기계공학부, 전기정보공학부(전자전공)" → 괄호 안 쉼표는 나누지 않음
const splitUnits = (text) => {
  const out = []; let depth = 0, buf = '';
  for (const ch of String(text || '')) {
    if (ch === '(' || ch === '（') depth++;
    if (ch === ')' || ch === '）') depth = Math.max(0, depth - 1);
    if ((ch === ',' || ch === '，') && depth === 0) { if (buf.trim()) out.push(buf.trim()); buf = ''; } else buf += ch;
  }
  if (buf.trim()) out.push(buf.trim());
  return out;
};
// "[수학] (핵심) 대수, 미적분Ⅰ (권장) 기하" → { subj:'수학', core:'대수, 미적분Ⅰ', rec:'기하', other:'' }
const parseUnivRec = (text) => String(text || '').split('\n').map(l => l.trim()).filter(Boolean).map(line => {
  const m = line.match(/^\[([^\]]+)\]\s*(.*)$/);
  const rest = m ? m[2] : line;
  const core = ((rest.match(/\(핵심\)\s*(.*?)(?=\(권장\)|$)/) || [])[1] || '').trim();
  const rec = ((rest.match(/\(권장\)\s*(.*?)(?=\(핵심\)|$)/) || [])[1] || '').trim();
  return { subj: m ? m[1] : '', core, rec, other: core || rec ? '' : rest };
});
const normLoose = (s) => String(s || '').replace(/\s+/g, '').replace(/Ⅰ/g, 'I').replace(/Ⅱ/g, 'II').replace(/Ⅲ/g, 'III').toUpperCase();
// 권장 문장에 나오는 우리 학교 과목 찾기 (긴 이름부터 찾아 '화학 반응의 세계' 속 '화학'은 따로 세지 않음)
const findSubjectsInText = (text, subjects) => {
  let t = normLoose(text); const found = [];
  [...subjects].sort((a, b) => normLoose(b.name).length - normLoose(a.name).length).forEach(s => {
    const n = normLoose(s.name);
    if (n.length >= 2 && t.includes(n)) { found.push(s); t = t.split(n).join('|'); }
  });
  return found;
};

// 규칙 안내문 속 군 ID(2A 등)를 학생에게 보이는 이름(A 등)으로 바꾸기
const replaceGroupIds = (text, groups) => {
  if (!text || groups.length === 0) return text || '';
  const ids = groups.map(g => g.id).sort((a, b) => b.length - a.length).map(id => id.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
  const labelMap = Object.fromEntries(groups.map(g => [g.id, g.label]));
  return text.replace(new RegExp(`(?<![0-9A-Za-z])(${ids.join('|')})(?![0-9A-Za-z])`, 'g'), m => labelMap[m] || m);
};

// ── 시트 탭 → 설정값 변환 ──
const normHeader = (h) => String(h??'').replace(/"/g,'').replace(/\s+/g,'');
const headerIndex = (headers, ...aliases) => {
  const hs = headers.map(normHeader);
  for (const a of aliases) { const i = hs.indexOf(normHeader(a)); if (i !== -1) return i; }
  for (const a of aliases) { const i = hs.findIndex(h => h.includes(normHeader(a))); if (i !== -1) return i; }
  return -1;
};
const cell = (row, i) => (i !== -1 && row[i] != null) ? String(row[i]).trim() : '';

// [기본정보] 탭: "항목 | 2025 | 2026 | 2027 | 설명"처럼 입학년도별 열 (예전 "항목 | 값" 형식도 읽음)
const listYearsInInfo = (rows) => {
  if (!rows || rows.length === 0) return [];
  const header = rows[0].map(normHeader);
  const pubRow = rows.find(r => /공개/.test(normHeader(r[0])));
  return header.map((h, i) => ({ h, i })).filter(x => /^\d{4}$/.test(x.h)).map(({ h, i }) => ({
    year: h,
    isPublic: !(pubRow && /^(x|X|×|아니오|비공개|N|n)$/.test(String(pubRow[i] ?? '').trim())),
  }));
};

const parseInfoSheet = (rows, year) => {
  const header = rows[0].map(normHeader);
  const years = listYearsInInfo(rows);
  const col = years.length ? header.indexOf(String(year)) : 1;
  const map = {};
  if (col !== -1) rows.slice(1).forEach(r => { const k = normHeader(r[0]); if (k) map[k] = String(r[col]??'').trim(); });
  const pick = (...keys) => { for (const k of keys) if (map[normHeader(k)]) return map[normHeader(k)]; return ''; };
  return {
    schoolName: pick('학교명') || DEFAULT_INFO.schoolName,
    schoolShort: pick('학교약칭', '약칭') || DEFAULT_INFO.schoolShort,
    admissionYear: (pick('입학년도', '입학연도').match(/\d{4}/)||[])[0] || (years.length ? String(year) : DEFAULT_INFO.admissionYear),
    csatYear: (pick('수능년도', '수능연도', '수능').match(/\d{4}/)||[])[0] || DEFAULT_INFO.csatYear,
    semesterCredits: toNumOrNull(pick('학기별교과학점', '학기당교과학점')) || DEFAULT_INFO.semesterCredits,
    tracks: pick('운영과정') ? (pick('운영과정').includes('과학') ? ['일반', '과학중점'] : ['일반']) : DEFAULT_INFO.tracks,
    source: pick('자료출처', '출처') || DEFAULT_INFO.source,
    notice: pick('공지', '알림'),
    years,
    yearMissing: years.length > 0 && col === -1,
  };
};

const parseSemester = (v) => {
  const s = String(v||'').replace(/\s+/g,'');
  const m = s.match(/^([1-3])-([12])$/) || s.match(/([1-3])학년([12])학기/);
  return m ? `${m[1]}-${m[2]}` : null;
};

const parseGroupsSheet = (rows, issues) => {
  const h = rows[0];
  const ix = {
    id: headerIndex(h, '군ID', '군코드', 'ID'), label: headerIndex(h, '표시이름', '표시'),
    sem: headerIndex(h, '학기'), pick: headerIndex(h, '선택과목수', '택'), credits: headerIndex(h, '학점'),
    optional: headerIndex(h, '희망자선택', '희망자'), shared: headerIndex(h, '공유캠퍼스'), notice: headerIndex(h, '안내문', '안내'),
  };
  const groups = [];
  rows.slice(1).forEach((r, i) => {
    const id = cell(r, ix.id).toUpperCase().replace(/\s+/g,'');
    if (!id) return;
    const semester = parseSemester(cell(r, ix.sem));
    const maxPick = toNumOrNull(cell(r, ix.pick));
    if (!semester) issues.push(`[선택군] ${i+2}행 ${id}: 학기를 알 수 없습니다 ('2-1'처럼 적어 주세요).`);
    if (!maxPick) issues.push(`[선택군] ${i+2}행 ${id}: 선택과목수가 비어 있습니다.`);
    if (!semester || !maxPick) return;
    const isSharedCampus = isYes(cell(r, ix.shared));
    groups.push({
      id, label: cell(r, ix.label) || id, semester, maxPick,
      totalCredits: toNumOrNull(cell(r, ix.credits)) || 0,
      isOptional: isYes(cell(r, ix.optional)) || isSharedCampus, isSharedCampus,
      notice: cell(r, ix.notice),
    });
  });
  return groups;
};

const parseRulesSheet = (rows, issues) => {
  const h = rows[0];
  const ix = {
    track: headerIndex(h, '과정'), type: headerIndex(h, '규칙유형', '유형'), scope: headerIndex(h, '대상군', '적용군'),
    cats: headerIndex(h, '대상교과'), subs: headerIndex(h, '대상과목'),
    minCount: headerIndex(h, '최소과목'), maxCount: headerIndex(h, '최대과목'),
    minCredits: headerIndex(h, '최소학점'), maxCredits: headerIndex(h, '최대학점'),
    combine: headerIndex(h, '충족방식'), mand: headerIndex(h, '지정과목포함'), text: headerIndex(h, '안내문', '설명'),
  };
  const rules = [];
  rows.slice(1).forEach((r, i) => {
    const typeRaw = cell(r, ix.type).replace(/\s+/g,'');
    const text = cell(r, ix.text);
    if (!typeRaw && !text) return;
    let type = typeRaw;
    if (!RULE_TYPES.includes(type)) {
      issues.push(`[규칙] ${i+2}행: 규칙유형 '${typeRaw}'을(를) 알 수 없어 '안내'로 처리했습니다. (${RULE_TYPES.join(' / ')})`);
      type = '안내';
    }
    rules.push(R(normalizeTrack(cell(r, ix.track)), type, cell(r, ix.scope), {
      categories: splitList(cell(r, ix.cats)), subjects: splitList(cell(r, ix.subs)),
      minCount: toNumOrNull(cell(r, ix.minCount)), maxCount: toNumOrNull(cell(r, ix.maxCount)),
      minCredits: toNumOrNull(cell(r, ix.minCredits)), maxCredits: toNumOrNull(cell(r, ix.maxCredits)),
      combine: cell(r, ix.combine).includes('하나') || cell(r, ix.combine).includes('또는') ? '하나' : '모두',
      includeMandatory: isYes(cell(r, ix.mand)), text, row: i + 2,
    }));
  });
  return rules;
};

const parseCSV = (str) => {
  const arr = [];
  let quote=false, row=[], col='';
  for(let c=0;c<str.length;c++){
    let cc=str[c],nc=str[c+1];
    if(cc==='"'&&quote&&nc==='"'){col+=cc;c++;continue;}
    if(cc==='"'){quote=!quote;continue;}
    if(cc===','&&!quote){row.push(col.trim());col='';continue;}
    if(cc==='\n'&&!quote){
      if(col.endsWith('\r'))col=col.slice(0,-1);
      row.push(col.trim());arr.push(row);row=[];col='';continue;
    }
    col+=cc;
  }
  if(col.endsWith('\r'))col=col.slice(0,-1);
  row.push(col.trim());
  if(row.length>0)arr.push(row);
  return arr;
};

const isInvalidData = (val) => {
  if (!val) return true;
  const v = String(val).trim();
  return v===''||v==='-'||v.replace(/-/g,'')===''||v.toLowerCase()==='n/a'||v==='없음'||v==='.';
};

const formatReportText = (text, mark) => {
  if (!text||String(text).trim()===''||String(text).trim()==='-') return '-';
  let str = String(text);  
  str = str.replace(/\s*(\[[^\]]+\])\s*/g, '\n$1 ');
  str = str.replace(/(^|\n)\s*-\s*/g, '$1- ');
  str = str.replace(/,\s*/g, ', ');
  str = str.replace(/\n+/g, '\n').trim();

  // mark: 내가 선택한 과목명(normalizeForMatch 값) 모음 → 쉼표로 나뉜 과목명 중 일치하면 굵게+형광 표시
  const markItems = (t) => {
    if (!mark || mark.size === 0) return t;
    return t.split(/(,\s*)/).map((part, i) => {
      const key = normalizeForMatch(part.replace(/^\[[^\]]*\]\s*/, '').replace(/^-\s*/, ''));
      if (i % 2 === 1 || !key || !mark.has(key)) return part;
      return <mark key={i} className="report-mine" style={{fontWeight:900,background:'#fde047',color:'#111827',padding:'0 3px',borderRadius:'3px'}}>{part}</mark>;
    });
  };
  return str.split('\n').map((line,idx)=>{
    const t=line.trim();
    return t?<span key={idx} className="block mt-1.5 first:mt-0 break-keep">{markItems(t)}</span>:null;
  });
};

    if (isDraggingScience || isDraggingGeneral || isDraggingInfo) {

  }, [isDraggingScience, isDraggingGeneral, isDraggingInfo]);

  // localStorage 불러오기
  useEffect(() => {

        setShowSciencePopup(p.isScienceTrack||false);
        setShowGeneralPopup(p.isGeneralTrack||false);

    }
  }, []);

  // localStorage 저장
  useEffect(() => {

  }, [selectedIds,selectedField,selectedMajor,isScienceTrack,isGeneralTrack,studentInfo]);

  useEffect(() => { if (!shareMsg) return; const t = setTimeout(() => setShareMsg(''), 4000); return () => clearTimeout(t); }, [shareMsg]);
  const leaveShared = () => { const params = new URLSearchParams(window.location.search); params.delete('share'); params.delete('s'); window.location.search = params.toString(); };

  useEffect(() => {

  // 데이터 Fetch
  // 시트 원본(JSON 글자)을 화면에 쓰는 데이터로 바꾸기
  const applySheetText = (text) => {
      let parsedSubjects=[], parsedFields=[], parsedMajors=[], parsedConditions=[], parsedUnivRecs=[], parsedTimetable=[], dataArrays=[];
      let parsedInfo=[], parsedGroups=[], parsedRules=[], parsedSharedCampus=[], parsedIntro=[], parsedJobs=[], parsedAiJobs=[], parsedGlossary=[];
      const issues=[], notes=[];
      
      try {
        const jsonData = JSON.parse(text);
        if(jsonData!==null&&typeof jsonData==='object'&&!Array.isArray(jsonData)){
          // 공통 탭 먼저, 그다음 이 입학년도 탭(같은 이름이면 입학년도 탭이 우선). 다른 입학년도 탭은 건너뜀
          const commonTabs=[], yearTabs=[];
          Object.keys(jsonData).forEach(key=>{
            const t=splitYearTab(key);
            if(t.year===null) commonTabs.push({key,name:t.name});
            else if(t.year===ACTIVE_YEAR) yearTabs.push({key,name:t.name});

          if(yearTabs.length>0) notes.push(`${ACTIVE_YEAR} 입학년도 탭: ${yearTabs.map(t=>t.key).join(', ')} / 공통 탭: ${commonTabs.map(t=>t.key).join(', ')}`);
          [...commonTabs,...yearTabs].forEach(({key,name})=>{
            const sheetData=jsonData[key];
            if(!Array.isArray(sheetData)||sheetData.length===0) return;
            let rows=[];
            if(typeof sheetData[0]==='object'&&!Array.isArray(sheetData[0])){
              const keySet=new Set();
              sheetData.forEach(obj=>Object.keys(obj).forEach(k=>keySet.add(k)));
              const headers=Array.from(keySet);
              rows.push(headers);
              sheetData.forEach(obj=>rows.push(headers.map(h=>obj[h]!=null?String(obj[h]):'')));
            } else { rows=sheetData; }
            
            const k=name.replace(/\s+/g,'');
            const headerStr = rows.length > 0 ? rows[0].join('').replace(/\s+/g, '') : '';
            
            // 1) 정해진 탭 이름이면 그대로 사용
            const exact = Object.keys(TAB_NAMES).find(t => TAB_NAMES[t].replace(/\s+/g,'') === k);
            if (exact === 'info') { parsedInfo = rows; return; }
            if (exact === 'groups') { parsedGroups = rows; return; }
            if (exact === 'rules') { parsedRules = rows; return; }
            if (exact === 'sharedCampus') { parsedSharedCampus = rows; return; }
            if (exact === 'subjects') { parsedSubjects = rows; return; }
            if (exact === 'fields') { parsedFields = rows; return; }
            if (exact === 'majors') { parsedMajors = rows; return; }
            if (exact === 'univ') { parsedUnivRecs = rows; return; }
            if (exact === 'conditions') { parsedConditions = rows; return; }
            if (exact === 'intro') { parsedIntro = rows; return; }
            if (exact === 'jobs') { parsedJobs = rows; return; }
            if (exact === 'aiJobs') { parsedAiJobs = rows; return; }
            if (exact === 'glossary') { parsedGlossary = rows; return; }

            // 2) 이름이 다르면 탭 이름·제목 줄로 추측
            if (k.includes('대학별') || k.includes('이수권장')) {
                parsedUnivRecs = rows;
            } else if (parsedSubjects.length === 0 && headerStr.includes('과목명') && headerStr.includes('편성')) {
                parsedSubjects = rows;
            } else if (parsedMajors.length === 0 && headerStr.includes('학과명') || (headerStr.includes('학과') && (headerStr.includes('유사') || headerStr.includes('주요전공')))) {
                parsedMajors = rows; 
            } else if (parsedFields.length === 0 && headerStr.includes('계열') && (headerStr.includes('설명') || headerStr.includes('특성'))) {
                parsedFields = rows; 
            } else if (k.includes('조건') || k.includes('유의')) {
                parsedConditions = rows;
            } else if (headerStr.includes('휘경여자고등학교') || headerStr.includes('학점배당표') || k.includes('편제') || k.includes('입학생')) {
                parsedTimetable = rows;
            }
            else if (parsedSubjects.length === 0 && (k.includes('과목데이터') || k === '과목' || k.includes('선택과목'))) { parsedSubjects = rows; }
            else if (parsedMajors.length === 0 && (k.includes('학과') || k.includes('전공'))) { parsedMajors = rows; }
            else if (parsedFields.length === 0 && (k.includes('계열') || k.includes('진로'))) { parsedFields = rows; }
            else { dataArrays.push(rows); }
          });
        } else if(Array.isArray(jsonData)){
          if(jsonData.length>0&&Array.isArray(jsonData[0])&&Array.isArray(jsonData[0][0])) { dataArrays=jsonData; }
          else { dataArrays=[jsonData]; }
        }
      } catch(e) { dataArrays=[parseCSV(text)]; }

      const getVal=(row,i,fallback)=>{
        if(i!==-1&&row[i]!=null&&String(row[i]).trim()!=='') return String(row[i]).trim();
        if(fallback!==undefined&&row[fallback]!=null&&String(row[fallback]).trim()!=='') return String(row[fallback]).trim();
        return '';
      };

      // ── 기본정보 / 선택군 / 규칙 (탭이 없으면 기본값 사용) ──
      const loadedInfo = parsedInfo.length > 1 ? parseInfoSheet(parsedInfo, ACTIVE_YEAR) : DEFAULT_INFO;
      if (parsedInfo.length <= 1) notes.push(`[${TAB_NAMES.info}] 탭이 없어 코드의 기본값(${DEFAULT_INFO.admissionYear}학년도 입학생)을 사용합니다.`);
      let loadedGroups = parsedGroups.length > 1 ? parseGroupsSheet(parsedGroups, issues) : [];
      if (loadedGroups.length === 0) { loadedGroups = DEFAULT_GROUPS; notes.push(`[${TAB_NAMES.groups}] 탭이 없어 코드의 기본 선택군을 사용합니다.`); }
      loadedGroups = withGroupNames(loadedGroups);
      let loadedRules = parsedRules.length > 1 ? parseRulesSheet(parsedRules, issues) : [];
      if (loadedRules.length === 0) { loadedRules = DEFAULT_RULES; notes.push(`[${TAB_NAMES.rules}] 탭이 없어 코드의 기본 규칙(2026 입학생 기준)을 사용합니다.`); }

      // 공유캠퍼스 탭: 과목명 → 운영 학교
      const sharedSchoolMap = {};
      if (parsedSharedCampus.length > 1) {
        const sh = parsedSharedCampus[0];
        const iSchool = headerIndex(sh, '운영학교', '학교');

          if (ci === iSchool || !normHeader(hd).includes('과목')) return;
          parsedSharedCampus.slice(1).forEach(r => { const nm = cell(r, ci), sc = cell(r, iSchool); if (nm && sc) sharedSchoolMap[normalizeForMatch(nm)] = sc; });
        });
      }

      if(parsedUnivRecs&&parsedUnivRecs.length>0){
        let headerRowIdx=0;
        for(let i=0;i<Math.min(10,parsedUnivRecs.length);i++){
          const rowStr=parsedUnivRecs[i].join('');
          if(rowStr.includes('대학')||rowStr.includes('모집')||rowStr.includes('권장')||rowStr.includes('학과')){ headerRowIdx=i; break; }
        }
        const headers=parsedUnivRecs[headerRowIdx].map(h=>String(h).replace(/"/g,'').trim().replace(/\s+/g,''));
        let idxUniv=headers.findIndex(h=>h==='대학'||h==='대학교'||(h.includes('대학')&&!h.includes('단과')));
        let idxCollege=headers.findIndex(h=>h.includes('단과')||h.includes('계열'));
        let idxDept=headers.findIndex(h=>h.includes('학과')||h.includes('모집단위')||h.includes('전공'));
        let idxCore=headers.findIndex(h=>h.includes('핵심'));
        let idxRec=headers.findIndex(h=>h.includes('권장')&&!h.includes('핵심'));
        if(idxUniv===-1)idxUniv=0;
        if(idxDept===-1)idxDept=headers.length>3?2:1;
        if(idxCollege===-1&&idxDept>=2)idxCollege=1;
        if(idxCore===-1)idxCore=idxDept+1;
        if(idxRec===-1)idxRec=idxCore+1;
        const univData=[]; let lastUniv='',lastCollege='';
        parsedUnivRecs.slice(headerRowIdx+1).forEach(row=>{
          let u=idxUniv!==-1&&row[idxUniv]!=null?String(row[idxUniv]).trim():'';
          let c=idxCollege!==-1&&row[idxCollege]!=null?String(row[idxCollege]).trim():'';
          let d=idxDept!==-1&&row[idxDept]!=null?String(row[idxDept]).trim():'';
          let core=idxCore!==-1&&row[idxCore]!=null?String(row[idxCore]).trim():'';
          let rec=idxRec!==-1&&row[idxRec]!=null?String(row[idxRec]).trim():'';
          if(u)lastUniv=u; else u=lastUniv;
          if(c)lastCollege=c; else c=lastCollege;
          if(!c)c='전체/공통';
          if(u&&d&&u!=='대학'&&d!=='모집단위'&&d!=='학과명'&&d!=='학과') univData.push({univ:u,college:c,dept:d,core,rec});
        });
        setDbUnivData(univData);
      }

      const fieldDataMap=new Map(), fieldDetailsMap={};
      if(parsedFields.length>1){
        const fieldHeaders=parsedFields[0].map(h=>String(h).replace(/"/g,'').trim().replace(/\s+/g,''));
        const fIdx={
          field:fieldHeaders.findIndex(h=>h.includes('계열')),
          desc:fieldHeaders.findIndex(h=>h.includes('설명')||h.includes('특성')),
          recommendStudent:fieldHeaders.findIndex(h=>h.includes('이런학생')||h.includes('권한다')||h.includes('적성')||h.includes('흥미')),
          recGen:fieldHeaders.findIndex(h=>h.includes('일반')),
          recCar:fieldHeaders.findIndex(h=>h.includes('진로')),
          recConv:fieldHeaders.findIndex(h=>h.includes('융합')),
          relatedDepts:fieldHeaders.findIndex(h=>h.includes('학과')&&!h.includes('유사')),
          tip:fieldHeaders.findIndex(h=>h.includes('Tip')||h.includes('팁')||h.includes('전공선택'))
        };
        if(fIdx.field===-1) fIdx.field=0;
        
        parsedFields.slice(1).forEach(row=>{
          const fieldName=getVal(row,fIdx.field,0);
          if(fieldName){
            const desc=getVal(row,fIdx.desc,1),recommendStudent=getVal(row,fIdx.recommendStudent,2),
              recGen=getVal(row,fIdx.recGen,3),recCar=getVal(row,fIdx.recCar,4),
              recConv=getVal(row,fIdx.recConv,5),relatedDepts=getVal(row,fIdx.relatedDepts,6),
              tip=getVal(row,fIdx.tip,-1); 
            fieldDetailsMap[fieldName]={name:fieldName,desc,recommendStudent,recGen,recCar,recConv,relatedDepts,tip};
            const recs=[];
            [recGen,recCar,recConv].forEach(val=>{if(val)val.split(/[,\n\r/]+/).forEach(v=>{let clean=v.replace(/등\s*$/,'').trim(); if(clean)recs.push(clean);});});
            if(recs.length===0){[row[1],row[2],row[3]].forEach(val=>{if(val)val.split(/[,\n\r/]+/).forEach(v=>{let clean=v.replace(/등\s*$/,'').trim(); if(clean)recs.push(clean);});});}
            fieldDataMap.set(fieldName,recs);
          }
        });
      }
      setDbFieldDetails(fieldDetailsMap);

      const majorDataMap=new Map(), deptDetailsMap={};
      if(parsedMajors.length>1){
        const mHeaders = parsedMajors[0].map(h=>String(h).replace(/"/g,'').trim().replace(/\s+/g,''));
        const mIdx = {
          field: mHeaders.findIndex(h=>h.includes('계열')),
          major: mHeaders.findIndex(h=>h.includes('학과명')||(h.includes('학과')&&!h.includes('유사'))),
          desc: mHeaders.findIndex(h=>h.includes('설명')||h.includes('특성')),
          recommendStudent: mHeaders.findIndex(h=>h.includes('권한다')||h.includes('이런학생')),
          recGen: mHeaders.findIndex(h=>h.includes('일반')),
          recCar: mHeaders.findIndex(h=>h.includes('진로')),
          recConv: mHeaders.findIndex(h=>h.includes('융합')),
          univSeoul: mHeaders.findIndex(h=>h.includes('서울')),
          univCap: mHeaders.findIndex(h=>h.includes('수도권')),
          univLoc: mHeaders.findIndex(h=>h.includes('비수도권')||h.includes('지방')),
          majorSubjects: mHeaders.findIndex(h=>h.includes('전공')||h.includes('교과')),
          similarDepts: mHeaders.findIndex(h=>h.includes('유사')),
          careerPaths: mHeaders.findIndex(h=>h.includes('졸업')||(h.includes('진로')&&!h.includes('권장')&&!h.includes('선택')))
        };

        if(mIdx.field===-1) mIdx.field=0;
        if(mIdx.major===-1) mIdx.major=1;
        
        parsedMajors.slice(1).forEach(row=>{
          const fieldName=getVal(row,mIdx.field,0);
          const majorName=getVal(row,mIdx.major,1);
          if(fieldName&&majorName){
            const desc=getVal(row,mIdx.desc,2), recommendStudent=getVal(row,mIdx.recommendStudent,3),
              recGen=getVal(row,mIdx.recGen,4), recCar=getVal(row,mIdx.recCar,5),
              recConv=getVal(row,mIdx.recConv,6), univSeoul=getVal(row,mIdx.univSeoul,7),
              univCap=getVal(row,mIdx.univCap,8), univLoc=getVal(row,mIdx.univLoc,9),
              majorSubjects=getVal(row,mIdx.majorSubjects,10), similarDepts=getVal(row,mIdx.similarDepts,11),
              careerPaths=getVal(row,mIdx.careerPaths,12);
              
            const recsForPlanner=[];
            [recGen,recCar,recConv].forEach(val=>{if(val)val.split(/[,\n\r/]+/).forEach(v=>{let clean=v.replace(/등\s*$/,'').trim(); if(clean)recsForPlanner.push(clean);});});
            if(!majorDataMap.has(fieldName))majorDataMap.set(fieldName,[]);
            majorDataMap.get(fieldName).push({name:majorName,recommended:recsForPlanner});
            deptDetailsMap[majorName]={field:fieldName,name:majorName,desc,recommendStudent,recGen,recCar,recConv,univSeoul,univCap,univLoc,majorSubjects,similarDepts,careerPaths};
          }
        });
      }
      setDbDepartmentDetails(deptDetailsMap);

      const finalFields=[{id:'none',name:'희망계열 선택'}], finalMajors={none:[{id:'none',name:'계열을 먼저 선택하세요',recommended:[],recommendType:'none'}]};
      const allFields=new Set([...fieldDataMap.keys(),...majorDataMap.keys()]);
      Array.from(allFields).forEach(fieldName=>{
        finalFields.push({id:fieldName,name:fieldName});
        const fieldRecs=fieldDataMap.get(fieldName)||[];
        const majorsForField=majorDataMap.get(fieldName)||[];
        finalMajors[fieldName]=[
          {id:'none',name:'아직 없음',recommended:fieldRecs,recommendType:'field'},
          ...majorsForField.map(m=>({id:m.name,name:m.name,recommended:m.recommended,recommendType:'major'}))
        ];
      });
      if(finalFields.length>1){setDbFields(finalFields);setDbMajors(finalMajors);}

      const loadedSubjects=[];
      let loadedMandatory=JSON.parse(JSON.stringify(DEFAULT_MANDATORY_SUBJECTS)), hasSheetMandatory=false;
      // [과목소개](공통) 내용을 학년별 [과목데이터]에 과목명으로 붙이기 (같은 이름의 열은 과목데이터 우선)
      if(parsedSubjects.length>1&&parsedIntro.length>1){
        const sHead=parsedSubjects[0].map(normHeader), iHead=parsedIntro[0].map(normHeader);
        const iName=headerIndex(parsedIntro[0],'과목명','교과목');
        const extraCols=iHead.map((h,i)=>i).filter(i=>i!==iName&&iHead[i]&&!sHead.includes(iHead[i]));
        const introMap={};
        parsedIntro.slice(1).forEach(r=>{const nm=cell(r,iName); if(nm) introMap[normalizeForMatch(nm)]=r;});
        const sName=headerIndex(parsedSubjects[0],'과목명','교과목');
        parsedSubjects=[
          [...parsedSubjects[0],...extraCols.map(i=>parsedIntro[0][i])],
          ...parsedSubjects.slice(1).map(r=>{
            const intro=introMap[normalizeForMatch(cell(r,sName))];
            const isMandatoryRow=/지정/.test(r.join(''));
            if(!intro&&!isMandatoryRow&&cell(r,sName)) notes.push(`[과목소개] '${cell(r,sName)}' 과목의 소개가 없습니다.`);
            const base=[...r]; while(base.length<parsedSubjects[0].length) base.push('');
            return [...base,...extraCols.map(i=>intro?(intro[i]??''):'')];
          }),
        ];
      }

      if(parsedSubjects.length>1){
        const subjHeaders=parsedSubjects[0].map(h=>String(h).replace(/"/g,'').trim().replace(/\s+/g,''));
        const findIdx=(...keywords)=>subjHeaders.findIndex(h=>keywords.some(k=>h.includes(k)));
        const findAllIdx=(...keywords)=>subjHeaders.reduce((acc,h,i)=>{if(keywords.some(k=>h.includes(k)))acc.push(i);return acc;},[]);
        const idx={
          subject:findIdx('과목명','교과목'),group:findIdx('편성','군'),credits:findIdx('학점','단위'),
          type:findIdx('교과군','교과영역','과목유형'),desc:findIdx('한줄소개','과목설명','설명'),
          evalInfo:findIdx('평가','등급'),mainContent:findIdx('주요'),csat:findIdx('수능','출제'),
          career:findIdx('직업'),department:findIdx('학과'),selType:findIdx('선택유형','선택 유형'),
          evalAbs:findIdx('절대평가','성취도'),evalRel:findIdx('상대평가','석차등급'),keywords:findIdx('키워드','핵심키워드'),
          youtube:findIdx('유튜브','영상','youtube','링크','url')
        };
        const areaIdxs=findAllIdx('대영역'), conceptIdxs=findAllIdx('생각열기','핵심개념'), actIdxs=findAllIdx('학습활동','주요학습');
        const intIdxs=findAllIdx('관심분야'), topicIdxs=findAllIdx('주제탐구','탐구과제'), caseIdxs=findAllIdx('활동사례','사례');
        const recIdxs=findAllIdx('추천학생','이런학생','추천해요','추천1','추천2','추천3');
        if(idx.subject===-1)idx.subject=0;
        if(idx.youtube===-1)idx.youtube=34;

        parsedSubjects.slice(1).forEach((row,rowIndex)=>{
          const name=getVal(row,idx.subject,0);
          if(!name) return;
          const groupStr=getVal(row,idx.group,1), creditsStr=getVal(row,idx.credits,2);
          const credits=parseInt(creditsStr.replace(/[^0-9]/g,''),10)||0;
          const type=getVal(row,idx.type,3), desc=getVal(row,idx.desc,5);
          const areas=areaIdxs.map(i=>getVal(row,i,'')), concepts=conceptIdxs.map(i=>getVal(row,i,'')), acts=actIdxs.map(i=>getVal(row,i,''));
          const learn=[];
          for(let i=0;i<Math.max(areas.length,concepts.length,acts.length);i++){
            if(areas[i]||concepts[i]||acts[i]) learn.push({area:areas[i]||'',concept:concepts[i]||'',act:acts[i]||''});
          }
          const ints=intIdxs.map(i=>getVal(row,i,'')), topics=topicIdxs.map(i=>getVal(row,i,'')), cases=caseIdxs.map(i=>getVal(row,i,''));
          const advanced=[];
          for(let i=0;i<Math.max(ints.length,topics.length,cases.length);i++){
            if(ints[i]||topics[i]||cases[i]) advanced.push({int:ints[i]||'',topic:topics[i]||'',case:cases[i]||''});
          }
          let recommend=[];
          recIdxs.forEach(i=>{const val=getVal(row,i,'');if(val){const lines=val.split('\n').map(l=>l.replace(/^[•\-\*]\s*/,'').trim()).filter(l=>l);recommend.push(...lines);}});
          const popupData={
            selType:getVal(row,idx.selType,''),evalAbs:getVal(row,idx.evalAbs,''),evalRel:getVal(row,idx.evalRel,''),
            desc:getVal(row,idx.desc,''),keywords:getVal(row,idx.keywords,''),learn,advanced,recommend,
            youtube:getVal(row,idx.youtube,-1)
          };
          const csat=getVal(row,idx.csat,8);
          
          if(groupStr.includes('지정')){
            if(!hasSheetMandatory){loadedMandatory={'1-1':[],'1-2':[],'2-1':[],'2-2':[],'3-1':[],'3-2':[]};hasSheetMandatory=true;}
            const sem=getSemesterFromText(groupStr);
            if(sem) loadedMandatory[sem].push({name,credits,type,desc,csat,popupData});
          } else {
            const groupId=findGroupInText(groupStr, loadedGroups);
            const g=loadedGroups.find(gr=>gr.id===groupId);
            if(!g){ issues.push(`[과목데이터] ${rowIndex+2}행 '${name}': 편성 '${groupStr}'에 해당하는 선택군이 [선택군]에 없습니다.`); return; }
            const semInText=getSemesterFromText(groupStr);
            if(semInText&&semInText!==g.semester) issues.push(`[과목데이터] ${rowIndex+2}행 '${name}': 편성에는 ${semInText.replace('-','학년 ')}학기라고 적혀 있지만 ${g.id}군은 ${g.semester.replace('-','학년 ')}학기입니다.`);
            if(!credits) issues.push(`[과목데이터] ${rowIndex+2}행 '${name}': 학점이 비어 있습니다.`);
            const school=g.isSharedCampus?(sharedSchoolMap[normalizeForMatch(name)]||''):'';
            if(g.isSharedCampus&&!school) issues.push(`[과목데이터] '${name}': [공유캠퍼스] 탭에서 운영 학교를 찾지 못했습니다.`);
            // 과목 ID는 '군|과목명'으로 고정 → 시트 행 순서가 바뀌어도 학생 선택 기록이 유지됨
            loadedSubjects.push({id:`${groupId}|${name}`,name,group:groupId,type,credits,desc,csat,school,popupData});
          }
        });

        setDbSubjects(loadedSubjects);
        setDbMandatory(loadedMandatory);
      }

      // ── 시트 점검 (?check=1 화면에 표시) ──
      const subjectsForCheck = parsedSubjects.length>1 ? loadedSubjects : [];
      loadedGroups.forEach(g=>{
        const subs=subjectsForCheck.filter(x=>x.group===g.id);
        if(subjectsForCheck.length>0&&subs.length<g.maxPick) issues.push(`[선택군] ${g.id}(${g.label})군: 과목이 ${subs.length}개뿐인데 ${g.maxPick}과목을 골라야 합니다.`);
        if(!g.isOptional&&g.totalCredits){
          subs.filter(x=>x.credits&&x.credits*g.maxPick!==g.totalCredits).forEach(x=>issues.push(`[선택군] ${g.id}군 '${x.name}': ${x.credits}학점 × 택${g.maxPick} ≠ 군 학점 ${g.totalCredits}학점`));
        }
      });
      const knownTypes=[...TYPE_ORDER,'정보'];
      prepareRules(loadedRules, loadedGroups).forEach(r=>{
        const where=r.row?`[규칙] ${r.row}행`:'[기본 규칙]';
        r.categories.filter(c=>!knownTypes.includes(normalizeType(c,''))&&c.replace(/\s+/g,'')!=='정보').forEach(c=>issues.push(`${where}: 대상교과 '${c}'을(를) 알 수 없습니다.`));
        if(r.scope&&!/전체|학년/.test(r.scope)&&!r.scopeExplicit) issues.push(`${where}: 대상군 '${r.scope}'에 해당하는 선택군이 없습니다.`);
        if(['지정과목','중복금지'].includes(r.type)||r.subjects.length>0){
          r.subjects.filter(nm=>!subjectsForCheck.some(x=>r.groupIds.includes(x.group)&&normalizeForMatch(x.name)===normalizeForMatch(nm)))
            .forEach(nm=>subjectsForCheck.length>0&&issues.push(`${where}: 대상과목 '${nm}'이(가) 대상군 과목 목록에 없습니다 (띄어쓰기·Ⅰ/I 확인).`));
        }
        if(r.type==='지정과목'&&r.subjects.length===0) issues.push(`${where}: 지정과목 규칙인데 대상과목이 비어 있습니다.`);
      });

      if(!loadedInfo.tracks.includes('과학중점')&&loadedRules.some(r=>r.track==='과학중점')) issues.push(`[규칙] 이 입학년도는 [기본정보] 운영과정에 과학중점이 없는데, 과학중점 규칙이 남아 있습니다 (적용되지 않음).`);
      // 직업데이터: 직업 | 관련 과목 | 하는 일 | 과목별 추천 이유("과목명: 이유" 한 줄씩)
      // AI직업데이터: 같은 형식 + 계열·관련 학과 열 (AI가 만든 자료 → 화면에 'AI추천' 주의 표시)
      //   선생님이 검토한 직업은 [직업데이터] 탭으로 옮기면 AI 표시가 사라짐 (같은 이름이면 직업데이터가 우선)
      const parseJobRows = (rows, ai) => {
        if (rows.length < 2) return [];
        const jh = rows[0];
        const ji = { job: headerIndex(jh, '직업'), subs: headerIndex(jh, '휘경여고개설필요(관련)과목', '관련과목', '과목'),
                     does: headerIndex(jh, '하는일', '직업소개'), why: headerIndex(jh, '과목별추천이유', '추천이유'),
                     field: headerIndex(jh, '계열', '분야'), majors: headerIndex(jh, '관련학과', '학과') };
        return rows.slice(1).map(r => {
          const reasons = {};
          cell(r, ji.why).split('\n').forEach(line => { const m = line.match(/^\s*([^:：]+)[:：]\s*(.+)$/); if (m) reasons[normLoose(m[1])] = m[2].trim(); });
          return { job: cell(r, ji.job === -1 ? 0 : ji.job), subjectsText: cell(r, ji.subs === -1 ? 1 : ji.subs), does: cell(r, ji.does), reasons, whyRaw: cell(r, ji.why), hasWhyColumn: ji.why !== -1,
                   ai, field: cell(r, ji.field), majors: cell(r, ji.majors) };
        }).filter(j => j.job);
      };
      const sheetJobs = parseJobRows(parsedJobs, false);
      const sheetJobNames = new Set(sheetJobs.map(j => normLoose(j.job)));
      setDbJobs([...sheetJobs, ...parseJobRows(parsedAiJobs, true).filter(j => !sheetJobNames.has(normLoose(j.job)))]);
      // 용어풀이: 용어 | 설명 (기본 용어에 더하거나 덮어씀)
      GLOSSARY = { ...DEFAULT_GLOSSARY };
      parsedGlossary.slice(1).forEach(r => { if (cell(r, 0) && cell(r, 1)) GLOSSARY[cell(r, 0)] = cell(r, 1); });
      setDbInfo(loadedInfo);
      setDbGroups(loadedGroups);
      setDbRules(loadedRules);
      setDataIssues(issues);
      setDataNotes(notes);
      if (parsedTimetable && parsedTimetable.length > 0) setDbTimetableSheet(parsedTimetable);
  };

  // 1) 이 기기에 저장된 지난 자료로 화면을 먼저 보여 주고  2) 최신 자료를 뒤에서 받아 바꿔 끼움
  const fetchGoogleSheetData = async (isManual=false) => {
    let cachedText = null;
    if (!isManual) {
      try {
        const cached = JSON.parse(localStorage.getItem(DATA_CACHE_KEY) || 'null');
        if (cached && cached.text) { applySheetText(cached.text); cachedText = cached.text; setIsLoading(false); }
      } catch (e) { cachedText = null; }
    }
    if (cachedText === null) setIsLoading(true);
    setIsRefreshing(true);
    setFetchError(null);
    try {
      const text = await fetchSheet({ year: ACTIVE_YEAR });
      if (text !== cachedText) applySheetText(text);
      try { localStorage.setItem(DATA_CACHE_KEY, JSON.stringify({ text, savedAt: Date.now() })); } catch (e) {}
      setIsLoading(false);
    } catch(error) {
      console.error("Sheet Fetch Error:",error);
      // 저장된 자료로 이미 화면을 보여 주고 있으면 오류 화면을 띄우지 않음
      if (cachedText === null) setFetchError(String(error.message||error) + "\n\n※ 웹앱 URL이 변경되었거나 접근 권한('모든 사용자')이 없는지 확인해 주세요.");
      setIsLoading(false);
    } finally {
      setIsRefreshing(false);
    }
  };

  useEffect(() => { fetchGoogleSheetData(); }, []);

  // 입학년도 목록: 학생 공개 학년 + 지금 보고 있는 학년(미리보기)
  // 이 입학년도에 운영하는 과정 ([기본정보] 운영과정). 과학중점이 없으면 일반 과정으로 고정
  const hasScienceTrack = dbInfo.tracks.includes('과학중점');

  const yearChoices = useMemo(() => dbInfo.years.filter(y => y.isPublic || y.year === ACTIVE_YEAR).sort((a, b) => b.year.localeCompare(a.year)), [dbInfo]);
  useEffect(() => {
    if (dbInfo.years.length > 0) { try { localStorage.setItem(YEARS_CACHE_KEY, JSON.stringify(dbInfo.years)); } catch (e) {} }

      // 시트에 없는 입학년도면 공개된 가장 최근 입학년도로

      if (fallback) goToYear(fallback.year);

  const selectedSubjects = dbSubjects.filter(s=>selectedIds.includes(s.id));

  const fieldRecommendedSet = useMemo(() => {
    if(selectedField==='none') return new Set();
    const fieldBase=dbMajors[selectedField]?.find(m=>m.id==='none');

  const tableDataMatrix = useMemo(() => {

      (dbMandatory[sem]||[]).forEach(m=>{
        allPlan.push({semester:sem,name:m.name,credits:m.credits,type:normalizeType(m.type,m.name),isMandatory:true,csat:m.csat,groupId:'mandatory'});

  const uniqueElectiveSubjects = useMemo(() => {

  const getRecommenders = (subject) => {
    if (!subject) return [];
    const normTarget = normalizeForMatch(subject.name);
    const targetType = normalizeType(subject.type, subject.name);

    const checkMatch = (rec) => {
      const normRec = normalizeForMatch(rec);
      if (normRec === normTarget) return true;
      if (targetType === '제2외국어/한문') {
        const targetIsHanja = normTarget.includes('한문');
        const recHasHanja = normRec.includes('한문');
        const recHasForeign = normRec.includes('외국어') || normRec.includes('제2외국어');
        
        const recHasJapanese = normRec.includes('일본어');
        const recHasChinese = normRec.includes('중국어');

        if (recHasHanja && recHasForeign) return true;
        if (targetIsHanja) { if (recHasHanja) return true; } 
        else { 
          if (recHasForeign) return true;
          if (normTarget.includes('일본어') && recHasJapanese) return true;
          if (normTarget.includes('중국어') && recHasChinese) return true;
        }
      }
      return false;
    };

    const results = [];
    Object.keys(dbMajors).forEach(fieldName => {
      if (fieldName === 'none') return;
      const majors = dbMajors[fieldName];
      const fieldBase = majors.find(m => m.id === 'none');
      const isFieldRec = fieldBase ? fieldBase.recommended.some(checkMatch) : false;
      const explicitMajors = majors.filter(m => m.id !== 'none' && m.recommended.some(checkMatch));

      explicitMajors.forEach(m => {
        if (isFieldRec) {
          results.push({ type: '공통 추천', field: fieldName, major: m.name });
        } else {
          results.push({ type: '학과 추천', field: fieldName, major: m.name });
        }
      });

      if (isFieldRec) {
        if (explicitMajors.length > 0) {
          results.push({ type: '계열 추천', field: fieldName, major: '그 외 전체 학과' });
        } else {
          results.push({ type: '계열 추천', field: fieldName, major: '전체 학과' });
        }
      }
    });

    return results.sort((a, b) => {
      const order = { '공통 추천': 1, '계열 추천': 2, '학과 추천': 3 };
      if (order[a.type] !== order[b.type]) return order[a.type] - order[b.type];
      if (a.field !== b.field) return a.field.localeCompare(b.field, 'ko');
      return a.major.localeCompare(b.major, 'ko');
    });
  };

  const popupRecommenders = useMemo(() => getRecommenders(infoModalSubject), [infoModalSubject, dbMajors]);
  const guideRecommenders = useMemo(() => getRecommenders(guideSubjectDetails), [guideSubjectDetails, dbMajors]);

  // 우리 학교 과목 목록: 과목명 → 개설 학기, 담을 수 있는 과목 카드(같은 과목이 여러 학기에 있으면 모두)
  const schoolSubjectIndex = useMemo(() => {
    const map = new Map();
    const add = (name, sem, entry, kind) => {
      const k = normLoose(name);
      if (!map.has(k)) map.set(k, { name, sems: new Set(), entries: [], kind });
      const o = map.get(k);
      if (sem) o.sems.add(sem);
      if (entry) o.entries.push(entry);
      if (kind === 'mandatory') o.kind = 'mandatory';
    };
    dbSubjects.forEach(x => add(x.name, groupMap[x.group]?.semester, x, 'elective'));
    Object.entries(dbMandatory).forEach(([sem, list]) => list.forEach(m => add(m.name, sem, null, 'mandatory')));
    return [...map.values()].map(o => ({ ...o, semText: o.sems.size ? `${[...o.sems].sort().join('·')}학기` : '' }));
  }, [dbSubjects, dbMandatory, groupMap]);
  // 문장 속 우리 학교 과목 찾기 (핵심 과목 먼저, 나온 순서대로)
  const matchSchoolSubjects = (text, coreText = '') => {
    const nt = normLoose(text), nc = normLoose(coreText);
    return findSubjectsInText(text, schoolSubjectIndex)
      .map(s => ({ ...s, isCore: !!coreText && nc.includes(normLoose(s.name)),
                   isSelected: s.kind === 'mandatory' || s.entries.some(e => selectedIds.includes(e.id)) }))
      .sort((a, b) => (b.isCore - a.isCore) || (nt.indexOf(normLoose(a.name)) - nt.indexOf(normLoose(b.name))));
  };
  // 과목 칩: ✔ 담음/지정, (개설 학기), 핵심 표시, [담기] 버튼
  const renderSubjectChips = (list) => (
    <div className="flex flex-wrap gap-2">
      {list.map(m => (
        <span key={m.name} className={`inline-flex items-center flex-wrap gap-1 px-3 py-1.5 rounded-lg text-sm lg:text-base font-bold border-2 ${m.isSelected?'bg-green-50 border-green-500 text-green-800':'bg-white border-slate-300 text-slate-700'}`}>
          {m.isSelected?'✔ ':''}{m.name}
          {(m.semText||m.kind==='mandatory')&&<span className="font-medium">({[m.semText, m.kind==='mandatory'?'지정':''].filter(Boolean).join(', ')})</span>}
          {m.isCore&&<span className="text-xs text-white bg-rose-600 rounded px-1.5 py-0.5">핵심</span>}
          {!m.isSelected&&!SHARED&&m.entries.map(e=>(
            <button key={e.id} type="button" onClick={()=>toggleSubject(e)} className="no-print text-xs font-black text-white bg-blue-600 hover:bg-blue-700 rounded-md px-2 py-1">
              {m.entries.length>1?`${groupMap[e.group]?.semester} 담기`:'담기'}
            </button>
          ))}
        </span>
      ))}
    </div>
  );

  // 대학별 이수권장과목: 대학 → 단과대학/계열 → 학과/모집단위
  const univUnits = useMemo(() => {
    const list = [];
    dbUnivData.forEach((r, i) => {
      const units = /제외|전공 분야|^\s*$/.test(r.dept) ? [r.dept] : splitUnits(r.dept);
      units.forEach(u => list.push({ univ: r.univ, college: r.college, unit: u, row: r, rowKey: i }));
    });
    return list;
  }, [dbUnivData]);
  const univOptions = useMemo(() => [...new Set(univUnits.map(x => x.univ))], [univUnits]);
  const pickOnly = (opts, v) => (opts.includes(v) ? v : opts.length === 1 ? opts[0] : '');
  const univChosen = pickOnly(univOptions, univSel.univ);
  const collegeOptions = useMemo(() => [...new Set(univUnits.filter(x => x.univ === univChosen).map(x => x.college))], [univUnits, univChosen]);
  const collegeChosen = pickOnly(collegeOptions, univSel.college);
  const unitOptions = useMemo(() => univUnits.filter(x => x.univ === univChosen && x.college === collegeChosen), [univUnits, univChosen, collegeChosen]);
  const unitChosen = pickOnly(unitOptions.map(x => x.unit), univSel.unit);
  const univResult = unitOptions.find(x => x.unit === unitChosen) || null;
  const univResultInfo = useMemo(() => {
    if (!univResult) return null;
    const text = univResult.row.rec || univResult.row.core || '';
    const lines = parseUnivRec(text);
    const matched = matchSchoolSubjects(text, lines.map(l => l.core).join(' '));
    const sameRow = univUnits.filter(x => x.rowKey === univResult.rowKey).map(x => x.unit);
    return { lines, matched, sameRow };
  }, [univResult, schoolSubjectIndex, selectedIds, univUnits]);

  // 실시간 조건 검증 엔진 ([규칙] 탭 기반)
  const mandatoryList = useMemo(() => Object.values(dbMandatory).flat(), [dbMandatory]);
  const evaluatedConditions = useMemo(() => {
    return preparedRules.map(rule => {
      const { status, detail } = evaluateRule(rule, { groupMap, selected: selectedSubjects, mandatoryList });
      const text = rule.text || `${rule.scope || '전체'} ${rule.type}${rule.categories.length ? ` (${rule.categories.join(', ')})` : ''}`;
      return { key: rule.key, track: rule.track, rule, original: text, displayOriginal: replaceGroupIds(text, GROUPS), status, currentStatusText: detail };
    });
  }, [preparedRules, selectedSubjects, mandatoryList, groupMap, GROUPS]);

  // 커스텀 과정 변경 및 초기화 경고 로직
  const handleTrackChange = (trackType, isChecked) => {
    if (selectedIds.length > 0) {
      setConfirmDialog({
        isOpen: true,
        message: "과정을 변경하시겠습니까?\n과정을 변경하면 기존에 선택했던 과목 내역이 모두 초기화됩니다.",
        onConfirm: () => {
          setSelectedIds([]); 
          applyTrackChange(trackType, isChecked);
          setConfirmDialog({ isOpen: false, message: '', onConfirm: null, onCancel: null });
        },
        onCancel: () => {
          setConfirmDialog({ isOpen: false, message: '', onConfirm: null, onCancel: null });
        }
      });
    } else {
      applyTrackChange(trackType, isChecked);
    }
  };

  const applyTrackChange = (trackType, isChecked) => {
    if (trackType === 'general') {
      setIsGeneralTrack(isChecked);
      if (isChecked) {
        setShowGeneralPopup(true);
        setIsScienceTrack(false);
        setShowSciencePopup(false);
      } else {
        setShowGeneralPopup(false);
      }
    } else if (trackType === 'science') {
      setIsScienceTrack(isChecked);
      if (isChecked) {
        setShowSciencePopup(true);
        setIsGeneralTrack(false);
        setShowGeneralPopup(false);
      } else {
        setShowSciencePopup(false);
      }
    }
  };

  // 과목 담기 로직
  // 이 과목을 지금 담을 수 있는지 확인: 안 되면 { reason, ruleText, full } / 되면 null
  const checkAdd = (subject, current = selectedSubjects) => {
    const groupDef = GROUPS.find(g=>g.id===subject.group);
    if (!groupDef) return { reason: '선택군 정보를 찾을 수 없습니다.' };
    const inGroup = current.filter(s=>s.group===subject.group);
    if (inGroup.length >= groupDef.maxPick) return { full: true, reason: `${groupDef.label}군에서는 ${groupDef.maxPick}과목까지만 고를 수 있어요. 이미 ${inGroup.length}과목을 골랐습니다.` };
    const next = [...current, subject];
    for (const rule of preparedRules) {
      if (!ruleAppliesToTrack(rule, isScienceTrack)) continue;
      const reason = getAddViolation(rule, subject, next, { groupMap, mandatoryList });
      if (reason) return { reason, ruleText: replaceGroupIds(rule.text || `${rule.scope} ${rule.type}`, GROUPS) };
    }
    return null;
  };

  // 과목 담기/빼기 (담을 수 없으면 화면 아래에 이유와 대안을 보여 줌)
  const toggleSubject = (subject) => {
    if (SHARED) { setBlockInfo({ shared: true }); return; }
    if(!isGeneralTrack&&!isScienceTrack){
      setAlertMessage("⚠️ 과정 선택 필수\n\n과목을 담기 전에 상단의 '나의 진로 및 과정 설정'에서\n[일반 과정] 또는 [과학중점 과정]을 먼저 선택해 주세요.");
      return;
    }
    if(selectedIds.includes(subject.id)){
      setSelectedIds(selectedIds.filter(id=>id!==subject.id));
      setBlockInfo(null);
      return;
    }
    const v = checkAdd(subject);
    if (v) {
      const groupDef = GROUPS.find(g=>g.id===subject.group);
      const pickedInGroup = v.full ? selectedSubjects.filter(s=>s.group===subject.group) : [];
      const swaps = pickedInGroup.map(p => ({ out: p, ok: !checkAdd(subject, selectedSubjects.filter(x=>x.id!==p.id)) }));
      const alternatives = v.full ? [] : dbSubjects.filter(s=>s.group===subject.group && s.id!==subject.id && !selectedIds.includes(s.id) && !checkAdd(s));
      setBlockInfo({ subject, groupName: groupDef?.name || '', ...v, swaps, alternatives });
      return;
    }
    setBlockInfo(null);
    setSelectedIds([...selectedIds, subject.id]);
  };
  const swapSubject = (outSubject, inSubject) => {
    setSelectedIds([...selectedIds.filter(id=>id!==outSubject.id), inSubject.id]);
    setBlockInfo(null);
  };

  // ── 메뉴: ① 진로 찾기 ② 과목 고르기 ③ 내 결과 ❓ 도움말 ──
  const MENU = [
    { id: 'explore', icon: '🧭', num: '①', label: '진로 찾기', tabs: [{ id: 'job', icon: '💼', label: '직업으로 찾기' }, { id: 'major', icon: '🗺️', label: '학과 가이드' }, { id: 'university', icon: '🏛️', label: '대학별 이수권장' }] },
    { id: 'pick', icon: '✏️', num: '②', label: '과목 고르기', tabs: [{ id: 'planner', icon: '📋', label: '나의 편제표' }, { id: 'subject', icon: '📚', label: '선택과목 가이드' }, { id: 'compare', icon: '⚖️', label: '과목 비교' }] },
    { id: 'result', icon: '✅', num: '③', label: '내 결과', tabs: [{ id: 'check', icon: '🔎', label: '조건 점검·공유' }, { id: 'career', icon: '🎓', label: '나의 보고서' }] },
    { id: 'help', icon: '❓', num: '', label: '도움말', tabs: [{ id: 'help', icon: '❓', label: '도움말' }] },
  ];
  const activeMenu = MENU.find(m => m.tabs.some(t => t.id === activeTab)) || MENU[1];
  const isMobile = () => window.innerWidth < 768;
  // 보고서 화면: 들어갈 때 맨 위부터 보이게, 나올 때는 보던 위치로
  const scrollBeforeReport = useRef(0);
  const tabBeforeReport = useRef('planner');
  const prevTabRef = useRef(activeTab);
  const lastScrollRef = useRef(0);
  useEffect(() => {
    const onScroll = () => { if (prevTabRef.current !== 'career') lastScrollRef.current = window.scrollY; };
    window.addEventListener('scroll', onScroll, { passive: true });
    return () => window.removeEventListener('scroll', onScroll);
  }, []);
  React.useLayoutEffect(() => {
    if (activeTab === 'career' && prevTabRef.current !== 'career') {
      scrollBeforeReport.current = lastScrollRef.current;
      tabBeforeReport.current = prevTabRef.current;
      window.scrollTo(0, 0);
    } else if (activeTab !== 'career' && prevTabRef.current === 'career') {
      // 화면이 다시 그려지는 동안 몇 번 나눠서 원래 위치로 (긴 화면은 높이가 늦게 잡힘)
      [0, 60, 200, 450].forEach(ms => setTimeout(() => { if (Math.abs(window.scrollY - scrollBeforeReport.current) > 4) window.scrollTo(0, scrollBeforeReport.current); }, ms));
    }
    prevTabRef.current = activeTab;
  }, [activeTab]);
  const goTab = (tabId) => {
    if (tabId === 'career') { setActiveTab('career'); return; }   // 보고서는 전체 화면이라 따로 처리(아래 효과)
    setActiveTab(tabId);
    if (isMobile()) setTimeout(() => rightPaneRef.current?.scrollIntoView({ behavior: 'smooth', block: 'start' }), 60);
  };
  const scrollLeftTo = (el) => {
    if (!el) return;
    if (isMobile()) { el.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
    const pane = leftPaneRef.current; if (!pane) return;
    pane.scrollTo({ top: pane.scrollTop + el.getBoundingClientRect().top - pane.getBoundingClientRect().top - 8, behavior: 'smooth' });
  };
  const goSubjects = () => scrollLeftTo(document.getElementById('subject-area'));
  const goSettings = () => scrollLeftTo(document.getElementById('settings-area'));

  // ── 진행 표시줄 ──
  const requiredPickTotal = GROUPS.filter(g => !g.isOptional).reduce((sum, g) => sum + g.maxPick, 0);
  const requiredPicked = selectedSubjects.filter(s => groupMap[s.group] && !groupMap[s.group].isOptional).length;
  const trackConditions = evaluatedConditions.filter(c => ruleAppliesToTrack(c.rule, isScienceTrack));
  const failCount = trackConditions.filter(c => c.status === 'fail').length;
  const progressSteps = [
    { key: 'track', label: '과정 선택', done: isGeneralTrack || isScienceTrack, onClick: goSettings },
    { key: 'career', label: '진로 정하기', sub: '(선택)', done: selectedField !== 'none', optional: true, onClick: goSettings },
    { key: 'pick', label: '과목 고르기', sub: `${requiredPicked}/${requiredPickTotal}`, done: requiredPickTotal > 0 && requiredPicked >= requiredPickTotal, onClick: goSubjects },
    { key: 'check', label: '조건 확인', sub: failCount ? `⚠ ${failCount}` : '', warn: failCount > 0, done: requiredPicked >= requiredPickTotal && failCount === 0 && requiredPickTotal > 0, onClick: () => goTab('check') },
    { key: 'report', label: '공유·보고서', done: false, onClick: () => goTab('career') },
  ];

  // ── 공지 띠 ──
  const notices = useMemo(() => parseNotices(dbInfo.notice), [dbInfo]);

  // ── 통합 검색: 과목·학과·직업·대학 ──
  const searchResults = useMemo(() => {
    const q = normLoose(searchQuery);
    if (!q) return null;
    const subjects = uniqueElectiveSubjects.filter(x => normLoose(x.name).includes(q) || normLoose(x.popupData?.keywords).includes(q)).slice(0, 6);
    const depts = Object.values(dbDepartmentDetails).filter(d => normLoose(d.name).includes(q) || normLoose(d.similarDepts).includes(q)).slice(0, 6);
    const jobs = dbJobs.filter(j => normLoose(j.job).includes(q)).slice(0, 6);
    const seenU = new Set();
    const univs = univUnits.filter(u => (normLoose(u.unit).includes(q) || normLoose(u.univ).includes(q)) && !seenU.has(u.univ + u.unit) && seenU.add(u.univ + u.unit)).slice(0, 6);
    return { subjects, depts, jobs, univs, total: subjects.length + depts.length + jobs.length + univs.length };
  }, [searchQuery, uniqueElectiveSubjects, dbDepartmentDetails, dbJobs, univUnits]);
  const openSearchResult = (kind, item) => {
    setSearchQuery('');
    if (kind === 'subject') setInfoModalSubject(item);
    if (kind === 'dept') { setGuideSelectedField(item.field); setGuideSelectedMajor(item.name); goTab('major'); }
    if (kind === 'job') { setSelectedJob(item.job); goTab('job'); }
    if (kind === 'univ') { setUnivSel({ univ: item.univ, college: item.college, unit: item.unit }); goTab('university'); }
  };

  // ── 직업으로 찾기 ──
  // 과목별 추천 이유: 시트의 이유(같은 이름 → 제2외국어·한문 묶음 → 이름 일부 일치)
  // 시트에 없으면 [과목소개] 한 줄 소개로 이유를 만들어 보여 줌 (점검 화면에서 시트에 넣을 문장 제공)
  const reasonFor = (j, m) => {
    const n = normLoose(m.name), keys = Object.keys(j.reasons);
    const type = normalizeType(m.entries?.[0]?.type || '', m.name);
    let text = j.reasons[n]
      || (/한문|한자/.test(m.name) && j.reasons[normLoose('한문')])
      || (type === '제2외국어/한문' && j.reasons[normLoose('제2외국어')])
      || (() => { const k = keys.find(k => n.includes(k) || k.includes(n)); return k ? j.reasons[k] : ''; })();
    if (text) return { reason: text, reasonFromSheet: true };
    const entry = m.entries?.[0];
    const intro = String(entry?.popupData?.desc || entry?.desc || '').replace(/\s+/g, ' ').trim();
    let learn = intro ? (intro.match(/^.*?(?:니다|어요|해요|이다|한다)[.]?/) || [intro])[0] : '';
    if (learn.length > 90) learn = learn.slice(0, 88) + '…';
    const area = type.replace(' (역사/도덕 포함)', '').replace('기타', '관련');
    const jobName = j.job.split('/')[0].replace(/\(.*\)/, '').trim();
    return { reason: `${jobName} 일에 필요한 ${area} 분야의 바탕을 다질 수 있어서 → ${learn || `${m.name}의 핵심 내용을 배워요.`}`, reasonFromSheet: false };
  };
  const jobInfo = useMemo(() => {
    const j = dbJobs.find(x => x.job === selectedJob);
    if (!j) return null;
    const matched = matchSchoolSubjects(j.subjectsText);
    const have = new Set(matched.map(m => normLoose(m.name)));
    const notOffered = splitUnits(j.subjectsText.replace(/\s*등\s*$/, '')).map(x => x.replace(/\s*등$/, '').trim())
      .filter(x => x && !have.has(normLoose(x)) && !matched.some(m => normLoose(x).includes(normLoose(m.name))));
    return { ...j, matched: matched.map(m => ({ ...m, ...reasonFor(j, m) })), notOffered };
  }, [dbJobs, selectedJob, schoolSubjectIndex, selectedIds]);

  // ── (점검 화면) 시트에 추천 이유가 없는 과목 → 붙여 넣을 문장 ──
  const jobReasonGaps = useMemo(() => {
    if (!CHECK_MODE) return [];
    return dbJobs.filter(j => !j.ai).map(j => {
      const missing = matchSchoolSubjects(j.subjectsText).map(m => ({ name: m.name, ...reasonFor(j, m) })).filter(x => !x.reasonFromSheet);
      if (!missing.length && j.does) return null;
      const newLines = missing.map(x => `${x.name}: ${x.reason}`);
      return { job: j.job, missing: missing.map(x => x.name), noDoes: !j.does, cellText: [j.whyRaw, ...newLines].filter(Boolean).join('\n') };
    }).filter(Boolean);
  }, [dbJobs, schoolSubjectIndex]);
  const copyText = async (text, setMsg) => { try { await navigator.clipboard.writeText(text); setMsg && setMsg('복사했습니다.'); } catch (e) { window.prompt('복사해서 시트에 붙여 넣으세요.', text); } };

  // ── 과목 비교 ──
  const compareOptions = useMemo(() => [...uniqueElectiveSubjects].sort((a, b) => {
    const ta = TYPE_ORDER.indexOf(normalizeType(a.type, a.name)), tb = TYPE_ORDER.indexOf(normalizeType(b.type, b.name));
    return (ta - tb) || a.name.localeCompare(b.name, 'ko');
  }), [uniqueElectiveSubjects]);
  const addToCompare = (name) => {
    const next = [...compareNames];
    if (!next.includes(name)) { const i = next.indexOf(''); next[i === -1 ? 2 : i] = name; }
    setCompareNames(next); setInfoModalSubject(null); goTab('compare');
  };

                  <div className="flex items-center gap-2 mb-2"><span>ℹ️</span><span>하단 목록에서 추천 과목을 확인하세요!</span></div>
                  <div className="flex flex-col sm:flex-row flex-wrap gap-3 mt-1 sm:ml-6">
                    <span className="text-orange-600 flex items-center gap-1.5 text-sm lg:text-base"><span className="w-3 h-3 bg-orange-400 rounded-full inline-block animate-pulse"></span> 주황: 계열 추천</span>
                    {selectedMajor!=='none'&&<><span className="text-pink-600 flex items-center gap-1.5 text-sm lg:text-base"><span className="w-3 h-3 bg-pink-400 rounded-full inline-block animate-pulse"></span> 핑크색: 학과 추천</span><span className="text-blue-600 flex items-center gap-1.5 text-sm lg:text-base"><span className="w-3 h-3 bg-blue-400 rounded-full inline-block animate-pulse"></span> 초록색: 공통 추천</span></>}
                    {isScienceTrack&&<span className="text-teal-600 flex items-center gap-1.5 text-sm lg:text-base"><span className="w-3 h-3 bg-teal-500 rounded-full inline-block animate-pulse"></span> 청록색: 과중 대상</span>}
                  </div>
                </div>
              )}
            </div>

            {/* 학기 탭 */}
            <div id="subject-area" className="flex gap-2 overflow-x-auto pb-2 shrink-0 custom-scrollbar mt-1">
              {semesterTabs.map(tab=>{
                const groupsInSem=GROUPS.filter(g=>g.semester===tab.id);
                const isCompleted=groupsInSem.filter(g=>!g.isOptional).every(g=>selectedSubjects.filter(s=>s.group===g.id).length===g.maxPick);
                return (
                  <button key={tab.id} onClick={()=>setActiveSemesterTab(tab.id)}
                    className={`flex-1 min-w-[120px] py-2 px-4 rounded-lg font-extrabold text-sm lg:text-base whitespace-nowrap transition-all shadow-sm flex items-center justify-center gap-1.5 ${activeSemesterTab===tab.id?'bg-blue-700 text-white ring-2 ring-blue-300':'bg-white text-slate-600 hover:bg-blue-50 border-2 border-slate-200'}`}>
                    {tab.label}{isCompleted&&<span className="text-green-400 text-base">✔</span>}
                  </button>

              })}
            </div>

              const groupSubjects=dbSubjects.filter(s=>s.group===group.id);
              const pickedCount=selectedIds.filter(id=>groupSubjects.some(s=>s.id===id)).length;
              const isComplete=pickedCount===group.maxPick;
              if(groupSubjects.length===0) return null;

              // 이 군에만 걸린 규칙으로 화면 배치 결정 (예: 교과별 필수 택1 상자, 최대 N개 상자)
              const isGroupOnlyRule=r=>r.scopeExplicit&&r.groupIds.length===1&&r.groupIds[0]===group.id&&ruleAppliesToTrack(r,isScienceTrack);
              const perTypeRule=preparedRules.find(r=>isGroupOnlyRule(r)&&r.type==='교과별기준'&&r.minCount!=null&&r.categories.length>0);
              const capRule=!perTypeRule&&preparedRules.find(r=>isGroupOnlyRule(r)&&r.type==='교과기준'&&r.maxCount!=null&&r.categories.length>0);
              let typeBoxes=[], cappedSubjects=[], otherSubjects=[];
              if(perTypeRule){
                typeBoxes=perTypeRule.categories.map(c=>({type:c,subjects:groupSubjects.filter(s=>matchesCategory(s,c))}));
                otherSubjects=groupSubjects.filter(s=>!perTypeRule.categories.some(c=>matchesCategory(s,c)));
              } else if(capRule){
                cappedSubjects=groupSubjects.filter(s=>matchesRule(s,capRule));
                otherSubjects=groupSubjects.filter(s=>!matchesRule(s,capRule));
              } else { otherSubjects=groupSubjects; }
              const otherPickLimit=perTypeRule?group.maxPick-perTypeRule.minCount*perTypeRule.categories.length:null;

              const renderSubjectCard=(subject)=>{
                const isSelected=selectedIds.includes(subject.id);
                const normSubj=normalizeForMatch(subject.name);
                const isMajorRec=Array.from(majorRecommendedSet).some(rec=>normalizeForMatch(rec)===normSubj);
                const isFieldRec=Array.from(fieldRecommendedSet).some(rec=>normalizeForMatch(rec)===normSubj);
                
                const showMajorRec = isMajorRec;
                const showFieldRec = isFieldRec;
                const showBothRec = showMajorRec && showFieldRec;
                
                const isCsat=subject.csat&&subject.csat.trim()!==''&&!/x|-|해당|미출|없음|아님/i.test(subject.csat);
                const isSharedCampusCard=!!group.isSharedCampus;
                
                // 과학중점 과정: 해당 군을 콕 집은 과학중점 규칙(지정과목, 최소 이수)에 해당하는 과목에 '과중 대상' 표시
                const isScienceTrackTarget = isScienceTrack && preparedRules.some(r => r.track==='과학중점' && r.scopeExplicit && r.groupIds.includes(subject.group) && (
                  (r.type==='지정과목' && inSubjectList(subject.name, r.subjects)) ||
                  (['교과기준','교과별기준','권장'].includes(r.type) && (r.minCount!=null||r.minCredits!=null) && matchesRule(subject, r))
                ));

                const displayCardName=subject.school?`${subject.name} (${subject.school})`:subject.name;

                let borderClass='border-2 border-slate-200 hover:border-blue-400';
                let bgClass='bg-white';
                
                if(isSharedCampusCard){bgClass='bg-purple-100';borderClass='border-2 border-purple-300 hover:border-purple-500 shadow-sm';}
                else if(isCsat){bgClass='bg-yellow-50';}
                
                if(isSelected){
                  if(isSharedCampusCard){
                    borderClass='border-[3px] border-purple-600 shadow-md';
                    bgClass='bg-purple-300';
                  } else {
                    borderClass='border-[3px] border-slate-500 shadow-md';
                    bgClass='bg-slate-300';
                  }
                } else if(showBothRec) borderClass='border-[3px] border-blue-500 shadow-[0_0_12px_rgba(0,174,88,0.6)] animate-sparkle-blue';
                else if(showMajorRec) borderClass='border-2 border-pink-400 shadow-[0_0_8px_rgba(236,72,153,0.3)] animate-sparkle-pink';
                else if(showFieldRec) borderClass='border-2 border-orange-400 shadow-[0_0_8px_rgba(249,115,22,0.3)] animate-sparkle-orange';

                return (
                  <div key={subject.id} className={`relative p-2 lg:p-3 rounded-xl transition-all duration-300 flex flex-col group ${bgClass} ${borderClass}`}>
                    {showFieldRec&&<span className="absolute -top-3 -left-1 bg-orange-500 text-white text-[0.7rem] lg:text-[0.75rem] font-bold px-2 py-1 rounded-full shadow-lg z-10">✦ 계열 추천</span>}
                    {showMajorRec&&<span className="absolute -top-3 -right-1 bg-pink-500 text-white text-[0.7rem] lg:text-[0.75rem] font-bold px-2 py-1 rounded-full shadow-lg z-10">✦ 학과 추천</span>}

                      {subject.type&&<span className="inline-block bg-slate-200 text-slate-700 text-[0.7rem] lg:text-[0.8rem] font-bold px-1.5 py-0.5 rounded mb-1">{subject.type}</span>}

                        <h4 className="text-base lg:text-lg font-extrabold text-slate-900 leading-tight break-keep">{displayCardName}</h4>
                        <span className="text-[0.7rem] lg:text-[0.8rem] font-bold text-slate-500 bg-slate-100 px-2 py-1 rounded-md whitespace-nowrap">{subject.credits}학점</span>
                      </div>
                    </div>
                    <div className="flex flex-col gap-1 mt-auto pt-2">
                      {isScienceTrackTarget && (
                        <span className="bg-teal-600 text-white text-[0.7rem] lg:text-[0.75rem] font-black py-0.5 px-2 rounded-md text-center shadow-sm tracking-widest leading-none mb-1">과중 대상</span>
                      )}
                      <div className="flex gap-1.5 w-full">
                        <button onClick={()=>setInfoModalSubject(subject)} className="w-1/2 py-2 rounded-lg font-bold text-sm lg:text-base flex items-center justify-center gap-1 bg-slate-100 hover:bg-slate-200 text-slate-700 border border-slate-200 transition-transform active:scale-95">ℹ️ 안내</button>
                        <button onClick={()=>toggleSubject(subject)} className={`w-1/2 py-2 rounded-lg font-bold text-sm lg:text-base flex items-center justify-center gap-1 transition-transform active:scale-95 shadow-sm border ${isSelected?'bg-slate-800 text-white border-slate-900 hover:bg-slate-900':'bg-blue-600 text-white border-blue-600 hover:bg-blue-700'}`}>
