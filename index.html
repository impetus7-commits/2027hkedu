    body {

    @keyframes sparkle-pink {
      0%, 100% { border-color: #f472b6; box-shadow: 0 0 15px rgba(236,72,153,0.4); }
      50% { border-color: #db2777; box-shadow: 0 0 25px rgba(236,72,153,0.8); }
    }
    .animate-sparkle-pink { animation: sparkle-pink 2s infinite; }
    @keyframes sparkle-orange {
      0%, 100% { border-color: #fb923c; box-shadow: 0 0 15px rgba(249,115,22,0.4); }
      50% { border-color: #ea580c; box-shadow: 0 0 25px rgba(249,115,22,0.8); }
    }
    .animate-sparkle-orange { animation: sparkle-orange 2s infinite; }
    @keyframes sparkle-blue {
      0%, 100% { border-color: #00AE58; box-shadow: 0 0 15px rgba(0,174,88,0.4); }

    .animate-sparkle-blue { animation: sparkle-blue 2s infinite; }
