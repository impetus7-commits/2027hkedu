const TYPE_ORDER = ['국어', '수학', '영어', '사회 (역사/도덕 포함)', '과학', '체육', '예술', '기술·가정/정보', '제2외국어/한문', '교양', '기타'];

// ── 유틸 함수 ──
const normalizeForMatch = (str) => {
  if (!str) return '';
  let s = str.replace(/\(.*?\)/g, '').replace(/\[.*?\]/g, '').replace(/등\s*$/g, '');
  s = s.replace(/\s+/g, '')
    .replace(/Ⅰ/g,'I').replace(/Ⅱ/g,'II').replace(/Ⅲ/g,'III').replace(/Ⅳ/g,'IV')
    .replace(/[^a-zA-Z0-9가-힣+]/g,'').toUpperCase();
  return s.replace(/등$/, '');
};

const normalizeType = (typeStr, nameStr) => {
  if (typeStr && typeStr.trim() !== '') {
    const t = typeStr.replace(/\s+/g,'');
    if (t.includes('제2외국어')||t.includes('한문')||t.includes('외국어')) return '제2외국어/한문';
    if (t.includes('국어')) return '국어';
    if (t.includes('수학')) return '수학';
    if (t.includes('영어')) return '영어';
    if (t.includes('사회')) return '사회 (역사/도덕 포함)';
    if (t.includes('과학')) return '과학';
    if (t.includes('체육')) return '체육';
    if (t.includes('예술')||t.includes('음악')||t.includes('미술')) return '예술';
    if (t.includes('기술')||t.includes('가정')||t.includes('정보')) return '기술·가정/정보';
    if (t.includes('교양')) return '교양';
    return typeStr.trim();
  }
  const n = (nameStr||'').replace(/\s+/g,'');
  if (/제2외국어|일본어|중국어|한문|스페인어|프랑스어|독일어|러시아어|아랍어|베트남어/.test(n)) return '제2외국어/한문';
  if (/국어|문학|화법|독서|언어와매체/.test(n)) return '국어';
  if (/수학|대수|미적분|기하|통계/.test(n)) return '수학';
  if (/영어|영독/.test(n)) return '영어';
  if (/사회|한국사|지리|역사|정치|경제|윤리|법/.test(n)) return '사회 (역사/도덕 포함)';
  if (/체육|운동|스포츠/.test(n)) return '체육';
  if (/과학|물리|화학|생명|지구/.test(n)) return '과학';
  if (/음악|미술|예술/.test(n)) return '예술';
  if (/기술|가정|정보|인공지능|컴퓨터/.test(n)) return '기술·가정/정보';
  if (/교양|논리|교육|심리|철학|진로|환경/.test(n)) return '교양';
  return '기타';
};

const getSemesterFromText = (text) => {
  if (!text||typeof text!=='string') return null;
  const t = text.replace(/\s+/g,'');
  if(t.includes('1학년1학기')) return '1-1';
  if(t.includes('1학년2학기')) return '1-2';
  if(t.includes('2학년1학기')) return '2-1';
  if(t.includes('2학년2학기')) return '2-2';
  if(t.includes('3학년1학기')) return '3-1';
  if(t.includes('3학년2학기')) return '3-2';
  return null;
};

// 편성 문구(예: "2학년 2A군(2학년 1학기) 선택")에서 선택군 ID 찾기
const findGroupInText = (text, groups) => {
  if (!text||typeof text!=='string') return null;
  const t = text.replace(/\s+/g,'').toUpperCase();
  const ids = groups.map(g=>g.id).sort((a,b)=>b.length-a.length);
  return ids.find(id => t.includes(id.toUpperCase())) || null;
};

// ══════════════════════════════════════════════════════════════
// ── 규칙 엔진: [규칙] 탭의 각 줄을 계산합니다 ──
// ══════════════════════════════════════════════════════════════
const splitList = (v) => String(v||'').split(/[,，、\n]+/).map(x=>x.trim()).filter(Boolean);
const toNumOrNull = (v) => { const n = parseFloat(String(v??'').replace(/[^0-9.]/g,'')); return isNaN(n) ? null : n; };
const isYes = (v) => /^(o|O|○|●|예|y|Y|yes|true|1|v|V|✔|✓)$/.test(String(v??'').trim());
const sumCredits = (list) => list.reduce((sum, s) => sum + (s.credits||0), 0);
const inSubjectList = (name, list) => list.some(x => normalizeForMatch(x) === normalizeForMatch(name));

const normalizeTrack = (v) => {
  const t = String(v||'').replace(/\s+/g,'');
  if (t.includes('과학')) return '과학중점';
  if (t.includes('일반')) return '일반';
  return '전체';
};
const ruleAppliesToTrack = (rule, isScienceTrack) => rule.track === '전체' || rule.track === (isScienceTrack ? '과학중점' : '일반');

// "2A, 2B" → 해당 군 / "2학년"·"3학년" → 해당 학년의 군 / "전체"·빈칸 → 희망자 군을 뺀 모든 군
const resolveScope = (scope, groups) => {
  const s = String(scope||'').replace(/\s+/g,'').toUpperCase();
  const regular = groups.filter(g => !g.isOptional);
  const named = groups.filter(g => s.includes(g.id.toUpperCase()));
  if (named.length > 0) return { ids: named.map(g=>g.id), explicit: true };
  if (/^2학년/.test(s)) return { ids: regular.filter(g=>g.semester.startsWith('2-')).map(g=>g.id), explicit: false };
  if (/^3학년/.test(s)) return { ids: regular.filter(g=>g.semester.startsWith('3-')).map(g=>g.id), explicit: false };
  return { ids: regular.map(g=>g.id), explicit: false };
};

const prepareRules = (rules, groups) => rules.map((r, i) => {
  const scope = resolveScope(r.scope, groups);
  return { ...r, key: `r${i}`, groupIds: scope.ids, scopeExplicit: scope.explicit };
});

// 교과 이름으로 과목 맞추기 ('정보'는 기술·가정/정보 중 정보 계열 과목만)
const matchesCategory = (subj, cat) => {
  const t = normalizeType(subj.type, subj.name);
  if (String(cat).replace(/\s+/g,'') === '정보') return t === '기술·가정/정보' && INFO_SUBJECT_RE.test(subj.name);
  return normalizeType(cat, '') === t;
};
const matchesRule = (subj, rule) => {
  if (rule.categories.length === 0 && rule.subjects.length === 0) return true;
  return rule.categories.some(c => matchesCategory(subj, c)) || inSubjectList(subj.name, rule.subjects);
};

const ruleTally = (rule, list, mandatoryList) => {
  const matched = list.filter(s => matchesRule(s, rule));
  const mand = rule.includeMandatory ? mandatoryList.filter(m => matchesRule(m, rule)) : [];
  const count = matched.length + mand.length;
  const credits = sumCredits(matched) + sumCredits(mand);
  const parts = [];
  if (rule.minCredits != null || rule.maxCredits != null) parts.push(`${credits}학점`);
  if (rule.minCount != null || rule.maxCount != null || parts.length === 0) parts.push(`${count}과목`);
  return { count, credits, text: parts.join('/') };
};

// 현재 선택 상태에서 규칙 한 줄의 결과: pass(충족) / fail(위반) / info(진행 중·안내)
const evaluateRule = (rule, ctx) => {
  const { groupMap, selected, mandatoryList } = ctx;
  const scopeGroups = rule.groupIds.map(id => groupMap[id]).filter(Boolean);
  const inScope = selected.filter(s => rule.groupIds.includes(s.group));
  const isComplete = scopeGroups.every(g => selected.filter(s => s.group === g.id).length >= g.maxPick);
  const progress = scopeGroups.map(g => `${g.label}(${selected.filter(s => s.group === g.id).length}/${g.maxPick})`).join(', ');
  const res = (status, detail) => ({ status, detail });

  switch (rule.type) {
    case '선택개수':
      return isComplete ? res('pass', '(선택 완료)') : res('info', `(선택 진행 중... ${progress})`);
    case '지정과목': {
      const bad = inScope.filter(s => !inSubjectList(s.name, rule.subjects));
      if (bad.length > 0) return res('fail', `(요건 위반 - 지정되지 않은 과목: ${bad.map(s=>s.name).join(', ')})`);
      return isComplete ? res('pass', '(조건 충족)') : res('info', `(선택 진행 중... ${progress})`);
    }
    case '중복금지': {
      const names = inScope.filter(s => matchesRule(s, rule)).map(s => normalizeForMatch(s.name));
      if (names.some((n, i) => names.indexOf(n) !== i)) return res('fail', '(중복 선택됨 - 요건 위반)');
      return isComplete ? res('pass', '(중복 없음)') : res('info', `(선택 진행 중... ${progress})`);
    }
    case '교과별기준': {
      const counts = rule.categories.map(c => [c, inScope.filter(s => matchesCategory(s, c)).length]);
      const txt = counts.map(([c, n]) => `${c} ${n}`).join(', ');
      if (rule.maxCount != null && counts.some(([, n]) => n > rule.maxCount)) return res('fail', `(요건 위반 - ${txt})`);
      const ok = rule.minCount == null || counts.every(([, n]) => n >= rule.minCount);
      if (!isComplete) return res('info', `(선택 진행 중... ${txt})`);
      return ok ? res('pass', `(조건 충족 - ${txt})`) : res('fail', `(요건 미달 - ${txt})`);
    }
    case '교과기준':
    case '권장': {
      const t = ruleTally(rule, inScope, mandatoryList);
      const over = (rule.maxCount != null && t.count > rule.maxCount) || (rule.maxCredits != null && t.credits > rule.maxCredits);
      if (over) return res(rule.type === '권장' ? 'info' : 'fail', `(요건 위반 - 현재 ${t.text})`);
      const mins = [];
      if (rule.minCount != null) mins.push(t.count >= rule.minCount);
      if (rule.minCredits != null) mins.push(t.credits >= rule.minCredits);
      if (mins.length === 0) return isComplete ? res('pass', `(조건 충족: ${t.text})`) : res('info', `(선택 진행 중... 현재 ${t.text})`);
      const met = rule.combine === '하나' ? mins.some(Boolean) : mins.every(Boolean);
      if (met) return res('pass', `(충족: ${t.text})`);
      if (!isComplete) return res('info', `(선택 진행 중... 현재 ${t.text})`);
      return rule.type === '권장' ? res('pass', `(권장 사항 - 필수는 아님, 현재 ${t.text})`) : res('fail', `(미달: 현재 ${t.text})`);
    }
    default:
      return res('info', '');
  }
};

// 과목을 담을 때 규칙을 어기거나, 담으면 나중에 규칙을 채울 수 없게 되는지 확인
const getAddViolation = (rule, subject, nextSelected, ctx) => {
  if (!rule.groupIds.includes(subject.group)) return null;
  const { groupMap, mandatoryList } = ctx;
  const scopeGroups = rule.groupIds.map(id => groupMap[id]).filter(Boolean);
  const inScope = nextSelected.filter(s => rule.groupIds.includes(s.group));
  const remainingPicks = scopeGroups.reduce((sum, g) => sum + g.maxPick, 0) - inScope.length;
  const remainingCredits = scopeGroups.reduce((sum, g) => sum + (g.totalCredits||0), 0) - sumCredits(inScope);

  switch (rule.type) {
    case '지정과목':
      return inSubjectList(subject.name, rule.subjects) ? null : '이 군에서는 지정된 과목 중에서만 선택할 수 있습니다.';
    case '중복금지': {
      if (!matchesRule(subject, rule)) return null;
      const same = inScope.filter(s => matchesRule(s, rule) && normalizeForMatch(s.name) === normalizeForMatch(subject.name));
      return same.length > 1 ? `'${subject.name}' 과목은 1, 2학기에 중복해서 선택할 수 없습니다.` : null;
    }
    case '교과별기준': {
      const counts = rule.categories.map(c => [c, inScope.filter(s => matchesCategory(s, c)).length]);
      const over = counts.find(([, n]) => rule.maxCount != null && n > rule.maxCount);
      if (over) return `${over[0]} 교과군 과목은 최대 ${rule.maxCount}과목까지만 선택할 수 있습니다.`;
      if (rule.minCount != null) {
        const deficit = counts.reduce((sum, [, n]) => sum + Math.max(0, rule.minCount - n), 0);
        if (deficit > remainingPicks) return '이 과목을 담으면 남은 자리로는 위 조건을 채울 수 없습니다.';
      }
      return null;
    }
    case '교과기준': {
      const t = ruleTally(rule, inScope, mandatoryList);
      if (rule.maxCount != null && t.count > rule.maxCount) return `해당 과목은 합쳐서 최대 ${rule.maxCount}과목까지만 선택할 수 있습니다.`;
      if (rule.maxCredits != null && t.credits > rule.maxCredits) return `이 과목을 담으면 ${t.credits}학점이 되어 ${rule.maxCredits}학점을 넘습니다.`;
      if (rule.combine !== '하나') {
        if (rule.minCount != null && rule.minCount - t.count > remainingPicks) return '이 과목을 담으면 남은 자리로는 위 조건을 채울 수 없습니다.';
        if (rule.minCredits != null && t.credits + remainingCredits < rule.minCredits) return `이 과목을 담으면 최대 ${t.credits + remainingCredits}학점까지만 가능해 ${rule.minCredits}학점을 채울 수 없습니다.`;
      }
      return null;
    }
    default:
      return null;
  }
};

// 규칙 안내문 속 군 ID(2A 등)를 학생에게 보이는 이름(A 등)으로 바꾸기
const replaceGroupIds = (text, groups) => {
  if (!text || groups.length === 0) return text || '';
  const ids = groups.map(g => g.id).sort((a, b) => b.length - a.length).map(id => id.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
  const labelMap = Object.fromEntries(groups.map(g => [g.id, g.label]));
  return text.replace(new RegExp(`(?<![0-9A-Za-z])(${ids.join('|')})(?![0-9A-Za-z])`, 'g'), m => labelMap[m] || m);
};

// ── 시트 탭 → 설정값 변환 ──
const normHeader = (h) => String(h??'').replace(/"/g,'').replace(/\s+/g,'');
const headerIndex = (headers, ...aliases) => {
  const hs = headers.map(normHeader);
  for (const a of aliases) { const i = hs.indexOf(normHeader(a)); if (i !== -1) return i; }
  for (const a of aliases) { const i = hs.findIndex(h => h.includes(normHeader(a))); if (i !== -1) return i; }
  return -1;
};
const cell = (row, i) => (i !== -1 && row[i] != null) ? String(row[i]).trim() : '';

const parseInfoSheet = (rows) => {
  const map = {};
  rows.slice(1).forEach(r => { const k = normHeader(r[0]); if (k) map[k] = String(r[1]??'').trim(); });
  const pick = (...keys) => { for (const k of keys) if (map[normHeader(k)]) return map[normHeader(k)]; return ''; };
  return {
    schoolName: pick('학교명') || DEFAULT_INFO.schoolName,
    schoolShort: pick('학교약칭', '약칭') || DEFAULT_INFO.schoolShort,
    admissionYear: (pick('입학년도', '입학연도').match(/\d{4}/)||[])[0] || DEFAULT_INFO.admissionYear,
    csatYear: (pick('수능년도', '수능연도', '수능').match(/\d{4}/)||[])[0] || DEFAULT_INFO.csatYear,
    semesterCredits: toNumOrNull(pick('학기별교과학점', '학기당교과학점')) || DEFAULT_INFO.semesterCredits,
    source: pick('자료출처', '출처') || DEFAULT_INFO.source,
  };
};

const parseSemester = (v) => {
  const s = String(v||'').replace(/\s+/g,'');
  const m = s.match(/^([1-3])-([12])$/) || s.match(/([1-3])학년([12])학기/);
  return m ? `${m[1]}-${m[2]}` : null;
};

const parseGroupsSheet = (rows, issues) => {
  const h = rows[0];
  const ix = {
    id: headerIndex(h, '군ID', '군코드', 'ID'), label: headerIndex(h, '표시이름', '표시'),
    sem: headerIndex(h, '학기'), pick: headerIndex(h, '선택과목수', '택'), credits: headerIndex(h, '학점'),
    optional: headerIndex(h, '희망자선택', '희망자'), shared: headerIndex(h, '공유캠퍼스'), notice: headerIndex(h, '안내문', '안내'),
  };
  const groups = [];
  rows.slice(1).forEach((r, i) => {
    const id = cell(r, ix.id).toUpperCase().replace(/\s+/g,'');
    if (!id) return;
    const semester = parseSemester(cell(r, ix.sem));
    const maxPick = toNumOrNull(cell(r, ix.pick));
    if (!semester) issues.push(`[선택군] ${i+2}행 ${id}: 학기를 알 수 없습니다 ('2-1'처럼 적어 주세요).`);
    if (!maxPick) issues.push(`[선택군] ${i+2}행 ${id}: 선택과목수가 비어 있습니다.`);
    if (!semester || !maxPick) return;
    const isSharedCampus = isYes(cell(r, ix.shared));
    groups.push({
      id, label: cell(r, ix.label) || id, semester, maxPick,
      totalCredits: toNumOrNull(cell(r, ix.credits)) || 0,
      isOptional: isYes(cell(r, ix.optional)) || isSharedCampus, isSharedCampus,
      notice: cell(r, ix.notice),
    });
  });
  return groups;
};

const parseRulesSheet = (rows, issues) => {
  const h = rows[0];
  const ix = {
    track: headerIndex(h, '과정'), type: headerIndex(h, '규칙유형', '유형'), scope: headerIndex(h, '대상군', '적용군'),
    cats: headerIndex(h, '대상교과'), subs: headerIndex(h, '대상과목'),
    minCount: headerIndex(h, '최소과목'), maxCount: headerIndex(h, '최대과목'),
    minCredits: headerIndex(h, '최소학점'), maxCredits: headerIndex(h, '최대학점'),
    combine: headerIndex(h, '충족방식'), mand: headerIndex(h, '지정과목포함'), text: headerIndex(h, '안내문', '설명'),
  };
  const rules = [];
  rows.slice(1).forEach((r, i) => {
    const typeRaw = cell(r, ix.type).replace(/\s+/g,'');
    const text = cell(r, ix.text);
    if (!typeRaw && !text) return;
    let type = typeRaw;
    if (!RULE_TYPES.includes(type)) {
      issues.push(`[규칙] ${i+2}행: 규칙유형 '${typeRaw}'을(를) 알 수 없어 '안내'로 처리했습니다. (${RULE_TYPES.join(' / ')})`);
      type = '안내';
    }
    rules.push(R(normalizeTrack(cell(r, ix.track)), type, cell(r, ix.scope), {
      categories: splitList(cell(r, ix.cats)), subjects: splitList(cell(r, ix.subs)),
      minCount: toNumOrNull(cell(r, ix.minCount)), maxCount: toNumOrNull(cell(r, ix.maxCount)),
      minCredits: toNumOrNull(cell(r, ix.minCredits)), maxCredits: toNumOrNull(cell(r, ix.maxCredits)),
      combine: cell(r, ix.combine).includes('하나') || cell(r, ix.combine).includes('또는') ? '하나' : '모두',
      includeMandatory: isYes(cell(r, ix.mand)), text, row: i + 2,
    }));
  });
  return rules;
};

const parseCSV = (str) => {
  const arr = [];
  let quote=false, row=[], col='';
  for(let c=0;c<str.length;c++){
    let cc=str[c],nc=str[c+1];
    if(cc==='"'&&quote&&nc==='"'){col+=cc;c++;continue;}
    if(cc==='"'){quote=!quote;continue;}
    if(cc===','&&!quote){row.push(col.trim());col='';continue;}
    if(cc==='\n'&&!quote){
      if(col.endsWith('\r'))col=col.slice(0,-1);
      row.push(col.trim());arr.push(row);row=[];col='';continue;
    }
    col+=cc;
  }
  if(col.endsWith('\r'))col=col.slice(0,-1);
  row.push(col.trim());
  if(row.length>0)arr.push(row);
  return arr;
};

const isInvalidData = (val) => {
  if (!val) return true;
  const v = String(val).trim();
  return v===''||v==='-'||v.replace(/-/g,'')===''||v.toLowerCase()==='n/a'||v==='없음'||v==='.';
};

const formatReportText = (text) => {
  if (!text||String(text).trim()===''||String(text).trim()==='-') return '-';
  let str = String(text);  
  str = str.replace(/\s*(\[[^\]]+\])\s*/g, '\n$1 ');
  str = str.replace(/(^|\n)\s*-\s*/g, '$1- ');
  str = str.replace(/,\s*/g, ', ');
  str = str.replace(/\n+/g, '\n').trim();

  return str.split('\n').map((line,idx)=>{
    const t=line.trim();
    return t?<span key={idx} className="block mt-1.5 first:mt-0 break-keep">{t}</span>:null;
  });
};

      const delays=[1000,2000,4000,8000,16000];
      for(let i=0;i<retries;i++){
        try{
          const response = await fetch(url);
          if(!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
          return await response.text();
       } catch(err){
          if(i===retries-1) throw new Error(`서버와의 통신이 원활하지 않습니다. (원인: ${err.name}: ${err.message})`);

       }
      }
    };

    try {

              const keySet=new Set();
              sheetData.forEach(obj=>Object.keys(obj).forEach(k=>keySet.add(k)));
              const headers=Array.from(keySet);
              rows.push(headers);
              sheetData.forEach(obj=>rows.push(headers.map(h=>obj[h]!=null?String(obj[h]):'')));
            } else { rows=sheetData; }
            
            const k=key.replace(/\s+/g,'');
            const headerStr = rows.length > 0 ? rows[0].join('').replace(/\s+/g, '') : '';

          if(u)lastUniv=u; else u=lastUniv;

      }

      const fieldDataMap=new Map(), fieldDetailsMap={};
      if(parsedFields.length>1){

          field:fieldHeaders.findIndex(h=>h.includes('계열')),

          recommendStudent:fieldHeaders.findIndex(h=>h.includes('이런학생')||h.includes('권한다')||h.includes('적성')||h.includes('흥미')),

          recCar:fieldHeaders.findIndex(h=>h.includes('진로')),

        if(mIdx.field===-1) mIdx.field=0;

          if(fieldName&&majorName){
            const desc=getVal(row,mIdx.desc,2), recommendStudent=getVal(row,mIdx.recommendStudent,3),
              recGen=getVal(row,mIdx.recGen,4), recCar=getVal(row,mIdx.recCar,5),
              recConv=getVal(row,mIdx.recConv,6), univSeoul=getVal(row,mIdx.univSeoul,7),
              univCap=getVal(row,mIdx.univCap,8), univLoc=getVal(row,mIdx.univLoc,9),
              majorSubjects=getVal(row,mIdx.majorSubjects,10), similarDepts=getVal(row,mIdx.similarDepts,11),
              careerPaths=getVal(row,mIdx.careerPaths,12);
              
            const recsForPlanner=[];
            [recGen,recCar,recConv].forEach(val=>{if(val)val.split(/[,\n\r/]+/).forEach(v=>{let clean=v.replace(/등\s*$/,'').trim(); if(clean)recsForPlanner.push(clean);});});
            if(!majorDataMap.has(fieldName))majorDataMap.set(fieldName,[]);
            majorDataMap.get(fieldName).push({name:majorName,recommended:recsForPlanner});
            deptDetailsMap[majorName]={field:fieldName,name:majorName,desc,recommendStudent,recGen,recCar,recConv,univSeoul,univCap,univLoc,majorSubjects,similarDepts,careerPaths};
          }
        });
      }
      setDbDepartmentDetails(deptDetailsMap);

      const finalFields=[{id:'none',name:'희망계열 선택'}], finalMajors={none:[{id:'none',name:'계열을 먼저 선택하세요',recommended:[],recommendType:'none'}]};
      const allFields=new Set([...fieldDataMap.keys(),...majorDataMap.keys()]);
      Array.from(allFields).forEach(fieldName=>{
        finalFields.push({id:fieldName,name:fieldName});
        const fieldRecs=fieldDataMap.get(fieldName)||[];
        const majorsForField=majorDataMap.get(fieldName)||[];
        finalMajors[fieldName]=[
          {id:'none',name:'아직 없음',recommended:fieldRecs,recommendType:'field'},
          ...majorsForField.map(m=>({id:m.name,name:m.name,recommended:m.recommended,recommendType:'major'}))
        ];
      });
      if(finalFields.length>1){setDbFields(finalFields);setDbMajors(finalMajors);}

      const loadedSubjects=[];
      let loadedMandatory=JSON.parse(JSON.stringify(DEFAULT_MANDATORY_SUBJECTS)), hasSheetMandatory=false;
      if(parsedSubjects.length>1){
        const subjHeaders=parsedSubjects[0].map(h=>String(h).replace(/"/g,'').trim().replace(/\s+/g,''));
        const findIdx=(...keywords)=>subjHeaders.findIndex(h=>keywords.some(k=>h.includes(k)));
        const findAllIdx=(...keywords)=>subjHeaders.reduce((acc,h,i)=>{if(keywords.some(k=>h.includes(k)))acc.push(i);return acc;},[]);
        const idx={
          subject:findIdx('과목명','교과목'),group:findIdx('편성','군'),credits:findIdx('학점','단위'),
          type:findIdx('교과군','교과영역','과목유형'),desc:findIdx('한줄소개','과목설명','설명'),
          evalInfo:findIdx('평가','등급'),mainContent:findIdx('주요'),csat:findIdx('수능','출제'),
          career:findIdx('직업'),department:findIdx('학과'),selType:findIdx('선택유형','선택 유형'),
          evalAbs:findIdx('절대평가','성취도'),evalRel:findIdx('상대평가','석차등급'),keywords:findIdx('키워드','핵심키워드'),
          youtube:findIdx('유튜브','영상','youtube','링크','url')
        };
        const areaIdxs=findAllIdx('대영역'), conceptIdxs=findAllIdx('생각열기','핵심개념'), actIdxs=findAllIdx('학습활동','주요학습');
        const intIdxs=findAllIdx('관심분야'), topicIdxs=findAllIdx('주제탐구','탐구과제'), caseIdxs=findAllIdx('활동사례','사례');
        const recIdxs=findAllIdx('추천학생','이런학생','추천해요','추천1','추천2','추천3');
        if(idx.subject===-1)idx.subject=0;
        if(idx.youtube===-1)idx.youtube=34;

        parsedSubjects.slice(1).forEach((row,rowIndex)=>{
          const name=getVal(row,idx.subject,0);
          if(!name) return;
          const groupStr=getVal(row,idx.group,1), creditsStr=getVal(row,idx.credits,2);
          const credits=parseInt(creditsStr.replace(/[^0-9]/g,''),10)||0;
          const type=getVal(row,idx.type,3), desc=getVal(row,idx.desc,5);
          const areas=areaIdxs.map(i=>getVal(row,i,'')), concepts=conceptIdxs.map(i=>getVal(row,i,'')), acts=actIdxs.map(i=>getVal(row,i,''));
          const learn=[];
          for(let i=0;i<Math.max(areas.length,concepts.length,acts.length);i++){
            if(areas[i]||concepts[i]||acts[i]) learn.push({area:areas[i]||'',concept:concepts[i]||'',act:acts[i]||''});
          }
          const ints=intIdxs.map(i=>getVal(row,i,'')), topics=topicIdxs.map(i=>getVal(row,i,'')), cases=caseIdxs.map(i=>getVal(row,i,''));
          const advanced=[];
          for(let i=0;i<Math.max(ints.length,topics.length,cases.length);i++){
            if(ints[i]||topics[i]||cases[i]) advanced.push({int:ints[i]||'',topic:topics[i]||'',case:cases[i]||''});
          }
          let recommend=[];
          recIdxs.forEach(i=>{const val=getVal(row,i,'');if(val){const lines=val.split('\n').map(l=>l.replace(/^[•\-\*]\s*/,'').trim()).filter(l=>l);recommend.push(...lines);}});
          const popupData={
            selType:getVal(row,idx.selType,''),evalAbs:getVal(row,idx.evalAbs,''),evalRel:getVal(row,idx.evalRel,''),
            desc:getVal(row,idx.desc,''),keywords:getVal(row,idx.keywords,''),learn,advanced,recommend,
            youtube:getVal(row,idx.youtube,-1)
          };
          const csat=getVal(row,idx.csat,8);
          
          if(groupStr.includes('지정')){
            if(!hasSheetMandatory){loadedMandatory={'1-1':[],'1-2':[],'2-1':[],'2-2':[],'3-1':[],'3-2':[]};hasSheetMandatory=true;}
            const sem=getSemesterFromText(groupStr);
            if(sem) loadedMandatory[sem].push({name,credits,type,desc,csat,popupData});
          } else {
            const groupId=findGroupInText(groupStr, loadedGroups);
            const g=loadedGroups.find(gr=>gr.id===groupId);
            if(!g){ issues.push(`[과목데이터] ${rowIndex+2}행 '${name}': 편성 '${groupStr}'에 해당하는 선택군이 [선택군]에 없습니다.`); return; }
            const semInText=getSemesterFromText(groupStr);
            if(semInText&&semInText!==g.semester) issues.push(`[과목데이터] ${rowIndex+2}행 '${name}': 편성에는 ${semInText.replace('-','학년 ')}학기라고 적혀 있지만 ${g.id}군은 ${g.semester.replace('-','학년 ')}학기입니다.`);
            if(!credits) issues.push(`[과목데이터] ${rowIndex+2}행 '${name}': 학점이 비어 있습니다.`);
            const school=g.isSharedCampus?(sharedSchoolMap[normalizeForMatch(name)]||''):'';
            if(g.isSharedCampus&&!school) issues.push(`[과목데이터] '${name}': [공유캠퍼스] 탭에서 운영 학교를 찾지 못했습니다.`);
            // 과목 ID는 '군|과목명'으로 고정 → 시트 행 순서가 바뀌어도 학생 선택 기록이 유지됨
            loadedSubjects.push({id:`${groupId}|${name}`,name,group:groupId,type,credits,desc,csat,school,popupData});
          }
        });

        setDbSubjects(loadedSubjects);
        setDbMandatory(loadedMandatory);
      }

      // ── 시트 점검 (?check=1 화면에 표시) ──
      const subjectsForCheck = parsedSubjects.length>1 ? loadedSubjects : [];
      loadedGroups.forEach(g=>{
        const subs=subjectsForCheck.filter(x=>x.group===g.id);
        if(subjectsForCheck.length>0&&subs.length<g.maxPick) issues.push(`[선택군] ${g.id}(${g.label})군: 과목이 ${subs.length}개뿐인데 ${g.maxPick}과목을 골라야 합니다.`);
        if(!g.isOptional&&g.totalCredits){
          subs.filter(x=>x.credits&&x.credits*g.maxPick!==g.totalCredits).forEach(x=>issues.push(`[선택군] ${g.id}군 '${x.name}': ${x.credits}학점 × 택${g.maxPick} ≠ 군 학점 ${g.totalCredits}학점`));
        }
      });
      const knownTypes=[...TYPE_ORDER,'정보'];
      prepareRules(loadedRules, loadedGroups).forEach(r=>{
        const where=r.row?`[규칙] ${r.row}행`:'[기본 규칙]';
        r.categories.filter(c=>!knownTypes.includes(normalizeType(c,''))&&c.replace(/\s+/g,'')!=='정보').forEach(c=>issues.push(`${where}: 대상교과 '${c}'을(를) 알 수 없습니다.`));
        if(r.scope&&!/전체|학년/.test(r.scope)&&!r.scopeExplicit) issues.push(`${where}: 대상군 '${r.scope}'에 해당하는 선택군이 없습니다.`);
        if(['지정과목','중복금지'].includes(r.type)||r.subjects.length>0){
          r.subjects.filter(nm=>!subjectsForCheck.some(x=>r.groupIds.includes(x.group)&&normalizeForMatch(x.name)===normalizeForMatch(nm)))
            .forEach(nm=>subjectsForCheck.length>0&&issues.push(`${where}: 대상과목 '${nm}'이(가) 대상군 과목 목록에 없습니다 (띄어쓰기·Ⅰ/I 확인).`));
        }
        if(r.type==='지정과목'&&r.subjects.length===0) issues.push(`${where}: 지정과목 규칙인데 대상과목이 비어 있습니다.`);
      });

      setDbInfo(loadedInfo);
      setDbGroups(loadedGroups);
      setDbRules(loadedRules);
      setDataIssues(issues);
      setDataNotes(notes);
      if (parsedTimetable && parsedTimetable.length > 0) setDbTimetableSheet(parsedTimetable);
      setIsLoading(false);

    } catch(error) {
      console.error("Sheet Fetch Error:",error);
      setFetchError(String(error.message||error) + "\n\n※ 웹앱 URL이 변경되었거나 접근 권한('모든 사용자')이 없는지 확인해 주세요.");
      setIsLoading(false);
    }
  };

  useEffect(() => { fetchGoogleSheetData(); }, []);
  useEffect(() => { document.title = `${dbInfo.schoolName} 과목 선택 시스템 (${dbInfo.admissionYear}학년도 입학생)`; }, [dbInfo]);

  const selectedSubjects = dbSubjects.filter(s=>selectedIds.includes(s.id));

  const fieldRecommendedSet = useMemo(() => {
    if(selectedField==='none') return new Set();
    const fieldBase=dbMajors[selectedField]?.find(m=>m.id==='none');
    return new Set(fieldBase?.recommended||[]);
  }, [selectedField,dbMajors]);

  const majorRecommendedSet = useMemo(() => {
    if(selectedField==='none'||selectedMajor==='none') return new Set();
    const majorData=dbMajors[selectedField]?.find(m=>m.id===selectedMajor);
    return new Set(majorData?.recommended||[]);
  }, [selectedField,selectedMajor,dbMajors]);

  const tableDataMatrix = useMemo(() => {
    const allPlan=[];
    SEMESTERS.forEach(sem=>{
      (dbMandatory[sem]||[]).forEach(m=>{
        allPlan.push({semester:sem,name:m.name,credits:m.credits,type:normalizeType(m.type,m.name),isMandatory:true,csat:m.csat,groupId:'mandatory'});
      });
    });
    selectedSubjects.forEach(e=>{
      const groupDef=GROUPS.find(g=>g.id===e.group);
      if(groupDef) allPlan.push({semester:groupDef.semester,name:e.name,credits:e.credits,type:normalizeType(e.type,e.name),isMandatory:false,csat:e.csat,groupId:e.group,school:e.school});
    });
    const forcedTypes=['기술·가정/정보','제2외국어/한문'];
    const presentTypes=TYPE_ORDER.filter(t=>forcedTypes.includes(t)||allPlan.some(item=>item.type===t));
    const miscTypes=Array.from(new Set(allPlan.map(i=>i.type))).filter(t=>!TYPE_ORDER.includes(t));
    return {allPlan,rowTypes:[...presentTypes,...miscTypes]};
  }, [dbMandatory,selectedSubjects]);

  const uniqueElectiveSubjects = useMemo(() => {
    const map=new Map();
    dbSubjects.forEach(s=>{if(!map.has(s.name))map.set(s.name,s);});
    return Array.from(map.values());
  }, [dbSubjects]);

  const subjectsInGuideType = useMemo(() => {
    if(guideSelectedType==='none') return [];
    return uniqueElectiveSubjects.filter(s=>normalizeType(s.type,s.name)===guideSelectedType).sort((a,b)=>a.name.localeCompare(b.name,'ko'));
  }, [uniqueElectiveSubjects,guideSelectedType]);

  const guideSubjectDetails = useMemo(() => {
    if(guideSelectedSubject==='none') return null;
    return uniqueElectiveSubjects.find(s=>s.name===guideSelectedSubject);
  }, [uniqueElectiveSubjects,guideSelectedSubject]);

  const getRecommenders = (subject) => {
    if (!subject) return [];
    const normTarget = normalizeForMatch(subject.name);
    const targetType = normalizeType(subject.type, subject.name);

    const checkMatch = (rec) => {
      const normRec = normalizeForMatch(rec);
      if (normRec === normTarget) return true;
      if (targetType === '제2외국어/한문') {
        const targetIsHanja = normTarget.includes('한문');
        const recHasHanja = normRec.includes('한문');
        const recHasForeign = normRec.includes('외국어') || normRec.includes('제2외국어');
        
        const recHasJapanese = normRec.includes('일본어');
        const recHasChinese = normRec.includes('중국어');

        if (recHasHanja && recHasForeign) return true;
        if (targetIsHanja) { if (recHasHanja) return true; } 
        else { 
          if (recHasForeign) return true;
          if (normTarget.includes('일본어') && recHasJapanese) return true;
          if (normTarget.includes('중국어') && recHasChinese) return true;
        }
      }
      return false;
    };

    const results = [];
    Object.keys(dbMajors).forEach(fieldName => {
      if (fieldName === 'none') return;
      const majors = dbMajors[fieldName];
      const fieldBase = majors.find(m => m.id === 'none');
      const isFieldRec = fieldBase ? fieldBase.recommended.some(checkMatch) : false;
      const explicitMajors = majors.filter(m => m.id !== 'none' && m.recommended.some(checkMatch));

      explicitMajors.forEach(m => {
        if (isFieldRec) {
          results.push({ type: '공통 추천', field: fieldName, major: m.name });
        } else {
          results.push({ type: '학과 추천', field: fieldName, major: m.name });
        }
      });

      if (isFieldRec) {
        if (explicitMajors.length > 0) {
          results.push({ type: '계열 추천', field: fieldName, major: '그 외 전체 학과' });
        } else {
          results.push({ type: '계열 추천', field: fieldName, major: '전체 학과' });
        }
      }
    });

    return results.sort((a, b) => {
      const order = { '공통 추천': 1, '계열 추천': 2, '학과 추천': 3 };
      if (order[a.type] !== order[b.type]) return order[a.type] - order[b.type];
      if (a.field !== b.field) return a.field.localeCompare(b.field, 'ko');
      return a.major.localeCompare(b.major, 'ko');
    });
  };

  const popupRecommenders = useMemo(() => getRecommenders(infoModalSubject), [infoModalSubject, dbMajors]);
  const guideRecommenders = useMemo(() => getRecommenders(guideSubjectDetails), [guideSubjectDetails, dbMajors]);

  // 실시간 조건 검증 엔진 ([규칙] 탭 기반)
  const mandatoryList = useMemo(() => Object.values(dbMandatory).flat(), [dbMandatory]);
  const evaluatedConditions = useMemo(() => {
    return preparedRules.map(rule => {
      const { status, detail } = evaluateRule(rule, { groupMap, selected: selectedSubjects, mandatoryList });
      const text = rule.text || `${rule.scope || '전체'} ${rule.type}${rule.categories.length ? ` (${rule.categories.join(', ')})` : ''}`;
      return { key: rule.key, track: rule.track, rule, original: text, displayOriginal: replaceGroupIds(text, GROUPS), status, currentStatusText: detail };
    });
  }, [preparedRules, selectedSubjects, mandatoryList, groupMap, GROUPS]);

  // 커스텀 과정 변경 및 초기화 경고 로직
  const handleTrackChange = (trackType, isChecked) => {
    if (selectedIds.length > 0) {
      setConfirmDialog({
        isOpen: true,
        message: "과정을 변경하시겠습니까?\n과정을 변경하면 기존에 선택했던 과목 내역이 모두 초기화됩니다.",
        onConfirm: () => {
          setSelectedIds([]); 
          applyTrackChange(trackType, isChecked);
          setConfirmDialog({ isOpen: false, message: '', onConfirm: null, onCancel: null });
        },
        onCancel: () => {
          setConfirmDialog({ isOpen: false, message: '', onConfirm: null, onCancel: null });
        }
      });
    } else {
      applyTrackChange(trackType, isChecked);
    }
  };

  const applyTrackChange = (trackType, isChecked) => {
    if (trackType === 'general') {
      setIsGeneralTrack(isChecked);
      if (isChecked) {
        setShowGeneralPopup(true);
        setIsScienceTrack(false);
        setShowSciencePopup(false);
      } else {
        setShowGeneralPopup(false);
      }
    } else if (trackType === 'science') {
      setIsScienceTrack(isChecked);
      if (isChecked) {
        setShowSciencePopup(true);
        setIsGeneralTrack(false);
        setShowGeneralPopup(false);
      } else {
        setShowSciencePopup(false);
      }
    }
  };

  // 과목 담기 로직
  const toggleSubject = (subject) => {
    if(!isGeneralTrack&&!isScienceTrack){
      setAlertMessage("⚠️ 과정 선택 필수\n\n과목을 담기 전에 상단의 '나의 진로 및 과정 설정'에서\n[일반 과정] 또는 [과학중점 과정]을 먼저 선택해 주세요.");
      return;
    }

    if(selectedIds.includes(subject.id)){
      setSelectedIds(selectedIds.filter(id=>id!==subject.id));
      return;
    }

    const groupDef = GROUPS.find(g=>g.id===subject.group);
    if(!groupDef) return;
    const currentGroupSelections = selectedSubjects.filter(s=>s.group===subject.group);
    if(currentGroupSelections.length >= groupDef.maxPick){
      setAlertMessage(`⚠️ 수강신청 유의사항 위반\n\n[${groupDef.name}] 군에서는 최대 ${groupDef.maxPick}과목까지만 선택 가능합니다.\n다른 과목을 빼고 담아주세요.`);
      return;
    }

    // [규칙] 탭의 규칙을 하나씩 확인 (현재 과정에 해당하는 규칙만)
    const nextSelected = [...selectedSubjects, subject];
    for (const rule of preparedRules) {
      if (!ruleAppliesToTrack(rule, isScienceTrack)) continue;
      const reason = getAddViolation(rule, subject, nextSelected, { groupMap, mandatoryList });
      if (reason) {
        const ruleText = replaceGroupIds(rule.text || `${rule.scope} ${rule.type}`, GROUPS);
        setAlertMessage(`⚠️ 수강신청 유의사항 위반\n\n[${groupDef.name}] '${subject.name}'\n${reason}\n\n요건: ${ruleText}`);
        return;
      }
    }

    setSelectedIds([...selectedIds, subject.id]);
  };

  // 편제표 렌더링
  const renderTimetable = () => (
    <div className="w-full h-full flex flex-col relative px-2 lg:px-4 bg-white print:p-0 print:h-auto">
      <div className="flex flex-wrap justify-between items-center gap-3 mt-2 mb-2 bg-white/80 p-1.5 rounded-xl print:p-0 print:mb-2 print:mt-0 print:bg-white">
        <div className="flex items-center gap-1.5 lg:gap-3 flex-wrap">
          <div className="flex items-center gap-1">
            <span className="font-bold text-slate-600 text-base lg:text-lg print:text-xs">학번:</span>
            <input type="text" placeholder="학번 입력" className="w-24 lg:w-32 p-1 text-base lg:text-xl border-b-2 border-slate-400 bg-transparent text-slate-900 font-bold text-center focus:border-blue-600 outline-none print:text-xs print:w-16 print:p-0 print:border-slate-800" value={studentInfo.studentNum || ''} onChange={(e)=>setStudentInfo({...studentInfo,studentNum:e.target.value})} />
          </div>
          <div className="flex items-center gap-1 ml-2">
            <span className="font-bold text-slate-600 text-base lg:text-lg print:text-xs">성명:</span>
            <input type="text" placeholder="이름 입력" className="w-24 lg:w-32 p-1 text-base lg:text-xl border-b-2 border-slate-400 bg-transparent text-slate-900 font-bold text-center focus:border-blue-600 outline-none print:text-xs print:w-16 print:p-0 print:border-slate-800" value={studentInfo.name || ''} onChange={(e)=>setStudentInfo({...studentInfo,name:e.target.value})} />
            {isGeneralTrack&&<div className="ml-2 px-3 py-1.5 bg-gradient-to-r from-emerald-500 to-teal-500 text-white text-sm font-black rounded-lg border border-emerald-600 print:px-1.5 print:py-0.5 print:text-[8pt] print:border-slate-800 print:text-black print:bg-none">✔ 일반 과정</div>}
            {isScienceTrack&&<div className="ml-2 px-3 py-1.5 bg-gradient-to-r from-blue-500 to-indigo-600 text-white text-sm font-black rounded-lg border border-blue-600 print:px-1.5 print:py-0.5 print:text-[8pt] print:border-slate-800 print:text-black print:bg-none">✦ 과학중점 과정</div>}
          </div>
        </div>

                      {dbFields.map(f=><option key={f.id} value={f.id}>{f.name}</option>)}
                    </select>
                    <span className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none">▼</span>
                  </div>
                </div>

                    <select className="w-full appearance-none border border-slate-300 rounded-md p-2 lg:p-3 text-base lg:text-lg font-extrabold text-slate-800 focus:border-blue-500 bg-white disabled:bg-slate-100 disabled:text-slate-400" value={selectedMajor} onChange={(e)=>setSelectedMajor(e.target.value)} disabled={selectedField==='none'}>
                      {(dbMajors[selectedField]||dbMajors['none']).map(m=><option key={m.id} value={m.id}>{m.name}</option>)}

                    <span className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none">▼</span>
                  </div>
                </div>

                  <div className="flex items-center gap-2 mb-2"><span>ℹ️</span><span>하단 목록에서 추천 과목을 확인하세요!</span></div>
                  <div className="flex flex-col sm:flex-row flex-wrap gap-3 mt-1 sm:ml-6">
                    <span className="text-green-600 flex items-center gap-1.5 text-sm lg:text-base"><span className="w-3 h-3 bg-green-400 rounded-full inline-block animate-pulse"></span> 녹색: 계열 추천</span>
                    {selectedMajor!=='none'&&<><span className="text-pink-600 flex items-center gap-1.5 text-sm lg:text-base"><span className="w-3 h-3 bg-pink-400 rounded-full inline-block animate-pulse"></span> 핑크색: 학과 추천</span><span className="text-blue-600 flex items-center gap-1.5 text-sm lg:text-base"><span className="w-3 h-3 bg-blue-400 rounded-full inline-block animate-pulse"></span> 파란색: 공통 추천</span></>}

                  <button key={tab.id} onClick={()=>setActiveSemesterTab(tab.id)}

              const groupSubjects=dbSubjects.filter(s=>s.group===group.id);
              const pickedCount=selectedIds.filter(id=>groupSubjects.some(s=>s.id===id)).length;
              const isComplete=pickedCount===group.maxPick;
              if(groupSubjects.length===0) return null;

              // 이 군에만 걸린 규칙으로 화면 배치 결정 (예: 교과별 필수 택1 상자, 최대 N개 상자)
              const isGroupOnlyRule=r=>r.scopeExplicit&&r.groupIds.length===1&&r.groupIds[0]===group.id&&ruleAppliesToTrack(r,isScienceTrack);
              const perTypeRule=preparedRules.find(r=>isGroupOnlyRule(r)&&r.type==='교과별기준'&&r.minCount!=null&&r.categories.length>0);
              const capRule=!perTypeRule&&preparedRules.find(r=>isGroupOnlyRule(r)&&r.type==='교과기준'&&r.maxCount!=null&&r.categories.length>0);
              let typeBoxes=[], cappedSubjects=[], otherSubjects=[];
              if(perTypeRule){
                typeBoxes=perTypeRule.categories.map(c=>({type:c,subjects:groupSubjects.filter(s=>matchesCategory(s,c))}));
                otherSubjects=groupSubjects.filter(s=>!perTypeRule.categories.some(c=>matchesCategory(s,c)));
              } else if(capRule){
                cappedSubjects=groupSubjects.filter(s=>matchesRule(s,capRule));
                otherSubjects=groupSubjects.filter(s=>!matchesRule(s,capRule));

                const isSelected=selectedIds.includes(subject.id);
                const normSubj=normalizeForMatch(subject.name);

                const isFieldRec=Array.from(fieldRecommendedSet).some(rec=>normalizeForMatch(rec)===normSubj);
                
                const showMajorRec = isMajorRec;
                const showFieldRec = isFieldRec;
                const showBothRec = showMajorRec && showFieldRec;
                
                const isCsat=subject.csat&&subject.csat.trim()!==''&&!/x|-|해당|미출|없음|아님/i.test(subject.csat);
                const isSharedCampusCard=!!group.isSharedCampus;
                
                // 과학중점 과정: 해당 군을 콕 집은 과학중점 규칙(지정과목, 최소 이수)에 해당하는 과목에 '과중 대상' 표시
                const isScienceTrackTarget = isScienceTrack && preparedRules.some(r => r.track==='과학중점' && r.scopeExplicit && r.groupIds.includes(subject.group) && (
                  (r.type==='지정과목' && inSubjectList(subject.name, r.subjects)) ||
                  (['교과기준','교과별기준','권장'].includes(r.type) && (r.minCount!=null||r.minCredits!=null) && matchesRule(subject, r))
                ));

                const displayCardName=subject.school?`${subject.name} (${subject.school})`:subject.name;

                let borderClass='border-2 border-slate-200 hover:border-blue-400';
                let bgClass='bg-white';
                
                if(isSharedCampusCard){bgClass='bg-purple-100';borderClass='border-2 border-purple-300 hover:border-purple-500 shadow-sm';}
                else if(isCsat){bgClass='bg-yellow-50';}
                
                if(isSelected){
                  if(isSharedCampusCard){
                    borderClass='border-[3px] border-purple-600 shadow-md';
                    bgClass='bg-purple-300';
                  } else {
                    borderClass='border-[3px] border-slate-500 shadow-md';
                    bgClass='bg-slate-300';
                  }
                } else if(showBothRec) borderClass='border-[3px] border-blue-500 shadow-[0_0_12px_rgba(59,130,246,0.6)] animate-sparkle-blue';
                else if(showMajorRec) borderClass='border-2 border-pink-400 shadow-[0_0_8px_rgba(236,72,153,0.3)] animate-sparkle-pink';
                else if(showFieldRec) borderClass='border-2 border-green-400 shadow-[0_0_8px_rgba(74,222,128,0.3)] animate-sparkle-green';

                return (
                  <div key={subject.id} className={`relative p-2 lg:p-3 rounded-xl transition-all duration-300 flex flex-col group ${bgClass} ${borderClass}`}>
                    {showFieldRec&&<span className="absolute -top-3 -left-1 bg-green-500 text-white text-[0.7rem] lg:text-[0.75rem] font-bold px-2 py-1 rounded-full shadow-lg z-10">✦ 계열 추천</span>}
                    {showMajorRec&&<span className="absolute -top-3 -right-1 bg-pink-500 text-white text-[0.7rem] lg:text-[0.75rem] font-bold px-2 py-1 rounded-full shadow-lg z-10">✦ 학과 추천</span>}
                    <div className="flex flex-col items-start mb-2 mt-1">
                      {subject.type&&<span className="inline-block bg-slate-200 text-slate-700 text-[0.7rem] lg:text-[0.8rem] font-bold px-1.5 py-0.5 rounded mb-1">{subject.type}</span>}
                      <div className="flex items-center flex-wrap gap-1 justify-between w-full">
                        <h4 className="text-base lg:text-lg font-extrabold text-slate-900 leading-tight break-keep">{displayCardName}</h4>
                        <span className="text-[0.7rem] lg:text-[0.8rem] font-bold text-slate-500 bg-slate-100 px-2 py-1 rounded-md whitespace-nowrap">{subject.credits}학점</span>
                      </div>
                    </div>
                    <div className="flex flex-col gap-1 mt-auto pt-2">
                      {isScienceTrackTarget && (
                        <span className="bg-teal-600 text-white text-[0.7rem] lg:text-[0.75rem] font-black py-0.5 px-2 rounded-md text-center shadow-sm tracking-widest leading-none mb-1">과중 대상</span>
                      )}
                      <div className="flex gap-1.5 w-full">
                        <button onClick={()=>setInfoModalSubject(subject)} className="w-1/2 py-2 rounded-lg font-bold text-sm lg:text-base flex items-center justify-center gap-1 bg-slate-100 hover:bg-slate-200 text-slate-700 border border-slate-200 transition-transform active:scale-95">ℹ️ 안내</button>
                        <button onClick={()=>toggleSubject(subject)} className={`w-1/2 py-2 rounded-lg font-bold text-sm lg:text-base flex items-center justify-center gap-1 transition-transform active:scale-95 shadow-sm border ${isSelected?'bg-slate-800 text-white border-slate-900 hover:bg-slate-900':'bg-blue-600 text-white border-blue-600 hover:bg-blue-700'}`}>
                          {isSelected?'빼기':'담기'}
                        </button>
                      </div>
                    </div>
                  </div>
                );
              };

              return (
                <div key={group.id} className="bg-white p-4 md:p-5 rounded-3xl shadow-sm border-[3px] border-slate-900 mb-4 lg:mb-5 h-fit">
                  <div className="flex justify-between items-center mb-3 pb-2 border-b-2 border-slate-100">
                    <h3 className="text-xl lg:text-2xl font-extrabold text-slate-800">{group.name}</h3>

                      <div className="grid grid-cols-1 lg:grid-cols-3 gap-5">

                        </div>
                      )}
                    </div>
                  ):capRule?(
                    <div className="flex flex-col gap-6 mt-6 mb-2">
                      {cappedSubjects.length>0&&(
                        <div className="relative border-2 border-indigo-400 rounded-2xl p-4 bg-indigo-50/30 flex flex-col">

                          <div className="grid grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-3 mt-3 flex-1">{cappedSubjects.map(s=>renderSubjectCard(s))}</div>

                          <div className="grid grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-3 mt-3">{otherSubjects.map(s=>renderSubjectCard(s))}</div>
                        </div>

                    otherSubjects.length>0&&(
                      <div className="grid grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-3">{otherSubjects.map(s=>renderSubjectCard(s))}</div>

            })}

                  <span>{tab.icon}</span> <span className="whitespace-nowrap tracking-tight">{tab.label}</span>
                </button>
              );

              title={isRightPanelExpanded ? "좌우 화면 분할 복귀" : "우측 탭 화면 전체 확대"}

              <span>{isRightPanelExpanded ? '▶◀' : '◀▶'}</span> 
              <span className="whitespace-nowrap tracking-tight">{isRightPanelExpanded ? '원상복귀' : '화면확대'}</span>

          </div>

                  <h2 className="text-2xl lg:text-4xl font-black tracking-wide">나의 교육과정 편제표</h2>
                </div>
                <div className="p-2 lg:p-4 bg-white rounded-b-3xl">
                  {renderTimetable()}
                </div>
              </div>
            )}

            {activeTab==='table'&&(
              <div className="bg-white rounded-3xl shadow-xl border border-slate-200 flex flex-col p-4 lg:p-6 h-[85vh] min-h-[600px]">
                <div className="bg-blue-900 text-white p-4 lg:p-6 rounded-2xl text-center shrink-0 mb-4 lg:mb-6 shadow-md">
                  <h2 className="text-2xl lg:text-4xl font-black mb-2">📊 {dbInfo.schoolShort} 편제표</h2>
                  <p className="text-blue-200 text-sm lg:text-xl font-medium mb-4">{dbInfo.schoolName} {dbInfo.admissionYear}학년도 입학생 교육과정 편제표입니다.</p>
                  <a href="https://26pyeonjae.edgeone.app/" target="_blank" rel="noopener noreferrer" className="inline-flex items-center gap-2 bg-white text-blue-900 font-extrabold px-5 py-2.5 rounded-xl hover:bg-blue-50 transition-colors shadow-sm text-base">
                    🔗 새 창에서 크게 보기
                  </a>
                </div>
                <div className="flex-1 border-2 border-slate-200 rounded-xl bg-white relative shadow-inner overflow-hidden">
                  <iframe 
                    src="https://26pyeonjae.edgeone.app/" 
                    className="absolute inset-0 w-full h-full border-0 rounded-xl" 
                    title={`${dbInfo.schoolShort} 편제표`}
                  ></iframe>
                </div>
              </div>
            )}

            {activeTab==='major'&&(
              <div className="bg-white rounded-3xl shadow-xl border border-slate-200 flex flex-col p-4 lg:p-6">

                     <p className="text-sm lg:text-base">위의 <strong className="text-teal-700">'새 창에서 바로가기'</strong> 버튼을 이용해 주세요.</p>
                  </div>
                  <iframe src="https://isugwamok.edgeone.app/" className="absolute inset-0 w-full h-full border-0 z-10 bg-transparent rounded-xl" title="대학별 이수권장과목"></iframe>
                </div>
              </div>
            )}

          </div>
        </div>
      </main>

      {/* 과학중점 과정 팝업 */}
      {isScienceTrack&&showSciencePopup&&(
        <div className="fixed z-[1000] w-[340px] md:w-[450px] shadow-2xl rounded-2xl border-[3px] flex flex-col overflow-hidden no-print bg-yellow-50 border-yellow-500 draggable-popup" style={{left:`${sciencePopupPos.x}px`,top:`${sciencePopupPos.y}px`}}>
          <div onMouseDown={handleScienceDragStart} onTouchStart={handleScienceDragStart} className="cursor-move p-4 flex justify-between items-center select-none bg-yellow-200 text-yellow-900 border-b border-yellow-300" style={{touchAction:'none'}}>
            <div className="flex flex-col sm:flex-row sm:items-center gap-1.5 sm:gap-2 pointer-events-none">
              <span className="font-extrabold text-base">⚠️ 과학 중점 과정 요건 안내</span>
              <span className="text-[0.7rem] font-bold text-yellow-800 bg-yellow-300/60 px-2 py-0.5 rounded-md border border-yellow-400/50 w-fit">👆 팝업창 이동가능</span>
            </div>
            <button onClick={()=>setShowSciencePopup(false)} className="hover:opacity-70 p-1 bg-white/50 rounded-full text-xl self-start sm:self-auto">✕</button>
          </div>
          <div className="p-5 max-h-[350px] overflow-y-auto custom-scrollbar">
            <ul className="space-y-4">
              {evaluatedConditions.filter(c=>c.track!=='일반')
                .map((item)=>(
                <li key={item.key} className={`flex items-start gap-3 text-base font-bold p-4 rounded-xl bg-white/70 shadow-sm border ${item.status==='pass'?'border-green-300 bg-green-50/80':'border-yellow-200'}`}>
                  <span className="mt-0.5">{item.status==='pass'?'✅':'•'}</span>
                  <div className="flex-1 flex flex-col gap-1.5">
                    <div className="flex flex-wrap items-center gap-2">
                      <span className={`${item.status==='fail'?'text-red-600':item.status==='pass'?'text-slate-400 line-through decoration-2':'text-yellow-800'} break-keep leading-snug transition-all`}>{item.displayOriginal}</span>
                      {item.status==='pass' && <span className="text-[0.8rem] lg:text-sm text-green-700 bg-green-100 border border-green-300 px-2 py-1 rounded-md font-black whitespace-nowrap">완료</span>}
                    </div>
                    {item.currentStatusText&&<span className={`text-sm ${item.status==='pass'?'text-green-600':'text-red-500'}`}>{item.currentStatusText}</span>}
                  </div>
                </li>
              ))}
              {evaluatedConditions.filter(c=>c.track!=='일반').length===0&&(
                <li className="text-base text-slate-600">과학중점 과정 관련 조건이 없습니다.</li>
              )}
            </ul>
          </div>
        </div>
      )}

      {/* 일반 과정 팝업 */}
      {isGeneralTrack&&showGeneralPopup&&(
        <div className="fixed z-[1000] w-[340px] md:w-[450px] shadow-2xl rounded-2xl border-[3px] flex flex-col overflow-hidden no-print bg-orange-50 border-orange-500 draggable-popup" style={{left:`${generalPopupPos.x}px`,top:`${generalPopupPos.y}px`}}>
          <div onMouseDown={handleGeneralDragStart} onTouchStart={handleGeneralDragStart} className="cursor-move p-4 flex justify-between items-center select-none bg-orange-200 text-orange-900 border-b border-orange-300" style={{touchAction:'none'}}>
            <div className="flex flex-col sm:flex-row sm:items-center gap-1.5 sm:gap-2 pointer-events-none">
              <span className="font-extrabold text-base">📋 일반 과정 요건 안내</span>
              <span className="text-[0.7rem] font-bold text-orange-800 bg-orange-300/60 px-2 py-0.5 rounded-md border border-orange-400/50 w-fit">👆 팝업창 이동가능</span>
            </div>
            <button onClick={()=>setShowGeneralPopup(false)} className="hover:opacity-70 p-1 bg-white/50 rounded-full text-xl self-start sm:self-auto">✕</button>
          </div>
          <div className="p-5 max-h-[350px] overflow-y-auto custom-scrollbar">
            <ul className="space-y-4">
              {evaluatedConditions.filter(c=>c.track!=='과학중점')
                .map((item)=>(
                <li key={item.key} className={`flex items-start gap-3 text-base font-bold p-4 rounded-xl bg-white/70 shadow-sm border ${item.status==='pass'?'border-green-300 bg-green-50/80':'border-orange-200'}`}>
                  <span className="mt-0.5">{item.status==='pass'?'✅':'•'}</span>
                  <div className="flex-1 flex flex-col gap-1.5">
                    <div className="flex flex-wrap items-center gap-2">
                      <span className={`${item.status==='fail'?'text-red-600':item.status==='pass'?'text-slate-400 line-through decoration-2':'text-orange-800'} break-keep leading-snug transition-all`}>{item.displayOriginal}</span>
                      {item.status==='pass' && <span className="text-[0.8rem] lg:text-sm text-green-700 bg-green-100 border border-green-300 px-2 py-1 rounded-md font-black whitespace-nowrap">완료</span>}
                    </div>
                    {item.currentStatusText&&<span className={`text-sm ${item.status==='pass'?'text-green-600':'text-red-500'}`}>{item.currentStatusText}</span>}
                  </div>
                </li>
              ))}
            </ul>
          </div>
        </div>
      )}

      {/* TOP 이동 고정 버튼 (메인 화면용 - 좌/우 양쪽 배치) */}
      <button
        onClick={() => window.scrollTo({ top: 0, behavior: 'smooth' })}
        className="fixed bottom-6 right-6 z-[9999] flex items-center justify-center w-14 h-14 bg-slate-800 hover:bg-slate-900 text-white rounded-full shadow-2xl transition-transform hover:-translate-y-1 no-print border-2 border-slate-600 focus:outline-none"
        title="맨 위로 이동"
      >
        <span className="text-2xl font-black leading-none -mt-1">↑</span>
      </button>
      <button
        onClick={() => window.scrollTo({ top: 0, behavior: 'smooth' })}
        className="fixed bottom-6 left-6 z-[9999] flex items-center justify-center w-14 h-14 bg-slate-800 hover:bg-slate-900 text-white rounded-full shadow-2xl transition-transform hover:-translate-y-1 no-print border-2 border-slate-600 focus:outline-none"
        title="맨 위로 이동"
      >
        <span className="text-2xl font-black leading-none -mt-1">↑</span>
      </button>

    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
