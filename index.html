const SEMESTERS = ['1-1', '1-2', '2-1', '2-2', '3-1', '3-2'];
const semesterTabs = [
  { id: '2-1', label: '2학년 1학기' },
  { id: '2-2', label: '2학년 2학기' },
  { id: '3-1', label: '3학년 1학기' },

];

const TYPE_ORDER = ['국어', '수학', '영어', '사회 (역사/도덕 포함)', '과학', '체육', '예술', '기술·가정/정보', '제2외국어/한문', '교양', '기타'];

// ── 유틸 함수 ──
const normalizeForMatch = (str) => {
  if (!str) return '';
  let s = str.replace(/\(.*?\)/g, '').replace(/\[.*?\]/g, '').replace(/등\s*$/g, '');
  s = s.replace(/\s+/g, '')
    .replace(/Ⅰ/g,'I').replace(/Ⅱ/g,'II').replace(/Ⅲ/g,'III').replace(/Ⅳ/g,'IV')
    .replace(/[^a-zA-Z0-9가-힣+]/g,'').toUpperCase();
  return s.replace(/등$/, '');
};

const normalizeType = (typeStr, nameStr) => {
  if (typeStr && typeStr.trim() !== '') {
    const t = typeStr.replace(/\s+/g,'');
    if (t.includes('제2외국어')||t.includes('한문')||t.includes('외국어')) return '제2외국어/한문';
    if (t.includes('국어')) return '국어';
    if (t.includes('수학')) return '수학';
    if (t.includes('영어')) return '영어';
    if (t.includes('사회')) return '사회 (역사/도덕 포함)';
    if (t.includes('과학')) return '과학';
    if (t.includes('체육')) return '체육';
    if (t.includes('예술')||t.includes('음악')||t.includes('미술')) return '예술';
    if (t.includes('기술')||t.includes('가정')||t.includes('정보')) return '기술·가정/정보';
    if (t.includes('교양')) return '교양';
    return typeStr.trim();
  }
  const n = (nameStr||'').replace(/\s+/g,'');
  if (/제2외국어|일본어|중국어|한문|스페인어|프랑스어|독일어|러시아어|아랍어|베트남어/.test(n)) return '제2외국어/한문';
  if (/국어|문학|화법|독서|언어와매체/.test(n)) return '국어';
  if (/수학|대수|미적분|기하|통계/.test(n)) return '수학';
  if (/영어|영독/.test(n)) return '영어';
  if (/사회|한국사|지리|역사|정치|경제|윤리|법/.test(n)) return '사회 (역사/도덕 포함)';
  if (/체육|운동|스포츠/.test(n)) return '체육';
  if (/과학|물리|화학|생명|지구/.test(n)) return '과학';
  if (/음악|미술|예술/.test(n)) return '예술';
  if (/기술|가정|정보|인공지능|컴퓨터/.test(n)) return '기술·가정/정보';
  if (/교양|논리|교육|심리|철학|진로|환경/.test(n)) return '교양';
  return '기타';
};

const getSemesterFromText = (text) => {
  if (!text||typeof text!=='string') return null;
  const t = text.replace(/\s+/g,'');
  if(t.includes('1학년1학기')) return '1-1';
  if(t.includes('1학년2학기')) return '1-2';
  if(t.includes('2학년1학기')) return '2-1';
  if(t.includes('2학년2학기')) return '2-2';
  if(t.includes('3학년1학기')) return '3-1';
  if(t.includes('3학년2학기')) return '3-2';
  return null;
};

const getGroupFromText = (text) => {
  if (!text||typeof text!=='string') return null;
  const match = text.match(/2[A-F]|3[A-F]/);
  return match ? match[0] : null;
};

const parseCSV = (str) => {
  const arr = [];
  let quote=false, row=[], col='';
  for(let c=0;c<str.length;c++){
    let cc=str[c],nc=str[c+1];
    if(cc==='"'&&quote&&nc==='"'){col+=cc;c++;continue;}
    if(cc==='"'){quote=!quote;continue;}
    if(cc===','&&!quote){row.push(col.trim());col='';continue;}
    if(cc==='\n'&&!quote){
      if(col.endsWith('\r'))col=col.slice(0,-1);
      row.push(col.trim());arr.push(row);row=[];col='';continue;
    }
    col+=cc;
  }
  if(col.endsWith('\r'))col=col.slice(0,-1);
  row.push(col.trim());
  if(row.length>0)arr.push(row);
  return arr;
};

const isInvalidData = (val) => {
  if (!val) return true;
  const v = String(val).trim();
  return v===''||v==='-'||v.replace(/-/g,'')===''||v.toLowerCase()==='n/a'||v==='없음'||v==='.';
};

const formatReportText = (text) => {
  if (!text||String(text).trim()===''||String(text).trim()==='-') return '-';
  let str = String(text);  
  str = str.replace(/\s*(\[[^\]]+\])\s*/g, '\n$1 ');
  str = str.replace(/(^|\n)\s*-\s*/g, '$1- ');
  str = str.replace(/,\s*/g, ', ');
  str = str.replace(/\n+/g, '\n').trim();

  return str.split('\n').map((line,idx)=>{
    const t=line.trim();
    return t?<span key={idx} className="block mt-1.5 first:mt-0 break-keep">{t}</span>:null;
  });
};

        const recHasChinese = normRec.includes('중국어');

        else {

                    let isViolated = false;

                    mentionedGroups.forEach(g => {
                        const groupSubjects = selectedSubjects.filter(s => s.group === g.id);
                        const invalidCount = groupSubjects.filter(s => {
                            const sName = s.name.replace(/\s+/g, '');
                            const baseName = sName.replace(/[ⅠⅡⅢⅣ1234]/g, '');
                            const isMentioned = text.includes(sName) || text.includes(baseName) || (baseName === '물리학' && text.includes('물리')) || (baseName === '생명과학' && text.includes('생명')) || (baseName === '지구과학' && text.includes('지구'));
                            return !isMentioned;
                        }).length;

                        if (invalidCount > 0) isViolated = true;
                    });

                    if (!isViolated) {
                        status = 'pass';
                        currentStatusText = '(조건 충족)';
                    } else {
                        status = 'fail';
                        currentStatusText = `(요건 위반 - 지정되지 않은 과목 포함)`;
                    }
                }
                else {
                    status = 'pass';
                    currentStatusText = '(해당 군 선택 완료)';
                }
            }
        }
      }

      return { original: cond, displayOriginal, status, currentStatusText };
    });
  }, [dbConditions, selectedSubjects, dbMandatory]);

  // 커스텀 과정 변경 및 초기화 경고 로직
  const handleTrackChange = (trackType, isChecked) => {
    if (selectedIds.length > 0) {
      setConfirmDialog({
        isOpen: true,
        message: "과정을 변경하시겠습니까?\n과정을 변경하면 기존에 선택했던 과목 내역이 모두 초기화됩니다.",
        onConfirm: () => {
          setSelectedIds([]); 
          applyTrackChange(trackType, isChecked);
          setConfirmDialog({ isOpen: false, message: '', onConfirm: null, onCancel: null });
        },
        onCancel: () => {
          setConfirmDialog({ isOpen: false, message: '', onConfirm: null, onCancel: null });
        }
      });
    } else {
      applyTrackChange(trackType, isChecked);
    }
  };

  const applyTrackChange = (trackType, isChecked) => {
    if (trackType === 'general') {
      setIsGeneralTrack(isChecked);
      if (isChecked) {
        setShowGeneralPopup(true);
        setIsScienceTrack(false);
        setShowSciencePopup(false);
      } else {
        setShowGeneralPopup(false);
      }
    } else if (trackType === 'science') {
      setIsScienceTrack(isChecked);
      if (isChecked) {
        setShowSciencePopup(true);
        setIsGeneralTrack(false);
        setShowGeneralPopup(false);
      } else {
        setShowSciencePopup(false);
      }
    }
  };

  // 과목 담기 로직
  const toggleSubject = (subject) => {
    if(!isGeneralTrack&&!isScienceTrack){
      setAlertMessage("⚠️ 과정 선택 필수\n\n과목을 담기 전에 상단의 '나의 진로 및 과정 설정'에서\n[일반 과정] 또는 [과학중점 과정]을 먼저 선택해 주세요.");
      return;
    }

    if(selectedIds.includes(subject.id)){
      setSelectedIds(selectedIds.filter(id=>id!==subject.id));
      return;
    }

    const groupDef = GROUPS.find(g=>g.id===subject.group);
    const currentGroupSelections = selectedSubjects.filter(s=>s.group===subject.group);
    
    if(['2E','2F'].includes(subject.group)){
      if(currentGroupSelections.length >= groupDef.maxPick){
        setAlertMessage(`⚠️ 공유캠퍼스 안내\n\n[${groupDef.name}] 에서는 최대 ${groupDef.maxPick}과목까지만 선택 가능합니다.`);
        return;
      }
      setSelectedIds([...selectedIds,subject.id]); 
      return;
    }

    const subjectNormalizedType = normalizeType(subject.type, subject.name);
    
    if (subject.group === '3D') {
        if (['국어', '수학', '영어'].includes(subjectNormalizedType)) {
            const sameTypeIn3D = currentGroupSelections.filter(s => normalizeType(s.type, s.name) === subjectNormalizedType);
            if (sameTypeIn3D.length >= 1) {
                setAlertMessage(`⚠️ 수강신청 유의사항 위반\n\n[G] 군에서는 ${subjectNormalizedType} 교과군 과목을 1개만 선택해야 합니다.`);
                return;
            }
        } else {
            const otherIn3D = currentGroupSelections.filter(s => !['국어', '수학', '영어'].includes(normalizeType(s.type, s.name)));
            if (otherIn3D.length >= 4) {
                setAlertMessage(`⚠️ 수강신청 유의사항 위반\n\n[G] 군에서 국어/수학/영어 필수 선택(각 1과목)을 제외한 '그 외 과목'은 최대 4개까지만 선택 가능합니다.`);
                return;
            }
        }
        
        if (isScienceTrack && subjectNormalizedType !== '과학') {
            const has3DScienceCond = dbConditions.some(c => { const t = c.replace(/\s+/g, ''); return t.includes('과학중점') && t.includes('3D') && t.includes('과학') && t.includes('3과목'); });
            if (has3DScienceCond) {
                const currentNonScience = currentGroupSelections.filter(s => normalizeType(s.type, s.name) !== '과학').length;
                if (currentNonScience >= 4) {
                    setAlertMessage(`⚠️ 과학중점 과정 지정 과목 위반\n\n[G] 군에서는 과학 교과군 과목을 반드시 3과목 이상 포함해야 합니다.\n(현재 과학 이외의 과목을 최대 허용치인 4개까지 선택했습니다.)`);
                    return;
                }
            }
        }
    }

    const hasGroupKmeCond = dbConditions.some(c => { 
      const t = c.replace(/\s+/g, ''); 
      return t.includes(subject.group) && t.includes('국어') && t.includes('수학') && t.includes('영어') && (t.includes('최대1과목') || t.includes('1과목선택가능') || t.includes('1과목만')); 
    });
    if(hasGroupKmeCond && ['국어','수학','영어'].includes(subjectNormalizedType)){
      const kmeInSameGroup = currentGroupSelections.filter(s=>['국어','수학','영어'].includes(normalizeType(s.type,s.name)));
      if(kmeInSameGroup.length >= 1){
        setAlertMessage(`⚠️ 수강신청 유의사항 위반\n\n[${groupDef.name}] 군에서 국어/수학/영어 교과군 과목은 최대 1개까지만 선택 가능합니다.`);
        return;
      }
    }
    
    if(currentGroupSelections.length >= groupDef.maxPick){
      setAlertMessage(`⚠️ 수강신청 유의사항 위반\n\n[${groupDef.name}] 군에서는 최대 ${groupDef.maxPick}과목까지만 선택 가능합니다.\n다른 과목을 빼고 담아주세요.`);
      return;
    }

    const newSelectedSubjects = [...selectedSubjects, subject];

    const hasKme21Cond = dbConditions.some(c => { const t = c.replace(/\s+/g, ''); return t.includes('국어/수학/영어') && t.includes('21학점'); });
    if(hasKme21Cond && ['국어','수학','영어'].includes(subjectNormalizedType)){
      const currentKmeCredits = newSelectedSubjects
        .filter(s => !['2E','2F'].includes(s.group))
        .filter(s => ['국어','수학','영어'].includes(normalizeType(s.type,s.name)))
        .reduce((sum, s) => sum + s.credits, 0);
      if(currentKmeCredits > 21){
        setAlertMessage(`⚠️ 요건 위반\n\n국어/수학/영어 교과군 선택 과목은 2~3학년 총합 21학점을 초과할 수 없습니다.\n\n(해당 과목 추가 시 ${currentKmeCredits}학점이 되어 21학점을 초과합니다.)`);
        return;
      }
    }

    const has2ndGradeOverlapCond = dbConditions.some(c => { const t = c.replace(/\s+/g, ''); return t.includes('2학년') && (t.includes('동일하게') || t.includes('동일과목')) && (t.includes('기술') || t.includes('제2외국어')); });
    const typesToCheck = ['기술·가정/정보', '제2외국어/한문'];
    if (has2ndGradeOverlapCond && typesToCheck.includes(subjectNormalizedType) && ['2C','2D'].includes(subject.group)) { 
        const sem1Names = newSelectedSubjects.filter(s => ['2C'].includes(s.group)).map(s => s.name);
        const sem2Names = newSelectedSubjects.filter(s => ['2D'].includes(s.group)).map(s => s.name);
        
        const isSem1 = ['2C'].includes(subject.group);
        if (isSem1 && sem2Names.includes(subject.name)) {
            setAlertMessage(`⚠️ 요건 위반\n\n2학년 기술⸱가정/정보/제2외국어/한문 교과군의 '${subject.name}' 과목을 C군(1, 2학기)에서 동일하게 선택할 수 없습니다.`);
            return;
        }
        if (!isSem1 && sem1Names.includes(subject.name)) {
            setAlertMessage(`⚠️ 요건 위반\n\n2학년 기술⸱가정/정보/제2외국어/한문 교과군의 '${subject.name}' 과목을 C군(1, 2학기)에서 동일하게 선택할 수 없습니다.`);
            return;
        }
    }

    const has3rdGradePEOverlapCond = dbConditions.some(c => { const t = c.replace(/\s+/g, ''); return t.includes('3학년') && t.includes('운동과건강') && (t.includes('동일하게') || t.includes('동일과목')); });
    if (has3rdGradePEOverlapCond && subject.name.includes('운동과 건강') && ['3A','3B','3C','3D','3E','3F'].includes(subject.group)) { 
        const s1 = newSelectedSubjects.filter(s => ['3A','3B','3C'].includes(s.group)).map(s => s.name);
        const s2 = newSelectedSubjects.filter(s => ['3D','3E','3F'].includes(s.group)).map(s => s.name);
        const isSem1 = ['3A','3B','3C'].includes(subject.group);
        if ((isSem1 && s2.includes(subject.name)) || (!isSem1 && s1.includes(subject.name))) {
            setAlertMessage(`⚠️ 요건 위반\n\n3학년 체육 교과군의 '${subject.name}' 과목을 1, 2학기 동일하게 선택할 수 없습니다.`);
            return;
        }
    }

    const has79CreditsCond = dbConditions.some(c => { const t = c.replace(/\s+/g, ''); return t.includes('과학중점') && t.includes('79학점'); });
    if (has79CreditsCond && isScienceTrack) {
        let mandCredits = 0;
        Object.values(dbMandatory).flat().forEach(m => {
            const t = normalizeType(m.type, m.name);
            if (t === '수학' || t === '과학' || (t === '기술·가정/정보' && /정보|인공지능|소프트웨어|프로그래밍|컴퓨터/.test(m.name))) {
                mandCredits += m.credits;
            }
        });

        let totalPossibleElectiveCredits = 0;
        GROUPS.filter(g => !g.isOptional).forEach(g => {
            totalPossibleElectiveCredits += g.totalCredits;
        });

        let currentSelNonMSICredits = 0;
        newSelectedSubjects.forEach(s => {
            const t = normalizeType(s.type, s.name);
            const isMSI = t === '수학' || t === '과학' || (t === '기술·가정/정보' && /정보|인공지능|소프트웨어|프로그래밍|컴퓨터/.test(s.name));
            if (!isMSI && !['2E', '2F'].includes(s.group)) {
                currentSelNonMSICredits += s.credits;
            }
        });

        const maxAllowedNonMSI = totalPossibleElectiveCredits - (79 - mandCredits); 
        if (currentSelNonMSICredits > maxAllowedNonMSI) {
            setAlertMessage(`⚠️ 과학중점 과정 요건 위반\n\n해당 과목을 담을 경우, 수학/과학/정보 교과군 79학점 이상 이수 조건을 달성할 수 없게 됩니다.\n(현재 수학/과학/정보 이외의 과목이 최대 허용치인 ${maxAllowedNonMSI}학점을 초과합니다.)`);
            return;
        }
    }

    if (isScienceTrack) {
        const groupCond = dbConditions.find(cond => {
            const c = cond.replace(/\s+/g, '');
            if (c.includes('일반과정') || c.includes('권장') || c.includes('중복') || c.includes('동일') || c.includes('필수포함') || (c.includes('국어') && c.includes('수학') && c.includes('영어'))) return false;
            
            const cCleaned = c.replace(/과학중점/g, '');
            return cCleaned.includes(subject.group) && (cCleaned.includes('중') || cCleaned.includes('만선택') || cCleaned.includes('필수'));
        });

        if (groupCond) {
            const sName = subject.name.replace(/\s+/g, '');
            const baseName = sName.replace(/[ⅠⅡⅢⅣ1234]/g, '');
            const c = groupCond.replace(/\s+/g, '');
            
            const isMentioned = c.includes(sName) || c.includes(baseName) || 
                                 (baseName === '물리학' && c.includes('물리')) || 
                                 (baseName === '생명과학' && c.includes('생명')) || 
                                 (baseName === '지구과학' && c.includes('지구'));
                                 
            if (!isMentioned) {
                setAlertMessage(`⚠️ 요건 위반\n\n과학중점 과정은 [${groupDef.name}] 군에서 지정된 과목 내에서만 선택해야 합니다.\n\n요건: ${groupCond.replace(/(일반\s*과정|과학중점\s*과정)\s*[:：\-]\s*/g, '').trim()}`);
                return;
            }
        }
    }

    setSelectedIds([...selectedIds, subject.id]);
  };

  // 편제표 렌더링
  const renderTimetable = () => (
    <div className="w-full h-full flex flex-col relative px-2 lg:px-4 bg-white print:p-0 print:h-auto">
      <div className="flex flex-wrap justify-between items-center gap-3 mt-2 mb-2 bg-white/80 p-1.5 rounded-xl print:p-0 print:mb-2 print:mt-0 print:bg-white">
        <div className="flex items-center gap-1.5 lg:gap-3 flex-wrap">
          <div className="flex items-center gap-1">
            <span className="font-bold text-slate-600 text-base lg:text-lg print:text-xs">학번:</span>
            <input type="text" placeholder="학번 입력" className="w-24 lg:w-32 p-1 text-base lg:text-xl border-b-2 border-slate-400 bg-transparent text-slate-900 font-bold text-center focus:border-blue-600 outline-none print:text-xs print:w-16 print:p-0 print:border-slate-800" value={studentInfo.studentNum || ''} onChange={(e)=>setStudentInfo({...studentInfo,studentNum:e.target.value})} />
          </div>
          <div className="flex items-center gap-1 ml-2">
            <span className="font-bold text-slate-600 text-base lg:text-lg print:text-xs">성명:</span>
            <input type="text" placeholder="이름 입력" className="w-24 lg:w-32 p-1 text-base lg:text-xl border-b-2 border-slate-400 bg-transparent text-slate-900 font-bold text-center focus:border-blue-600 outline-none print:text-xs print:w-16 print:p-0 print:border-slate-800" value={studentInfo.name || ''} onChange={(e)=>setStudentInfo({...studentInfo,name:e.target.value})} />
            {isGeneralTrack&&<div className="ml-2 px-3 py-1.5 bg-gradient-to-r from-emerald-500 to-teal-500 text-white text-sm font-black rounded-lg border border-emerald-600 print:px-1.5 print:py-0.5 print:text-[8pt] print:border-slate-800 print:text-black print:bg-none">✔ 일반 과정</div>}
            {isScienceTrack&&<div className="ml-2 px-3 py-1.5 bg-gradient-to-r from-blue-500 to-indigo-600 text-white text-sm font-black rounded-lg border border-blue-600 print:px-1.5 print:py-0.5 print:text-[8pt] print:border-slate-800 print:text-black print:bg-none">✦ 과학중점 과정</div>}
          </div>
        </div>
        <div className="hidden xl:flex items-center gap-2 text-xs lg:text-sm font-bold bg-white border border-slate-300 px-3 py-1.5 rounded-lg shadow-sm flex-wrap print:flex print:w-full print:border-none print:shadow-none print:p-0 print:gap-1.5 print:mt-1 print:justify-start">
          <span className="flex items-center gap-1 text-yellow-700 print:text-[7pt]"><span className="w-3 h-3 bg-yellow-100 border-[3px] border-yellow-400 rounded-sm print:w-2 print:h-2 print:border-[1.5px]"></span>29수능 출제</span>
          <span className="flex items-center gap-1 text-green-700 print:text-[7pt] ml-1 print:ml-0"><span className="w-3 h-3 bg-white border-[3px] border-green-500 rounded-sm print:w-2 print:h-2 print:border-[1.5px]"></span>계열 추천</span>
          <span className="flex items-center gap-1 text-pink-700 print:text-[7pt]"><span className="w-3 h-3 bg-white border-[3px] border-pink-400 rounded-sm print:w-2 print:h-2 print:border-[1.5px]"></span>학과 추천</span>
          <span className="flex items-center gap-1 text-blue-700 print:text-[7pt]"><span className="w-3 h-3 bg-white border-[3px] border-blue-500 rounded-sm print:w-2 print:h-2 print:border-[1.5px]"></span>공통 추천</span>
          <span className="flex items-center gap-1 text-purple-700 print:text-[7pt] ml-1 print:ml-0"><span className="w-3 h-3 bg-purple-100 border-[3px] border-purple-400 rounded-sm print:w-2 print:h-2 print:border-[1.5px]"></span>공유캠퍼스</span>
          {isScienceTrack && (
            <span className="flex items-center gap-1 text-teal-700 print:text-[7pt] ml-1 print:ml-0"><span className="w-3 h-3 bg-teal-600 rounded-sm shadow-sm print:w-2 print:h-2"></span>과중 대상</span>
          )}
        </div>
      </div>
      <table className="w-full text-center border-collapse border-2 border-slate-300 shadow-sm table-fixed text-sm lg:text-base break-keep h-full print:h-auto print:text-[7.5pt]">
        <thead>
          <tr className="bg-slate-100 text-slate-800 font-extrabold">
            <th className="border-2 border-slate-300 p-2 w-[16%] text-sm md:text-base xl:text-lg print:p-0.5 print:text-[8pt]">교과군</th>
            {SEMESTERS.map(sem=>(
              <th key={sem} className="border-2 border-slate-300 p-2 w-[14%] text-[0.8rem] md:text-sm xl:text-base whitespace-nowrap print:p-0.5 print:text-[8pt]">{sem.replace('-','학년\n')}학기</th>
            ))}
          </tr>
        </thead>
        <tbody>
          {tableDataMatrix.rowTypes.map(rowType=>(
            <tr key={rowType} className="hover:bg-slate-50 h-[1px] print:h-auto">
              <td className="border-2 border-slate-300 p-2 font-extrabold text-sm md:text-base text-slate-700 bg-slate-50 print:p-0.5 print:text-[7.5pt]">{rowType}</td>
              {SEMESTERS.map(sem=>{
                const items=tableDataMatrix.allPlan.filter(i=>i.semester===sem&&i.type===rowType);
                return (
                  <td key={sem} className="border-2 border-slate-300 p-1 lg:p-1.5 align-top h-[1px] print:h-auto print:p-[2px]">
                    <div className="flex flex-col gap-1.5 h-full print:gap-[2px]">
                      {items.map((item,idx)=>{
                        const normSubj=normalizeForMatch(item.name);
                        const isMajorRec=Array.from(majorRecommendedSet).some(rec=>normalizeForMatch(rec)===normSubj);
                        const isFieldRec=Array.from(fieldRecommendedSet).some(rec=>normalizeForMatch(rec)===normSubj);
                        const showBothRec=isMajorRec&&isFieldRec;
                        const isCsat=item.csat&&item.csat.trim()!==''&&!/x|-|해당|미출|없음|아님/i.test(item.csat);
                        const isSharedCampus=item.groupId==='2E'||item.groupId==='2F';
                        
                        let displaySubjName=item.name;
                        if(isSharedCampus){
                          if(item.name.includes('동대부고'))displaySubjName=item.name.replace(/\(동대부고\)/g,'').trim()+' (동국)';
                          else if(item.name.includes('해성여고'))displaySubjName=item.name.replace(/\(해성여고\)/g,'').trim()+' (해성)';
                          else if(item.name.includes('휘경여고'))displaySubjName=item.name.replace(/\(휘경여고\)/g,'').trim()+' (휘경)';
                        }

                        let bgClass=item.isMandatory?'bg-slate-50 text-slate-700':'bg-blue-50 text-blue-900';
                        let borderClass=item.isMandatory?'border-slate-300 border-[1px]':'border-blue-300 border-[1px]';

                        if(isSharedCampus){bgClass='bg-purple-200 text-purple-900';borderClass='border-purple-400 border-[3px] shadow-sm';}
                        else if(isCsat){bgClass='bg-yellow-100 text-yellow-900';borderClass='border-yellow-400 border-[3px] shadow-sm';}

                        if(selectedField!=='none'){
                          if(showBothRec)borderClass='border-[3px] border-blue-500 shadow-sm';
                          else if(isMajorRec)borderClass='border-[3px] border-pink-400 shadow-sm';
                          else if(isFieldRec)borderClass='border-[3px] border-green-500 shadow-sm';
                        }

                        return (
                          <div key={idx} className={`text-[0.75rem] sm:text-sm xl:text-base px-1.5 py-1.5 rounded-md border text-left flex justify-between items-center shadow-sm ${bgClass} ${borderClass} transition-all overflow-hidden print:p-[3px] print:flex-col print:items-start`}>
                            <span className="font-bold truncate print:whitespace-normal print:overflow-visible print:break-keep print:leading-tight flex-1 mr-1 print:mr-0 print:w-full print:text-[6.5pt]" title={displaySubjName}>{displaySubjName}</span>
                            <span className="font-bold shrink-0 print:text-[6pt] print:self-end print:mt-0.5">{item.credits}</span>
                          </div>
                        );
                      })}
                    </div>
                  </td>
                );
              })}
            </tr>
          ))}
          <tr className="bg-slate-50">
            <td className="border-2 border-slate-300 p-2 font-extrabold text-sm lg:text-base text-slate-700 bg-slate-100 print:p-0.5 print:text-[7.5pt]">선택 현황</td>
            {SEMESTERS.map(semester=>{
              const standardGroups=GROUPS.filter(g=>g.semester===semester&&!g.isOptional);
              const requiredSemPicks=standardGroups.reduce((sum,g)=>sum+g.maxPick,0);
              const requiredPickedCount=selectedSubjects.filter(s=>{const g=GROUPS.find(gr=>gr.id===s.group);return g&&g.semester===semester&&!g.isOptional;}).length;
              const remainingRequired=requiredSemPicks-requiredPickedCount;
              return (
                <td key={`status-${semester}`} className="border-2 border-slate-300 p-2 text-sm lg:text-base font-bold print:p-0.5 print:text-[7pt]">
                  {standardGroups.length>0?(remainingRequired>0?<span className="text-blue-600">필수 {remainingRequired}과목 남음</span>:<span className="text-green-600">✔ 완료</span>):<span className="text-slate-400">-</span>}
                </td>
              );
            })}
          </tr>
          <tr className="bg-slate-200 font-black text-sm lg:text-base">
            <td className="border-2 border-slate-300 p-2 text-slate-800 print:p-0.5 print:text-[8pt]">총 학점</td>
            {SEMESTERS.map(semester=>{
              const mandatories=dbMandatory[semester]||[];
              const standardElectives=selectedSubjects.filter(s=>{const g=GROUPS.find(gr=>gr.id===s.group);return g&&g.semester===semester&&!g.isOptional;});
              const totalSemCredits=mandatories.reduce((sum,s)=>sum+s.credits,0)+standardElectives.reduce((sum,s)=>sum+s.credits,0);
              return <td key={`total-${semester}`} className={`border-2 border-slate-300 p-2 text-base lg:text-lg print:p-0.5 print:text-[8pt] ${totalSemCredits>=29?'text-blue-800':'text-slate-600'}`}>{totalSemCredits}</td>;
            })}
          </tr>
        </tbody>
      </table>
    </div>
  );

  // 로딩 화면
  if(isLoading){
    return (
      <div className="min-h-screen bg-slate-50 flex flex-col items-center justify-center font-sans">
        <div className="w-16 h-16 border-4 border-blue-600 border-t-transparent rounded-full animate-spin mb-6"></div>
        <h2 className="text-3xl font-bold text-slate-800 mb-2">데이터 불러오는 중...</h2>
        <p className="text-xl text-slate-500">구글 웹앱 서버에서 최신 데이터를 연동하고 있습니다.</p>
      </div>
    );
  }

  // 에러 화면
  if(fetchError){
    return (
      <div className="min-h-screen bg-slate-50 flex flex-col items-center justify-center font-sans p-8">
        <div className="text-red-500 text-8xl mb-6">⚠️</div>
        <h2 className="text-4xl font-bold text-slate-800 mb-4">데이터 연동 실패</h2>
        <div className="bg-red-50 p-8 rounded-xl border border-red-300 max-w-4xl w-full text-left overflow-auto shadow-md">
          <p className="text-xl text-red-700 font-bold mb-4 whitespace-pre-wrap">{fetchError}</p>
          <button onClick={()=>fetchGoogleSheetData(true)} className="px-6 py-3 bg-blue-600 text-white font-bold rounded-lg hover:bg-blue-700">다시 시도</button>
        </div>
      </div>
    );
  }

  const validLearn=infoModalSubject?.popupData?.learn?.filter(l=>!isInvalidData(l.area)||!isInvalidData(l.concept)||!isInvalidData(l.act))||[];
  const validAdvanced=infoModalSubject?.popupData?.advanced?.filter(a=>!isInvalidData(a.int)||!isInvalidData(a.topic)||!isInvalidData(a.case))||[];
  const validRecommend=infoModalSubject?.popupData?.recommend?.filter(r=>!isInvalidData(r))||[];

  // 보고서 탭 컴포넌트
  if(activeTab==='career'){
    const RS = {
      page:       { fontFamily:'sans-serif', background:'#f3f4f6', minHeight:'100vh', display:'flex', flexDirection:'column', alignItems:'center' },
      wrapper:    { width:'100%', maxWidth:'210mm', background:'white', padding:'32px', margin:'32px auto', boxShadow:'0 10px 40px rgba(0,0,0,0.15)' },
      toolbar:    { display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:'24px', paddingBottom:'16px', borderBottom:'2px solid #e5e7eb' },
      title:      { textAlign:'center', marginBottom:'24px' },
      h1:         { fontSize:'1.75rem', fontWeight:900, borderBottom:'4px double #9ca3af', display:'inline-block', paddingBottom:'8px', paddingLeft:'32px', paddingRight:'32px', marginBottom:'16px' },
      secTitle:   { fontSize:'1.05rem', fontWeight:900, marginBottom:'12px', paddingLeft:'12px', borderLeft:'4px solid', display:'flex', alignItems:'center', gap:'8px' },
      card:       { border:'2px solid #d1d5db', borderRadius:'12px', padding:'20px', background:'#f9fafb', marginBottom:'24px', pageBreakInside:'avoid', breakInside:'avoid' },
      cardTitle:  { display:'flex', justifyContent:'space-between', alignItems:'center', borderBottom:'2px solid #d1d5db', paddingBottom:'12px', marginBottom:'16px' },
      tblWrap:    { overflowX:'auto', marginBottom:'12px' },
      tbl:        { width:'100%', borderCollapse:'collapse', fontSize:'0.75rem' },
      thBlue:     { padding:'8px', border:'1px solid #d1d5db', fontWeight:700, background:'#dbeafe', color:'#1e3a8a', textAlign:'center' },
      thIndigo:   { padding:'8px', border:'1px solid #d1d5db', fontWeight:700, background:'#e0e7ff', color:'#312e81', textAlign:'center' },
      td:         { padding:'8px', border:'1px solid #d1d5db', whiteSpace:'pre-wrap', textAlign:'left', verticalAlign:'top' },
      tdCenter:   { padding:'8px', border:'1px solid #d1d5db', textAlign:'center', verticalAlign:'middle' },
      desc:       { fontSize:'0.75rem', color:'#374151', background:'white', padding:'12px', borderRadius:'8px', border:'1px solid #e5e7eb', marginTop:'8px', textAlign:'left' },
      badge:      { fontSize:'0.7rem', fontWeight:700, color:'#4b5563', background:'#e5e7eb', padding:'2px 8px', borderRadius:'6px' },
      badgeBlue:  { fontSize:'0.7rem', fontWeight:700, color:'#1d4ed8', background:'#dbeafe', padding:'2px 8px', borderRadius:'6px' },
      ulBox:      { background:'white', padding:'12px', borderRadius:'8px', border:'1px solid #e5e7eb', listStyle:'none', margin:0 },
      guideBox:   { border:'1px solid #d1d5db', borderRadius:'12px', padding:'16px', background:'#f9fafb', display:'flex', flexDirection:'column', gap:'16px', pageBreakInside:'avoid', breakInside:'avoid' },
    };

    return (
      <div style={RS.page}>
        <div id="report-wrapper" style={RS.wrapper}>
          <div className="no-print" style={RS.toolbar}>
            <h2 style={{fontSize:'1.25rem',fontWeight:900,color:'#1f2937'}}>나만의 선택과목 보고서 (인쇄 미리보기)</h2>
            <div style={{display:'flex',gap:'8px'}}>
              <button id="back-btn" onClick={()=>setActiveTab('planner')} style={{padding:'8px 16px',background:'#e5e7eb',color:'#374151',fontWeight:700,borderRadius:'8px',border:'none',cursor:'pointer'}}>← 돌아가기</button>
              <button id="print-btn" onClick={()=>window.print()} style={{padding:'8px 24px',background:'#4f46e5',color:'white',fontWeight:700,borderRadius:'8px',border:'none',cursor:'pointer',display:'flex',alignItems:'center',gap:'6px'}}>🖨️ 출력 / PDF 저장</button>
            </div>
          </div>

          <div className="print-first-page-wrap w-full">
            <div style={RS.title} className="print-tight-title">
              <h1 style={RS.h1}>휘경여자고등학교 선택과목 보고서</h1>
            </div>

            <div className="report-section" style={{marginBottom:'0'}}>
              <h3 style={{...RS.secTitle, borderLeftColor:'#2563eb', color:'#1e3a8a'}}>📋 1. 나의 교육과정 편제표</h3>
              <div style={{border:'2px solid #d1d5db',borderRadius:'12px',overflow:'hidden',background:'white',padding:'8px'}} className="print:p-1 print:border-slate-800">
                {renderTimetable()}
              </div>
            </div>
          </div>

          <div className="report-section print-tight-section" style={{marginBottom:'32px'}}>
            <h3 style={{...RS.secTitle, borderLeftColor:'#7c3aed', color:'#3730a3'}}>🗺️ 2. 맞춤형 진로 가이드</h3>
            <div style={RS.guideBox} className="print-tight-guide">
              <div style={{display:'flex',alignItems:'center',gap:'8px'}}>
                <span style={{fontWeight:700,color:'#374151',minWidth:'72px'}}>희망 계열:</span>
                <span style={{fontWeight:900,color:'#4338ca',fontSize:'1.1rem'}}>{selectedField!=='none'?selectedField:'선택 안 함'}</span>
              </div>
              {selectedField!=='none'&&dbFieldDetails[selectedField]&&(
                <div style={RS.tblWrap}>
                  <table style={RS.tbl} className="print-tight-table">
                    <tbody>
                      <tr><th style={{...RS.thIndigo,width:'25%'}}>권장 선택과목(일반)</th><td style={RS.td}>{formatReportText(dbFieldDetails[selectedField].recGen)}</td></tr>
                      <tr><th style={RS.thIndigo}>권장 선택과목(진로)</th><td style={RS.td}>{formatReportText(dbFieldDetails[selectedField].recCar)}</td></tr>
                      <tr><th style={RS.thIndigo}>권장 선택과목(융합)</th><td style={RS.td}>{formatReportText(dbFieldDetails[selectedField].recConv)}</td></tr>
                      {dbFieldDetails[selectedField].tip && (
                        <tr><th style={{...RS.thIndigo, background:'#fef3c7', color:'#92400e'}}>💡 진로 팁</th><td style={RS.td}>{formatReportText(dbFieldDetails[selectedField].tip)}</td></tr>
                      )}
                    </tbody>
                  </table>
                </div>
              )}

              <div style={{display:'flex',alignItems:'center',gap:'8px',marginTop:'8px'}}>
                <span style={{fontWeight:700,color:'#374151',minWidth:'72px'}}>희망 학과:</span>
                <span style={{fontWeight:900,color:'#4338ca',fontSize:'1.1rem'}}>{selectedMajor!=='none'?selectedMajor:'선택 안 함'}</span>
              </div>
              {selectedMajor!=='none'&&dbDepartmentDetails[selectedMajor]&&(
                <div style={RS.tblWrap}>
                  <table style={RS.tbl} className="print-tight-table">
                    <tbody>
                      <tr><th style={{...RS.thBlue,width:'25%'}}>학과 설명</th><td style={RS.td}>{formatReportText(dbDepartmentDetails[selectedMajor].desc)}</td></tr>
                      <tr><th style={RS.thBlue}>이런 학생에게 권한다</th><td style={RS.td}>{formatReportText(dbDepartmentDetails[selectedMajor].recommendStudent)}</td></tr>
                      <tr><th style={RS.thBlue}>권장 선택과목(일반)</th><td style={RS.td}>{formatReportText(dbDepartmentDetails[selectedMajor].recGen)}</td></tr>
                      <tr><th style={RS.thBlue}>권장 선택과목(진로)</th><td style={RS.td}>{formatReportText(dbDepartmentDetails[selectedMajor].recCar)}</td></tr>
                      <tr><th style={RS.thBlue}>권장 선택과목(융합)</th><td style={RS.td}>{formatReportText(dbDepartmentDetails[selectedMajor].recConv)}</td></tr>
                      <tr><th style={{...RS.thBlue,background:'#fde68a',color:'#78350f'}}>개설대학(서울)</th><td style={RS.td}>{formatReportText(dbDepartmentDetails[selectedMajor].univSeoul)}</td></tr>
                      <tr><th style={{...RS.thBlue,background:'#fde68a',color:'#78350f'}}>개설대학(수도권)</th><td style={RS.td}>{formatReportText(dbDepartmentDetails[selectedMajor].univCap)}</td></tr>
                      <tr><th style={{...RS.thBlue,background:'#fde68a',color:'#78350f'}}>개설대학(비수도권)</th><td style={RS.td}>{formatReportText(dbDepartmentDetails[selectedMajor].univLoc)}</td></tr>
                      <tr><th style={{...RS.thBlue,background:'#d1fae5',color:'#065f46'}}>주요 전공 교과목</th><td style={RS.td}>{formatReportText(dbDepartmentDetails[selectedMajor].majorSubjects)}</td></tr>
                      <tr><th style={{...RS.thBlue,background:'#d1fae5',color:'#065f46'}}>유사학과</th><td style={RS.td}>{formatReportText(dbDepartmentDetails[selectedMajor].similarDepts)}</td></tr>
                      <tr><th style={{...RS.thBlue,background:'#d1fae5',color:'#065f46'}}>졸업 후 진로</th><td style={RS.td}>{formatReportText(dbDepartmentDetails[selectedMajor].careerPaths)}</td></tr>
                    </tbody>
                  </table>
                </div>
              )}
              {selectedField==='none'&&selectedMajor==='none'&&(
                <p style={{fontSize:'0.875rem',color:'#6b7280',fontStyle:'italic',textAlign:'center',marginTop:'8px'}}>선택된 진로 정보가 없습니다. 나의 편제표 탭에서 진로를 설정해 보세요.</p>
              )}
            </div>
          </div>

          <div className="report-section">
            <h3 style={{...RS.secTitle, borderLeftColor:'#059669', color:'#064e3b'}}>📚 3. 선택 과목 상세 정보</h3>
            {selectedSubjects.length===0&&(
              <p style={{fontSize:'0.875rem',color:'#6b7280',fontStyle:'italic',padding:'16px',background:'#f9fafb',border:'1px solid #e5e7eb',borderRadius:'8px',textAlign:'center'}}>선택된 과목이 없습니다.</p>
            )}
            {selectedSubjects.map(subj=>{
              const lvLearn=subj.popupData?.learn?.filter(l=>!isInvalidData(l.area)||!isInvalidData(l.concept)||!isInvalidData(l.act))||[];
              const lvAdv=subj.popupData?.advanced?.filter(a=>!isInvalidData(a.int)||!isInvalidData(a.topic)||!isInvalidData(a.case))||[];
              const lvRec=subj.popupData?.recommend?.filter(r=>!isInvalidData(r))||[];
              const validYtUrl = getValidYouTubeUrl(subj.popupData?.youtube);

              return (
                <div key={subj.id} style={RS.card} className="print-tight-card">
                  <div style={RS.cardTitle}>
                    <div style={{display:'flex', alignItems:'center', gap:'10px',flexWrap:'wrap'}}>
                      <h4 style={{fontSize:'1.15rem',fontWeight:900,color:'#111827',margin:0}}>{subj.name}</h4>
                      <span style={RS.badge}>{GROUP_DISPLAY_NAMES[subj.group] || subj.group}</span>
                      {subj.popupData?.selType&&<span style={RS.badgeBlue}>{subj.popupData.selType}</span>}
                    </div>
                    
                    <div style={{display:'flex', alignItems:'center', gap:'12px'}}>
                      {validYtUrl && (
                        <a
                          href={validYtUrl}
                          target="_blank"
                          rel="noopener noreferrer"
                          className="no-print bg-red-600 hover:bg-red-700 text-white font-extrabold px-3 py-1.5 rounded-lg shadow-md transition-colors text-sm flex items-center gap-1 cursor-pointer"
                          title="유튜브에서 과목 안내 영상 보기 (새 창)"
                        >
                          ▶ 유튜브에서 과목 안내 영상 보기 (새 창)
                        </a>
                      )}
                      {validYtUrl && (
                        <div style={{display:'flex', flexDirection:'column', alignItems:'center'}}>
                          <img 
                            src={`https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(validYtUrl)}`} 
                            alt={`${subj.name} 안내영상 QR`} 
                            style={{width:'60px', height:'60px', border:'1px solid #d1d5db', borderRadius:'4px'}} 
                          />
                          <span style={{fontSize:'0.65rem', fontWeight:'bold', color:'#4b5563', marginTop:'4px'}}>안내 영상</span>
                        </div>
                      )}
                      <span style={{fontWeight:800,color:'#374151'}}>{subj.credits}학점</span>
                    </div>
                  </div>
                  
                  <div style={{marginBottom:'12px'}}>
                    <h5 style={{fontSize:'0.95rem',fontWeight:800,color:'#1d4ed8',marginBottom:'8px'}}>ℹ️ 과목 프로필</h5>
                    <div style={RS.tblWrap}>
                      <table style={RS.tbl} className="print-tight-table">
                        <thead>
                          <tr>
                            <th style={{...RS.thBlue,width:'33%'}}>절대 평가(성취도)</th>
                            <th style={{...RS.thBlue,width:'33%'}}>상대 평가</th>
                            <th style={{...RS.thBlue,width:'33%'}}>2029 수능 출제 과목</th>
                          </tr>
                        </thead>
                        <tbody style={{background:'white'}}>
                          <tr>
                            <td style={RS.tdCenter}>{subj.popupData?.evalAbs||'-'}</td>
                            <td style={RS.tdCenter}>{subj.popupData?.evalRel||'-'}</td>
                            <td style={RS.tdCenter}>{subj.csat||'-'}</td>
                          </tr>
                        </tbody>
                      </table>
                    </div>
                    <div style={RS.desc}>
                      <p style={{margin:0}}>• {subj.popupData?.desc||subj.desc||'-'}</p>
                      {subj.popupData?.keywords&&!isInvalidData(subj.popupData.keywords)&&(
                        <p style={{margin:'4px 0 0'}}>• <strong>주요 키워드:</strong> {subj.popupData.keywords}</p>
                      )}
                    </div>
                  </div>

                  {lvLearn.length>0&&(
                    <div style={{marginBottom:'12px'}}>
                      <h5 style={{fontSize:'0.95rem',fontWeight:800,color:'#1d4ed8',marginBottom:'8px'}}>💡 무엇을 배울 수 있나요?</h5>
                      <div style={RS.tblWrap}>
                        <table style={RS.tbl} className="print-tight-table">
                          <thead>
                            <tr>
                              <th style={{...RS.thBlue,width:'20%'}}>대영역</th>
                              <th style={{...RS.thBlue,width:'35%'}}>생각 열기 및 핵심 개념</th>
                              <th style={{...RS.thBlue,width:'45%'}}>주요 학습 활동(예시)</th>
                            </tr>
                          </thead>
                          <tbody style={{background:'white'}}>
                            {lvLearn.map((l,i)=>(
                              <tr key={i} style={{borderBottom:'1px solid #dbeafe'}}>
                                <td style={{...RS.tdCenter,fontWeight:800,background:'#eff6ff'}}>{l.area}</td>
                                <td style={RS.td}>{l.concept}</td>
                                <td style={RS.td}>{l.act}</td>
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      </div>
                    </div>
                  )}

                  {lvAdv.length>0&&(
                    <div style={{marginBottom:'12px'}}>
                      <h5 style={{fontSize:'0.95rem',fontWeight:800,color:'#1d4ed8',marginBottom:'8px'}}>💬 선배가 들려주는 심화 학습 활동(예시)</h5>
                      <div style={RS.tblWrap}>
                        <table style={RS.tbl} className="print-tight-table">
                          <thead>
                            <tr>
                              <th style={{...RS.thBlue,width:'20%'}}>관심 분야</th>
                              <th style={{...RS.thBlue,width:'35%'}}>주제 탐구 과제</th>
                              <th style={{...RS.thBlue,width:'45%'}}>활동 사례(방법)</th>
                            </tr>
                          </thead>
                          <tbody style={{background:'white'}}>
                            {lvAdv.map((a,i)=>(
                              <tr key={i} style={{borderBottom:'1px solid #dbeafe'}}>
                                <td style={{...RS.tdCenter,fontWeight:800,background:'#eff6ff'}}>{a.int}</td>
                                <td style={RS.td}>{a.topic}</td>
                                <td style={RS.td}>{a.case}</td>
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      </div>
                    </div>
                  )}

                  {lvRec.length>0&&(
                    <div>
                      <h5 style={{fontSize:'0.95rem',fontWeight:800,color:'#1d4ed8',marginBottom:'8px'}}>👍 이런 학생에게 추천해요!</h5>
                      <ul style={RS.ulBox}>
                        {lvRec.map((r,i)=>(
                          <li key={i} style={{display:'flex',gap:'8px',alignItems:'flex-start',marginTop:i>0?'6px':0}}>
                            <span style={{color:'#2563eb',fontWeight:900}}>•</span>
                            <span style={{lineHeight:1.6,fontWeight:500,fontSize:'0.8rem'}}>{r}</span>
                          </li>
                        ))}
                      </ul>
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        </div>

        {/* TOP 이동 고정 버튼 (보고서 화면용 - 좌/우 양쪽 배치) */}
        <button
          onClick={() => window.scrollTo({ top: 0, behavior: 'smooth' })}
          className="fixed bottom-6 right-6 z-[9999] flex items-center justify-center w-14 h-14 bg-slate-800 hover:bg-slate-900 text-white rounded-full shadow-2xl transition-transform hover:-translate-y-1 no-print border-2 border-slate-600 focus:outline-none"
          title="맨 위로 이동"
        >
          <span className="text-2xl font-black leading-none -mt-1">↑</span>
        </button>
        <button
          onClick={() => window.scrollTo({ top: 0, behavior: 'smooth' })}
          className="fixed bottom-6 left-6 z-[9999] flex items-center justify-center w-14 h-14 bg-slate-800 hover:bg-slate-900 text-white rounded-full shadow-2xl transition-transform hover:-translate-y-1 no-print border-2 border-slate-600 focus:outline-none"
          title="맨 위로 이동"
        >
          <span className="text-2xl font-black leading-none -mt-1">↑</span>
        </button>
      </div>
    );
  }

  // 메인 화면 렌더링
  return (
    <div id="main-app" className="min-h-screen bg-slate-50 p-2 md:p-4 xl:p-6 font-sans flex flex-col no-print">

      {/* 알림 팝업 */}
      {alertMessage&&(
        <div className="fixed inset-0 bg-slate-900/70 z-[9999] flex items-center justify-center p-4">
          <div className="bg-white rounded-3xl shadow-2xl p-10 max-w-xl w-full text-center border-t-8 border-red-500">
            <div className="text-7xl mb-6">🛡️</div>
            <h3 className="text-2xl font-black text-slate-900 mb-8 whitespace-pre-wrap leading-relaxed">{alertMessage}</h3>
            <button onClick={()=>setAlertMessage(null)} className="w-full py-4 bg-slate-800 hover:bg-slate-900 text-white font-extrabold text-2xl rounded-2xl transition-colors shadow-lg">확인 후 다시 담기</button>
          </div>
        </div>
      )}

      {/* 과정 변경 확인 팝업 (초기화 경고) */}
      {confirmDialog.isOpen && (
        <div className="fixed inset-0 bg-slate-900/70 z-[9999] flex items-center justify-center p-4">
          <div className="bg-white rounded-3xl shadow-2xl p-8 max-w-md w-full text-center border-t-8 border-yellow-500">
            <div className="text-6xl mb-4">⚠️</div>
            <h3 className="text-xl font-black text-slate-900 mb-6 whitespace-pre-wrap leading-relaxed">{confirmDialog.message}</h3>
            <div className="flex gap-3">
              <button onClick={confirmDialog.onCancel} className="flex-1 py-3 bg-slate-200 hover:bg-slate-300 text-slate-800 font-extrabold text-lg rounded-xl transition-colors">취소</button>
              <button onClick={confirmDialog.onConfirm} className="flex-1 py-3 bg-yellow-500 hover:bg-yellow-600 text-white font-extrabold text-lg rounded-xl transition-colors shadow-md">확인 (초기화)</button>
            </div>
          </div>
        </div>
      )}

      {/* 과목 상세 팝업 */}
      {infoModalSubject&&(
        <div className="fixed z-[1000] bg-white rounded-3xl shadow-[0_30px_60px_rgba(0,0,0,0.4)] border-2 border-blue-400 w-[95%] max-w-[900px] flex flex-col pointer-events-auto draggable-popup" style={{left:`${infoPopupPos.x}px`,top:`${infoPopupPos.y}px`,margin:0}}>
          <div onMouseDown={handleInfoDragStart} onTouchStart={handleInfoDragStart} className="cursor-move flex items-center p-4 lg:p-6 border-b bg-blue-50 rounded-t-3xl select-none" style={{touchAction:'none'}}>
            <button onClick={()=>setInfoModalSubject(null)} className="text-blue-500 hover:text-white hover:bg-blue-500 bg-white border-2 border-blue-200 rounded-full w-10 h-10 flex items-center justify-center text-2xl font-bold transition-colors shadow-sm mr-4 shrink-0">✕</button>
            <h3 className="text-2xl lg:text-3xl font-black text-blue-900 tracking-tight pointer-events-none flex-1 text-left">{infoModalSubject.name}</h3>
          </div>
          <div className="p-4 lg:p-6 space-y-6 rounded-b-3xl max-h-[70vh] overflow-y-auto custom-scrollbar bg-white">
            <div className="flex gap-2 items-center mb-2">
              <span className="bg-slate-100 border border-slate-300 text-slate-700 px-5 py-2 rounded-full font-extrabold text-base">{infoModalSubject.type||'교과군'}</span>
              <span className="bg-blue-100 border border-blue-200 text-blue-800 px-5 py-2 rounded-full font-extrabold text-base">{infoModalSubject.popupData?.selType||'일반 선택'}</span>
            </div>
            
            {getValidYouTubeUrl(infoModalSubject.popupData?.youtube) && (
              <a
                href={getValidYouTubeUrl(infoModalSubject.popupData.youtube)}
                target="_blank"
                rel="noopener noreferrer"
                className="flex items-center justify-center gap-2 bg-red-600 hover:bg-red-700 text-white font-extrabold px-4 py-3 rounded-xl shadow-md transition-colors text-base lg:text-lg w-full"
              >
                ▶ 유튜브에서 과목 안내 영상 보기 (새 창)
              </a>
            )}

            <div className="space-y-3">
              <h4 className="font-extrabold text-[1.3rem] lg:text-[1.5rem] text-blue-800 flex items-center gap-2">ℹ️ 과목 프로필</h4>
              <div className="rounded-xl overflow-hidden border border-blue-200 shadow-sm">
                <table className="w-full border-collapse text-center text-base">
                  <thead><tr className="bg-blue-100 text-blue-900"><th className="p-3 border-r border-b border-blue-200 font-bold w-1/3">절대 평가(성취도)</th><th className="p-3 border-r border-b border-blue-200 font-bold w-1/3">상대 평가</th><th className="p-3 border-b border-blue-200 font-bold w-1/3">2029 수능 출제 과목</th></tr></thead>
                  <tbody className="bg-white"><tr><td className="p-3 border-r border-blue-200 font-medium whitespace-pre-wrap">{infoModalSubject.popupData?.evalAbs||'-'}</td><td className="p-3 border-r border-blue-200 font-medium whitespace-pre-wrap">{infoModalSubject.popupData?.evalRel||'-'}</td><td className="p-3 font-medium whitespace-pre-wrap">{infoModalSubject.csat||'-'}</td></tr></tbody>
                </table>
              </div>
              <div className="text-base lg:text-lg text-slate-700 bg-slate-50 p-5 rounded-xl border leading-relaxed text-left"><p>• {infoModalSubject.popupData?.desc||infoModalSubject.desc||'-'}</p>{infoModalSubject.popupData?.keywords&&!isInvalidData(infoModalSubject.popupData.keywords)&&<p className="mt-2">• <span className="font-bold">주요 키워드:</span> {infoModalSubject.popupData.keywords}</p>}</div>
            </div>

            {validLearn.length>0&&(
              <div className="space-y-3">
                <h4 className="font-extrabold text-[1.3rem] lg:text-[1.5rem] text-blue-800">💡 무엇을 배울 수 있나요?</h4>
                <div className="rounded-xl overflow-hidden border border-blue-200 shadow-sm">
                  <table className="w-full border-collapse text-base">
                    <thead><tr className="bg-blue-100 text-blue-900 text-center"><th className="p-3 border-r border-b border-blue-200 font-bold w-[20%]">대영역</th><th className="p-3 border-r border-b border-blue-200 font-bold w-[35%]">생각 열기 및 핵심 개념</th><th className="p-3 border-b border-blue-200 font-bold w-[45%]">주요 학습 활동(예시)</th></tr></thead>
                    <tbody className="bg-white">{validLearn.map((l,i)=><tr key={i} className="border-b border-blue-100 last:border-0"><td className="p-4 border-r border-blue-200 text-center font-extrabold text-slate-700 bg-blue-50/30">{l.area}</td><td className="p-4 border-r border-blue-200 whitespace-pre-wrap leading-relaxed text-left">{l.concept}</td><td className="p-4 whitespace-pre-wrap leading-relaxed text-left">{l.act}</td></tr>)}</tbody>
                  </table>
                </div>
              </div>
            )}

            {validAdvanced.length>0&&(
              <div className="space-y-3">
                <h4 className="font-extrabold text-[1.3rem] lg:text-[1.5rem] text-blue-800">💬 선배가 들려주는 심화 학습 활동(예시)</h4>
                <div className="rounded-xl overflow-hidden border border-blue-200 shadow-sm">
                  <table className="w-full border-collapse text-base">
                    <thead><tr className="bg-blue-100 text-blue-900 text-center"><th className="p-3 border-r border-b border-blue-200 font-bold w-[20%]">관심 분야</th><th className="p-3 border-r border-b border-blue-200 font-bold w-[35%]">주제 탐구 과제</th><th className="p-3 border-b border-blue-200 font-bold w-[45%]">활동 사례(방법)</th></tr></thead>
                    <tbody className="bg-white">{validAdvanced.map((a,i)=><tr key={i} className="border-b border-blue-100 last:border-0"><td className="p-4 border-r border-blue-200 text-center font-extrabold text-slate-700 bg-blue-50/30">{a.int}</td><td className="p-4 border-r border-blue-200 whitespace-pre-wrap leading-relaxed text-left">{a.topic}</td><td className="p-4 whitespace-pre-wrap leading-relaxed text-left">{a.case}</td></tr>)}</tbody>
                  </table>
                </div>
              </div>
            )}

            {validRecommend.length>0&&(
              <div className="space-y-3">
                <h4 className="font-extrabold text-[1.3rem] lg:text-[1.5rem] text-blue-800">👍 이런 학생에게 추천해요!</h4>
                <ul className="bg-blue-50 p-6 rounded-xl space-y-4 text-lg lg:text-xl text-slate-800 border border-blue-100 shadow-sm">{validRecommend.map((r,i)=><li key={i} className="flex gap-3 items-start"><span className="text-blue-600 font-black text-2xl leading-none">•</span><span className="leading-relaxed font-medium">{r}</span></li>)}</ul>
              </div>
            )}

            {popupRecommenders.length > 0 ? (
              <div>
                <h5 className="font-extrabold text-[1.05rem] text-blue-800 mb-2">🎓 이 과목을 추천하는 계열/학과</h5>
                <div className="rounded-xl overflow-hidden border border-blue-200 shadow-sm max-h-60 overflow-y-auto custom-scrollbar">
                  <table className="w-full border-collapse text-xs border-hidden">
                    <thead className="sticky top-0 shadow-sm">
                      <tr className="bg-blue-100 text-blue-900 text-center">
                        <th className="p-2 border-b border-r border-blue-200 font-bold w-[25%]">추천 구분</th>
                        <th className="p-2 border-b border-r border-blue-200 font-bold w-[35%]">계열명</th>
                        <th className="p-2 border-b border-blue-200 font-bold w-[40%]">학과명</th>
                      </tr>
                    </thead>
                    <tbody className="bg-white">
                      {popupRecommenders.map((rec, i) => (
                        <tr key={i} className="border-b border-blue-100 last:border-0 hover:bg-blue-50/50">
                          <td className="p-2 border-r border-blue-200 text-center font-bold">
                            <span className={`px-2 py-0.5 rounded-md ${rec.type === '공통 추천' ? 'bg-blue-100 text-blue-700' : rec.type === '계열 추천' ? 'bg-green-100 text-green-700' : 'bg-pink-100 text-pink-700'}`}>{rec.type}</span>
                          </td>
                          <td className="p-2 border-r border-blue-200 text-center font-bold text-slate-800">{rec.field}</td>
                          <td className="p-2 text-center font-medium text-slate-700">{rec.major}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            ) : (
              <div>
                <h5 className="font-extrabold text-[1.05rem] text-slate-600 mb-2">🎓 이 과목을 추천하는 계열/학과</h5>
                <div className="bg-slate-50 p-4 rounded-lg border border-slate-200 text-center text-xs text-slate-500 font-medium leading-relaxed">
                  이 과목을 명시적으로 권장하는 특정 계열이나 학과 정보가 없습니다.<br/>(학생의 진로 방향과 흥미에 맞춰 자유롭게 선택할 수 있습니다.)
                </div>
              </div>
            )}
          </div>
        </div>
      )}

      {/* 헤더 */}
      <header className="mb-4 bg-white px-4 py-3 lg:px-6 lg:py-4 rounded-2xl shadow-sm border-l-[8px] border-blue-950 flex flex-col relative z-[250] shrink-0 no-print">
        <div className="flex flex-wrap items-center justify-center md:justify-start gap-2 lg:gap-4">
          <h1 className="text-2xl lg:text-3xl lg:mb-1 font-black text-slate-900 tracking-tight">휘경여자고등학교 과목 선택 시스템</h1>
          <span className="text-base font-bold text-white bg-blue-600 px-3 py-1 rounded-md shadow-sm">(2026학년도 입학생용)</span>
          <span className="text-2xl lg:text-3xl font-black text-blue-700 ml-1 tracking-tight">1학년</span>
          <button onClick={()=>fetchGoogleSheetData(true)} disabled={isLoading} className="ml-auto md:ml-2 flex items-center gap-1.5 text-base font-bold text-slate-700 bg-white border border-slate-300 px-4 py-2 rounded-lg hover:bg-slate-50 shadow-sm disabled:opacity-50">
            🔄 {isLoading?'데이터 로딩 중...':'데이터 최신화'}
          </button>
        </div>
        <div className="flex flex-col xl:flex-row justify-between items-center w-full mt-3 gap-4">
          <div className="flex flex-col items-center xl:items-start gap-1.5">
            <div className="flex flex-wrap justify-center xl:justify-start items-center gap-2">
              <p className="text-sm md:text-base font-medium text-slate-600 break-keep">자료출처: 2026학년도 2022 개정 교육과정 선택 과목 안내서(서울특별시교육청)</p>
              <a href="https://drive.google.com/file/d/1FyQ979JatdFJpU7OVQGU8gvg4_k16Doo/view?usp=sharing" target="_blank" rel="noopener noreferrer" className="flex items-center gap-1 text-sm md:text-base font-bold text-white bg-red-500 border border-red-600 px-3 py-1 rounded-md hover:bg-red-600">⬇ PDF 파일 다운로드</a>
            </div>
            <p className="text-sm md:text-base font-bold text-red-600 break-keep">본 페이지의 내용에 오류가 있을 수도 있으니 책자를 반드시 참고하여 확인 후 과목 선택을 하시길 바랍니다.</p>
          </div>
          
          <div className="flex flex-col lg:flex-row items-center gap-2 lg:gap-3 bg-indigo-50 border border-indigo-200 px-4 py-2.5 rounded-xl shadow-sm w-full xl:w-auto mt-1 xl:mt-0">
            <span className="font-black text-indigo-900 text-sm md:text-base shrink-0 flex items-center gap-1.5">🚀 사용 방법</span>
            <div className="flex flex-wrap justify-center items-center gap-1.5 text-xs md:text-sm font-bold text-slate-700">
              <span className="bg-white px-2.5 py-1 rounded-md border border-indigo-100 shadow-sm"><span className="text-indigo-600 mr-1">1)</span>일반, 과학중점 과정 결정 <span className="text-red-500 font-black">(필수)</span></span>
              <span className="text-indigo-300 font-black">▶</span>
              <span className="bg-white px-2.5 py-1 rounded-md border border-indigo-100 shadow-sm"><span className="text-indigo-600 mr-1">2)</span>희망 계열, 학과 결정 <span className="text-slate-500 font-black">(선택)</span></span>
              <span className="text-indigo-300 font-black">▶</span>
              <span className="bg-white px-2.5 py-1 rounded-md border border-indigo-100 shadow-sm"><span className="text-indigo-600 mr-1">3)</span>과목 선택</span>
              <span className="text-indigo-300 font-black">▶</span>
              <span className="bg-white px-2.5 py-1 rounded-md border border-indigo-100 shadow-sm"><span className="text-indigo-600 mr-1">4)</span>나만의 보고서</span>
            </div>
          </div>
        </div>
      </header>

      {/* Grid 레이아웃을 통해 좌우측 패널 배치 */}
      <main className="grid grid-cols-1 md:grid-cols-2 gap-4 w-full flex-1 relative no-print items-stretch">
        
        {/* ── 왼쪽 패널 ── */}
        <div className={`w-full flex flex-col gap-3 relative ${isRightPanelExpanded ? 'md:hidden' : 'md:flex'}`}>
          {/* 진로 설정 섹션 */}
          <div className="flex flex-col gap-1.5 shrink-0">
            <div className="bg-white p-4 rounded-2xl shadow-sm border-t-4 border-blue-600">
              <h2 className="text-xl lg:text-3xl font-black flex flex-wrap items-center gap-2 text-slate-800 mb-3 lg:mb-4">
                <div className="flex items-center gap-1.5">✦ 나의 진로 및 과정 설정</div>
                <div className="flex flex-wrap items-center gap-1.5 ml-auto">
                  <button onClick={()=>{setSelectedField('none');setSelectedMajor('none');}} className="flex items-center gap-1 text-xs lg:text-base font-extrabold text-slate-600 bg-white px-3 py-2 rounded-lg border border-slate-300 hover:bg-slate-100 shadow-sm">🔄 진로/학과 초기화</button>
                  <button onClick={()=>{
                    setConfirmDialog({
                      isOpen: true,
                      message: "모든 과목 선택 내역을 초기화하시겠습니까?",
                      onConfirm: () => {
                        setSelectedIds([]);
                        setConfirmDialog({ isOpen: false, message: '', onConfirm: null, onCancel: null });
                      },
                      onCancel: () => {
                        setConfirmDialog({ isOpen: false, message: '', onConfirm: null, onCancel: null });
                      }
                    });
                  }} className="flex items-center gap-1 text-xs lg:text-base font-extrabold text-red-600 bg-white px-3 py-2 rounded-lg border border-red-300 hover:bg-red-50 shadow-sm">🗑️ 과목 전체 초기화</button>
                  
                  <div className="flex items-center gap-1">
                    <label className="flex items-center gap-1.5 cursor-pointer text-xs lg:text-base font-extrabold text-emerald-600 bg-emerald-50 px-3 py-2 rounded-lg border border-emerald-200 hover:bg-emerald-100">
                      <input type="checkbox" className="w-4 h-4 text-emerald-600 rounded" checked={isGeneralTrack} onChange={(e)=>handleTrackChange('general', e.target.checked)} /> 일반 과정
                    </label>
                    {isGeneralTrack && (
                      <button onClick={()=>setShowGeneralPopup(!showGeneralPopup)} className={`text-xs lg:text-base font-extrabold px-3 py-2 rounded-lg shadow-sm transition-colors border ${showGeneralPopup ? 'bg-slate-100 text-slate-600 border-slate-300 hover:bg-slate-200' : 'bg-emerald-600 text-white border-emerald-700 hover:bg-emerald-700'}`} title="일반 과정 요건 보기/닫기">
                        {showGeneralPopup ? '요건닫기' : '📋 요건보기'}
                      </button>
                    )}
                  </div>
                  <div className="flex items-center gap-1">
                    <label className="flex items-center gap-1.5 cursor-pointer text-xs lg:text-base font-extrabold text-blue-600 bg-blue-50 px-3 py-2 rounded-lg border border-blue-200 hover:bg-blue-100">
                      <input type="checkbox" className="w-4 h-4 text-blue-600 rounded" checked={isScienceTrack} onChange={(e)=>handleTrackChange('science', e.target.checked)} /> 과학중점 과정
                    </label>
                    {isScienceTrack && (
                      <button onClick={()=>setShowSciencePopup(!showSciencePopup)} className={`text-xs lg:text-base font-extrabold px-3 py-2 rounded-lg shadow-sm transition-colors border ${showSciencePopup ? 'bg-slate-100 text-slate-600 border-slate-300 hover:bg-slate-200' : 'bg-blue-600 text-white border-blue-700 hover:bg-blue-700'}`} title="과학중점 과정 요건 보기/닫기">
                        {showSciencePopup ? '요건닫기' : '📋 요건보기'}
                      </button>
                    )}
                  </div>
                </div>
              </h2>
              <div className="flex flex-col sm:flex-row gap-3 lg:gap-4 mb-3">
                <div className="flex-1">
                  <label className="block text-slate-600 font-extrabold text-sm lg:text-base mb-1.5">1. 희망계열</label>
                  <div className="relative">
                    <select className="w-full appearance-none border border-slate-300 rounded-md p-2 lg:p-3 text-base lg:text-lg font-extrabold text-slate-800 focus:border-blue-500 bg-white" value={selectedField} onChange={(e)=>{setSelectedField(e.target.value);setSelectedMajor('none');}}>
                      {dbFields.map(f=><option key={f.id} value={f.id}>{f.name}</option>)}
                    </select>
                    <span className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none">▼</span>
                  </div>
                </div>
                <div className="flex-1">
                  <label className="block text-slate-600 font-extrabold text-sm lg:text-base mb-1.5">2. 희망 학과</label>
                  <div className="relative">
                    <select className="w-full appearance-none border border-slate-300 rounded-md p-2 lg:p-3 text-base lg:text-lg font-extrabold text-slate-800 focus:border-blue-500 bg-white disabled:bg-slate-100 disabled:text-slate-400" value={selectedMajor} onChange={(e)=>setSelectedMajor(e.target.value)} disabled={selectedField==='none'}>
                      {(dbMajors[selectedField]||dbMajors['none']).map(m=><option key={m.id} value={m.id}>{m.name}</option>)}
                    </select>
                    <span className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none">▼</span>
                  </div>
                </div>
              </div>
              {selectedField!=='none'&&(
                <div className="text-slate-700 font-extrabold text-sm lg:text-base bg-indigo-50 px-4 py-3 rounded-xl flex flex-col w-full shadow-sm border border-indigo-200 mt-2">
                  <div className="flex items-center gap-2 mb-2"><span>ℹ️</span><span>하단 목록에서 추천 과목을 확인하세요!</span></div>
                  <div className="flex flex-col sm:flex-row flex-wrap gap-3 mt-1 sm:ml-6">
                    <span className="text-green-600 flex items-center gap-1.5 text-sm lg:text-base"><span className="w-3 h-3 bg-green-400 rounded-full inline-block animate-pulse"></span> 녹색: 계열 추천</span>
                    {selectedMajor!=='none'&&<><span className="text-pink-600 flex items-center gap-1.5 text-sm lg:text-base"><span className="w-3 h-3 bg-pink-400 rounded-full inline-block animate-pulse"></span> 핑크색: 학과 추천</span><span className="text-blue-600 flex items-center gap-1.5 text-sm lg:text-base"><span className="w-3 h-3 bg-blue-400 rounded-full inline-block animate-pulse"></span> 파란색: 공통 추천</span></>}
                    {isScienceTrack&&<span className="text-teal-600 flex items-center gap-1.5 text-sm lg:text-base"><span className="w-3 h-3 bg-teal-500 rounded-full inline-block animate-pulse"></span> 청록색: 과중 대상</span>}
                  </div>
                </div>
              )}
            </div>

            {/* 학기 탭 */}
            <div className="flex gap-2 overflow-x-auto pb-2 shrink-0 custom-scrollbar mt-1">
              {semesterTabs.map(tab=>{
                const groupsInSem=GROUPS.filter(g=>g.semester===tab.id);
                const isCompleted=groupsInSem.filter(g=>!g.isOptional).every(g=>selectedSubjects.filter(s=>s.group===g.id).length===g.maxPick);
                return (
                  <button key={tab.id} onClick={()=>setActiveSemesterTab(tab.id)}
                    className={`flex-1 min-w-[120px] py-2 px-4 rounded-lg font-extrabold text-sm lg:text-base whitespace-nowrap transition-all shadow-sm flex items-center justify-center gap-1.5 ${activeSemesterTab===tab.id?'bg-blue-700 text-white ring-2 ring-blue-300':'bg-white text-slate-600 hover:bg-blue-50 border-2 border-slate-200'}`}>
                    {tab.label}{isCompleted&&<span className="text-green-400 text-base">✔</span>}
                  </button>
                );
              })}
            </div>
          </div>

          {/* 과목 카드 목록 */}
          <div className="flex-1 w-full pb-10">
            {dbSubjects.length===0&&<div className="bg-white p-8 rounded-2xl text-center text-slate-500 border-2 border-dashed border-slate-300"><p className="text-xl font-bold">시트에서 과목 데이터를 찾지 못했습니다.</p></div>}
            
            {dbSubjects.length>0&&GROUPS.filter(group=>group.semester===activeSemesterTab).map(group=>{
              const groupSubjects=dbSubjects.filter(s=>s.group===group.id);
              const pickedCount=selectedIds.filter(id=>groupSubjects.some(s=>s.id===id)).length;
              const isComplete=pickedCount===group.maxPick;
              if(groupSubjects.length===0) return null;

              let kmeSubjectsMap={'국어':[],'수학':[],'영어':[]}, kmeSubjectsFlat=[], otherSubjects=[], hasKmeSubjects=false;
              if(group.id==='3D'){
                groupSubjects.forEach(s=>{const nType=normalizeType(s.type,s.name);if(['국어','수학','영어'].includes(nType)){kmeSubjectsMap[nType].push(s);hasKmeSubjects=true;}else otherSubjects.push(s);});
              } else if(['2A','2B','3A'].includes(group.id)){
                groupSubjects.forEach(s=>{const nType=normalizeType(s.type,s.name);if(['국어','수학','영어'].includes(nType)){kmeSubjectsFlat.push(s);hasKmeSubjects=true;}else otherSubjects.push(s);});
              } else { otherSubjects=groupSubjects; }

              const renderSubjectCard=(subject)=>{
                const isSelected=selectedIds.includes(subject.id);
                const normSubj=normalizeForMatch(subject.name);
                const isMajorRec=Array.from(majorRecommendedSet).some(rec=>normalizeForMatch(rec)===normSubj);
                const isFieldRec=Array.from(fieldRecommendedSet).some(rec=>normalizeForMatch(rec)===normSubj);
                
                const showMajorRec = isMajorRec;
                const showFieldRec = isFieldRec;
                const showBothRec = showMajorRec && showFieldRec;
                
                const isCsat=subject.csat&&subject.csat.trim()!==''&&!/x|-|해당|미출|없음|아님/i.test(subject.csat);
                const isSharedCampusCard=subject.group==='2E'||subject.group==='2F';
                
                let isScienceTrackTarget = false;
                if (isScienceTrack) {
                  const nType = normalizeType(subject.type, subject.name);
                  if (subject.group === '3D') {
                    if (nType === '과학') {
                      isScienceTrackTarget = true;
                    }
                  } else if (['2A', '2B', '2C', '2D', '3A', '3C'].includes(subject.group)) {
                    const isMentioned = dbConditions.some(cond => {
                      return cond.includes('과학중점') && cond.includes(subject.group) && cond.includes(subject.name);
                    });
                    if (isMentioned && nType !== '제2외국어/한문') isScienceTrackTarget = true;
                  }
                }

                let displayCardName=subject.name;
                if(isSharedCampusCard){
                  if(subject.name.includes('동대부고'))displayCardName=subject.name.replace(/\(동대부고\)/g,'').trim()+' (동국)';
                  else if(subject.name.includes('해성여고'))displayCardName=subject.name.replace(/\(해성여고\)/g,'').trim()+' (해성)';
                  else if(subject.name.includes('휘경여고'))displayCardName=subject.name.replace(/\(휘경여고\)/g,'').trim()+' (휘경)';
                }

                let borderClass='border-2 border-slate-200 hover:border-blue-400';
                let bgClass='bg-white';
                
                if(isSharedCampusCard){bgClass='bg-purple-100';borderClass='border-2 border-purple-300 hover:border-purple-500 shadow-sm';}
                else if(isCsat){bgClass='bg-yellow-50';}
                
                if(isSelected){
                  if(isSharedCampusCard){
                    borderClass='border-[3px] border-purple-600 shadow-md';
                    bgClass='bg-purple-300';
                  } else {
                    borderClass='border-[3px] border-slate-500 shadow-md';
                    bgClass='bg-slate-300';
                  }
                } else if(showBothRec) borderClass='border-[3px] border-blue-500 shadow-[0_0_12px_rgba(59,130,246,0.6)] animate-sparkle-blue';
                else if(showMajorRec) borderClass='border-2 border-pink-400 shadow-[0_0_8px_rgba(236,72,153,0.3)] animate-sparkle-pink';
                else if(showFieldRec) borderClass='border-2 border-green-400 shadow-[0_0_8px_rgba(74,222,128,0.3)] animate-sparkle-green';

                return (
                  <div key={subject.id} className={`relative p-2 lg:p-3 rounded-xl transition-all duration-300 flex flex-col group ${bgClass} ${borderClass}`}>
                    {showFieldRec&&<span className="absolute -top-3 -left-1 bg-green-500 text-white text-[0.7rem] lg:text-[0.75rem] font-bold px-2 py-1 rounded-full shadow-lg z-10">✦ 계열 추천</span>}
                    {showMajorRec&&<span className="absolute -top-3 -right-1 bg-pink-500 text-white text-[0.7rem] lg:text-[0.75rem] font-bold px-2 py-1 rounded-full shadow-lg z-10">✦ 학과 추천</span>}
                    <div className="flex flex-col items-start mb-2 mt-1">
                      {subject.type&&<span className="inline-block bg-slate-200 text-slate-700 text-[0.7rem] lg:text-[0.8rem] font-bold px-1.5 py-0.5 rounded mb-1">{subject.type}</span>}
                      <div className="flex items-center flex-wrap gap-1 justify-between w-full">
                        <h4 className="text-base lg:text-lg font-extrabold text-slate-900 leading-tight break-keep">{displayCardName}</h4>
                        <span className="text-[0.7rem] lg:text-[0.8rem] font-bold text-slate-500 bg-slate-100 px-2 py-1 rounded-md whitespace-nowrap">{subject.credits}학점</span>
                      </div>
                    </div>
                    <div className="flex flex-col gap-1 mt-auto pt-2">
                      {isScienceTrackTarget && (
                        <span className="bg-teal-600 text-white text-[0.7rem] lg:text-[0.75rem] font-black py-0.5 px-2 rounded-md text-center shadow-sm tracking-widest leading-none mb-1">과중 대상</span>
                      )}
                      <div className="flex gap-1.5 w-full">
                        <button onClick={()=>setInfoModalSubject(subject)} className="w-1/2 py-2 rounded-lg font-bold text-sm lg:text-base flex items-center justify-center gap-1 bg-slate-100 hover:bg-slate-200 text-slate-700 border border-slate-200 transition-transform active:scale-95">ℹ️ 안내</button>
                        <button onClick={()=>toggleSubject(subject)} className={`w-1/2 py-2 rounded-lg font-bold text-sm lg:text-base flex items-center justify-center gap-1 transition-transform active:scale-95 shadow-sm border ${isSelected?'bg-slate-800 text-white border-slate-900 hover:bg-slate-900':'bg-blue-600 text-white border-blue-600 hover:bg-blue-700'}`}>
                          {isSelected?'빼기':'담기'}
                        </button>
                      </div>
                    </div>
                  </div>
                );
              };

              return (
                <div key={group.id} className="bg-white p-4 md:p-5 rounded-3xl shadow-sm border-[3px] border-slate-900 mb-4 lg:mb-5 h-fit">
                  <div className="flex justify-between items-center mb-3 pb-2 border-b-2 border-slate-100">
                    <h3 className="text-xl lg:text-2xl font-extrabold text-slate-800">{group.name}</h3>
                    <span className={`text-sm lg:text-base font-bold px-3 py-1.5 rounded-lg ${isComplete?'bg-green-100 text-green-700':'bg-red-100 text-red-600'}`}>{isComplete?'✔ 선택 완료':`선택가능 (${group.maxPick-pickedCount})`}</span>
                  </div>
                  {['2E','2F'].includes(group.id)&&(
                    <div className="bg-yellow-50 text-yellow-800 p-4 rounded-xl mb-5 text-base font-bold flex items-start gap-2 border-2 border-yellow-300 shadow-sm mt-3">
                      <span>ℹ️</span><span className="leading-relaxed">공유캠퍼스(금요일 또는 주말 운영)는 희망자에 한해 모집시기(3월초)에 해당 학교에 시험이나 면접을 본 후 <span className="text-red-600 underline">합격자만 수강이 가능</span>합니다.</span>
                    </div>
                  )}
                  {group.id==='3D'?(
                    <div className="flex flex-col gap-6 mt-6 mb-2">
                      <div className="grid grid-cols-1 lg:grid-cols-3 gap-5">
                        {['국어','수학','영어'].map(type=>{
                          const subjects=kmeSubjectsMap[type];
                          if(!subjects||subjects.length===0) return null;
                          return (
                            <div key={type} className="relative border-2 border-indigo-400 rounded-2xl p-4 bg-indigo-50/30 flex flex-col">
                              <span className="absolute -top-4 left-4 bg-white px-3 py-0.5 text-indigo-700 font-extrabold text-base border border-indigo-200 rounded-md shadow-sm">{type} 필수 택1</span>
                              <div className="grid grid-cols-1 gap-2 mt-3 flex-1">{subjects.map(s=>renderSubjectCard(s))}</div>
                            </div>
                          );
                        })}
                      </div>
                      {otherSubjects.length>0&&(
                        <div className="relative border-2 border-slate-300 rounded-2xl p-4 bg-white mt-3">
                          <span className="absolute -top-4 left-4 bg-white px-3 py-0.5 text-slate-700 font-extrabold text-base border border-slate-200 rounded-md shadow-sm">그 외 선택 과목(선택가능 4)</span>
                          <div className="grid grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-3 mt-3">{otherSubjects.map(s=>renderSubjectCard(s))}</div>
                        </div>
                      )}
                    </div>
                  ):['2A','2B','3A'].includes(group.id)?(
                    <div className="flex flex-col gap-6 mt-6 mb-2">
                      {hasKmeSubjects&&(
                        <div className="relative border-2 border-indigo-400 rounded-2xl p-4 bg-indigo-50/30 flex flex-col">
                          <span className="absolute -top-4 left-4 bg-white px-3 py-0.5 text-indigo-700 font-extrabold text-base border border-indigo-200 rounded-md shadow-sm">최대 1개</span>
                          <div className="grid grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-3 mt-3 flex-1">{kmeSubjectsFlat.map(s=>renderSubjectCard(s))}</div>
                        </div>
                      )}
                      {otherSubjects.length>0&&(
                        <div className="relative border-2 border-slate-300 rounded-2xl p-4 bg-white mt-3">
                          <span className="absolute -top-4 left-4 bg-white px-3 py-0.5 text-slate-700 font-extrabold text-base border border-slate-200 rounded-md shadow-sm">그 외 선택 과목</span>
                          <div className="grid grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-3 mt-3">{otherSubjects.map(s=>renderSubjectCard(s))}</div>
                        </div>
                      )}
                    </div>
                  ):(
                    otherSubjects.length>0&&(
                      <div className="grid grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-3">{otherSubjects.map(s=>renderSubjectCard(s))}</div>
                    )
                  )}
                </div>
              );
            })}
          </div>
        </div>

        {/* ── 오른쪽 패널 ── */}
        <div className={`w-full flex flex-col transition-all duration-300 ${isRightPanelExpanded ? 'md:w-full md:col-span-2' : ''}`}>
          
          {/* 탭 버튼 (2단 그리드 적용) */}
