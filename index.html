          <div className="grid grid-cols-3 md:grid-cols-4 gap-1.5 lg:gap-2 mb-2 border-b-2 border-slate-200 pb-2 no-print sticky top-0 bg-slate-100 z-[150] pt-2">
            {[
              {id:'planner',icon:'📋',label:'나의 편제표'},
              {id:'table',icon:'📊',label:'휘경여고 편제표'},
              {id:'major',icon:'🗺️',label:'학과 가이드'},
              {id:'subject',icon:'📚',label:'선택과목 가이드'},
              {id:'university',icon:'🏛️',label:'대학별 이수권장'},
              {id:'career',icon:'🎓',label:'나의 보고서'},
            ].map(tab=>{
              let activeClass = 'bg-blue-800 text-white shadow-md border-b-4 border-blue-900';
              let inactiveClass = 'bg-white text-slate-600 hover:bg-slate-100 hover:text-slate-900 border border-slate-200 border-b-4 border-b-transparent';

              return (
                <button key={tab.id} onClick={()=>setActiveTab(tab.id)}
                  className={`flex items-center justify-center gap-1 sm:gap-1.5 px-1 sm:px-2 py-2 lg:py-2.5 rounded-xl font-bold text-[0.7rem] sm:text-sm lg:text-base transition-all ${activeTab===tab.id?activeClass:inactiveClass}`}>
                  <span>{tab.icon}</span> <span className="whitespace-nowrap tracking-tight">{tab.label}</span>
                </button>
              );
            })}
            
            <button 
              onClick={() => setIsRightPanelExpanded(!isRightPanelExpanded)}
              className="hidden md:flex items-center justify-center gap-1 sm:gap-1.5 px-1 sm:px-2 py-2 lg:py-2.5 rounded-xl font-bold text-xs sm:text-sm lg:text-base transition-all bg-slate-700 text-white hover:bg-slate-800 shadow-md border-b-4 border-slate-900"
              title={isRightPanelExpanded ? "좌우 화면 분할 복귀" : "우측 탭 화면 전체 확대"}
            >
              <span>{isRightPanelExpanded ? '▶◀' : '◀▶'}</span> 
              <span className="whitespace-nowrap tracking-tight">{isRightPanelExpanded ? '원상복귀' : '화면확대'}</span>
            </button>
          </div>

          {/* 탭 내용들 */}
          <div className="w-full h-full pb-10">
            {activeTab==='planner'&&(
              <div className="bg-white rounded-3xl shadow-xl border border-slate-200 flex flex-col">
                <div className="bg-blue-900 text-white p-4 lg:p-5 shrink-0 flex justify-center xl:justify-start items-center rounded-t-3xl">
                  <h2 className="text-2xl lg:text-4xl font-black tracking-wide">나의 교육과정 편제표</h2>
                </div>
                <div className="p-2 lg:p-4 bg-white rounded-b-3xl">
                  {renderTimetable()}
                </div>
              </div>
            )}

            {activeTab==='table'&&(
              <div className="bg-white rounded-3xl shadow-xl border border-slate-200 flex flex-col p-4 lg:p-6 h-[85vh] min-h-[600px]">
                <div className="bg-blue-900 text-white p-4 lg:p-6 rounded-2xl text-center shrink-0 mb-4 lg:mb-6 shadow-md">
                  <h2 className="text-2xl lg:text-4xl font-black mb-2">📊 휘경여고 편제표</h2>
                  <p className="text-blue-200 text-sm lg:text-xl font-medium mb-4">휘경여자고등학교 2026학년도 입학생 교육과정 편제표입니다.</p>
                  <a href="https://26pyeonjae.edgeone.app/" target="_blank" rel="noopener noreferrer" className="inline-flex items-center gap-2 bg-white text-blue-900 font-extrabold px-5 py-2.5 rounded-xl hover:bg-blue-50 transition-colors shadow-sm text-base">
                    🔗 새 창에서 크게 보기
                  </a>
                </div>
                <div className="flex-1 border-2 border-slate-200 rounded-xl bg-white relative shadow-inner overflow-hidden">
                  <iframe 
                    src="https://26pyeonjae.edgeone.app/" 
                    className="absolute inset-0 w-full h-full border-0 rounded-xl" 
                    title="휘경여고 편제표"
                  ></iframe>
                </div>
              </div>
            )}

            {activeTab==='major'&&(
              <div className="bg-white rounded-3xl shadow-xl border border-slate-200 flex flex-col p-4 lg:p-6">
                <div className="bg-indigo-900 text-white p-6 rounded-2xl text-center shrink-0 mb-6 shadow-md">
                  <h2 className="text-2xl lg:text-4xl font-black mb-2">🗺️ 대학 학과별 가이드북</h2>
                  <p className="text-indigo-200 text-base lg:text-xl font-medium">희망계열과 학과를 선택하여 학과별 상세 정보를 확인하세요.</p>
                </div>
                <div className="flex flex-col xl:flex-row gap-6">
                  <div className="w-full xl:w-1/4 flex flex-col gap-4 bg-slate-50 p-5 rounded-2xl border border-slate-200 h-fit shrink-0 shadow-sm">
                    <div>
                      <label className="block text-slate-800 font-extrabold text-lg lg:text-xl mb-2">1. 희망계열 선택</label>
                      <div className="relative">
                        <select className="w-full appearance-none border-2 border-slate-300 rounded-xl p-3 lg:p-4 text-lg font-bold text-slate-800 focus:border-indigo-500 bg-white" value={guideSelectedField} onChange={(e)=>{setGuideSelectedField(e.target.value);setGuideSelectedMajor('none');}}>
                          <option value="none">계열을 선택해주세요</option>
                          {dbFields.filter(f=>f.id!=='none').map(f=><option key={f.id} value={f.id}>{f.name}</option>)}
                        </select>
                      </div>
                    </div>
                    <div>
                      <label className="block text-slate-800 font-extrabold text-lg lg:text-xl mb-2">2. 희망 학과 선택</label>
                      <div className="relative">
                        <select className="w-full appearance-none border-2 border-slate-300 rounded-xl p-3 lg:p-4 text-lg font-bold text-slate-800 focus:border-blue-500 bg-white disabled:bg-slate-100 disabled:text-slate-400" value={guideSelectedMajor} onChange={(e)=>setGuideSelectedMajor(e.target.value)} disabled={guideSelectedField==='none'}>
                          <option value="none">학과를 선택해주세요</option>
                          {(dbMajors[guideSelectedField]||[]).filter(m=>m.id!=='none').map(m=><option key={m.id} value={m.id}>{m.name}</option>)}
                        </select>
                      </div>
                    </div>
                  </div>
                  <div className="w-full xl:w-3/4 pb-4">
                    {guideSelectedField !== 'none' && dbFieldDetails[guideSelectedField] ? (
                      <div className="flex flex-col gap-6 lg:gap-8">
                        {/* 계열 안내 표 */}
                        <div className="bg-white rounded-2xl shadow-sm border border-indigo-200 overflow-hidden">
                          <div className="bg-indigo-100 border-b border-indigo-200 px-5 py-4">
                            <h3 className="text-xl lg:text-2xl font-black text-indigo-900 flex items-center gap-2">
                              <span className="text-indigo-600">📁</span> {dbFieldDetails[guideSelectedField].name} 계열 안내
                            </h3>
                          </div>
                          <div className="p-0 overflow-x-auto">
                            <table className="w-full border-collapse text-left text-sm lg:text-base min-w-[500px]">
                              <tbody>
                                <tr className="border-b border-slate-200">
                                  <th className="bg-indigo-50/60 w-[25%] p-4 font-extrabold text-indigo-900 border-r border-slate-200">권장 선택과목(일반)</th>
                                  <td className="p-4 text-slate-800 font-medium leading-relaxed whitespace-pre-wrap">{formatReportText(dbFieldDetails[guideSelectedField].recGen)}</td>
                                </tr>
                                <tr className="border-b border-slate-200">
                                  <th className="bg-indigo-50/60 w-[25%] p-4 font-extrabold text-indigo-900 border-r border-slate-200">권장 선택과목(진로)</th>
                                  <td className="p-4 text-slate-800 font-medium leading-relaxed whitespace-pre-wrap">{formatReportText(dbFieldDetails[guideSelectedField].recCar)}</td>
                                </tr>
                                <tr className="border-b border-slate-200">
                                  <th className="bg-indigo-50/60 w-[25%] p-4 font-extrabold text-indigo-900 border-r border-slate-200">권장 선택과목(융합)</th>
                                  <td className="p-4 text-slate-800 font-medium leading-relaxed whitespace-pre-wrap">{formatReportText(dbFieldDetails[guideSelectedField].recConv)}</td>
                                </tr>
                                {dbFieldDetails[guideSelectedField].tip && (
                                  <tr className="border-b border-slate-200">
                                    <th className="bg-amber-100/60 w-[25%] p-4 font-extrabold text-amber-900 border-r border-slate-200">💡 전공 선택을 위한 팁</th>
                                    <td className="p-4 text-slate-800 font-medium leading-relaxed whitespace-pre-wrap">{formatReportText(dbFieldDetails[guideSelectedField].tip)}</td>
                                  </tr>
                                )}
                              </tbody>
                            </table>
                          </div>
                        </div>

                        {/* 학과 안내 표 */}
                        {guideSelectedMajor !== 'none' && dbDepartmentDetails[guideSelectedMajor] && (
                          <div className="bg-white rounded-2xl shadow-sm border border-blue-200 overflow-hidden">
                            <div className="bg-blue-100 border-b border-blue-200 px-5 py-4">
                              <h3 className="text-xl lg:text-2xl font-black text-blue-900 flex items-center gap-2">
                                <span className="text-blue-600">🎓</span> {dbDepartmentDetails[guideSelectedMajor].name} 학과 안내
                              </h3>
                            </div>
                            <div className="p-0 overflow-x-auto">
                              <table className="w-full border-collapse text-left text-sm lg:text-base min-w-[500px]">
                                <tbody>
                                  <tr className="border-b border-slate-200">
                                    <th className="bg-blue-50/60 w-[25%] p-4 font-extrabold text-blue-900 border-r border-slate-200">학과 설명</th>
                                    <td className="p-4 text-slate-800 font-medium leading-relaxed whitespace-pre-wrap">{formatReportText(dbDepartmentDetails[guideSelectedMajor].desc)}</td>
                                  </tr>
                                  <tr className="border-b border-slate-200">
                                    <th className="bg-blue-50/60 w-[25%] p-4 font-extrabold text-blue-900 border-r border-slate-200">이런 학생에게 권한다</th>
                                    <td className="p-4 text-slate-800 font-medium leading-relaxed whitespace-pre-wrap">{formatReportText(dbDepartmentDetails[guideSelectedMajor].recommendStudent)}</td>
                                  </tr>
                                  <tr className="border-b border-slate-200">
                                    <th className="bg-pink-50 w-[25%] p-4 font-extrabold text-pink-900 border-r border-slate-200">권장 선택과목(일반)</th>
                                    <td className="p-4 text-slate-800 font-medium leading-relaxed whitespace-pre-wrap">{formatReportText(dbDepartmentDetails[guideSelectedMajor].recGen)}</td>
                                  </tr>
                                  <tr className="border-b border-slate-200">

      </button>
      <button
        onClick={() => window.scrollTo({ top: 0, behavior: 'smooth' })}
        className="fixed bottom-6 left-6 z-[9999] flex items-center justify-center w-14 h-14 bg-slate-800 hover:bg-slate-900 text-white rounded-full shadow-2xl transition-transform hover:-translate-y-1 no-print border-2 border-slate-600 focus:outline-none"
        title="맨 위로 이동"
      >
        <span className="text-2xl font-black leading-none -mt-1">↑</span>
      </button>

    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
